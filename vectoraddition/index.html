  <script>
    // Resultant is always a distinctive bold red
    const RESULTANT_STYLE = {
      stroke: '#dc2626', // Pure bright red
      name: 'R',
      label: 'R'
    };

    // Curated distinctly separated color families (excluding red, grey, and black hues).
    // Each family represents a distinct chromatic zone so no two vectors look similar.
    const COLOR_FAMILIES = [
      // FIX: removed shades that sat on the border between families (sky #0284c7 vs cyan,
      // orange #f97316/#c2410c vs amber #d97706/#b45309) so every family is visually separate.
      { name: 'blue', colors: ['#2563eb', '#1d4ed8', '#3b82f6'] },       // Royal Blue
      { name: 'green', colors: ['#16a34a', '#15803d'] },                 // Vivid Green
      { name: 'purple', colors: ['#7c3aed', '#6d28d9'] },                // Violet / Purple
      { name: 'orange', colors: ['#ea580c', '#c2410c'] },                // Warm Orange
      { name: 'cyan', colors: ['#0891b2', '#0e7490'] },                  // Deep Cyan / Marine
      { name: 'gold', colors: ['#ca8a04', '#a16207'] },                  // Gold / Mustard
      { name: 'fuchsia', colors: ['#c026d3', '#a21caf'] }                // Bright Magenta / Fuchsia
    ];

    // Selects distinct colors guaranteeing each vector gets a completely different color family
    function pickDistinctFamilyColors(count) {
      // FIX: unbiased Fisher-Yates shuffle (sort(() => Math.random() - 0.5) is skewed)
      const shuffledFamilies = [...COLOR_FAMILIES];
      for (let i = shuffledFamilies.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [shuffledFamilies[i], shuffledFamilies[j]] = [shuffledFamilies[j], shuffledFamilies[i]];
      }
      const chosen = [];
      for (let i = 0; i < count; i++) {
        const family = shuffledFamilies[i % shuffledFamilies.length];
        const randomShade = family.colors[Math.floor(Math.random() * family.colors.length)];
        chosen.push(randomShade);
      }
      return chosen;
    }

    // Helper to calculate minimal angular difference around a full 360° circle
    function minAngularDistance(a1, a2) {
      let diff = Math.abs(a1 - a2) % (Math.PI * 2);
      if (diff > Math.PI) diff = Math.PI * 2 - diff;
      return diff;
    }

    // FIX: one shared angle formatter so canvas, sidebar and resultant always agree
    // (previously 359.6° showed as "360 deg" on canvas but "0 deg" in the sidebar).
    function normalizedAngleDeg(dx, dy, decimals = 0) {
      let deg = Math.atan2(dy, dx) * 180 / Math.PI;
      if (deg < 0) deg += 360;
      const f = Math.pow(10, decimals);
      deg = Math.round(deg * f) / f;
      if (deg >= 360) deg -= 360;
      return deg;
    }

    // State
    const state = {
      vectorCount: 2,
      vectors: [], // Each: { id, dx, dy, tailX, tailY, color, isDragging, targetTailX, targetTailY, animTailX, animTailY }
      origin: { x: 0, y: 0 },
      canvasW: 0, // last known canvas size, used to keep the scene in place on resize
      canvasH: 0,
      pixelsPerGridUnit: 40, // zoom level: pixels per 1 unit
      animToken: 0, // FIX: incremented to cancel any in-flight animation loops
      lastPointer: null,
      showGrid: false,
      snapToGrid: false,
      showComponents: false,
      showAngles: false,
      isAnimating: false,
      animationStep: -1,
      animationProgress: 0,
      animationStartTime: 0,
      isChained: false,
      resultantRevealed: false,
      resultantAnimProgress: 0,
      hoveredVectorIndex: -1,
      draggedVectorIndex: -1,
      dragOffset: { x: 0, y: 0 }
    };

    // DOM Elements
    const canvas = document.getElementById('vectorCanvas');
    const ctx = canvas.getContext('2d');
    const vectorCountBtns = document.querySelectorAll('.vector-count-btn');
    const addVectorsBtn = document.getElementById('addVectorsBtn');
    const resetTailsBtn = document.getElementById('resetTailsBtn');
    const randomizeBtn = document.getElementById('randomizeBtn');
    const showComponentsCheck = document.getElementById('showComponentsCheck');
    const showAnglesCheck = document.getElementById('showAnglesCheck');
    const showGridCheck = document.getElementById('showGridCheck');
    const snapGridCheck = document.getElementById('snapGridCheck');
    const vectorListContainer = document.getElementById('vectorListContainer');
    const resMagEl = document.getElementById('resMag');
    const resAngleEl = document.getElementById('resAngle');
    const resXEl = document.getElementById('resX');
    const resYEl = document.getElementById('resY');
    const resultantStatusBadge = document.getElementById('resultantStatusBadge');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const centerOriginBtn = document.getElementById('centerOriginBtn');

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      // Center origin the first time; afterwards shift the whole scene by half the size
      // change so vectors stay in the same place relative to the canvas center.
      // FIX: previously the origin never moved on resize, pushing vectors off-screen.
      if (state.canvasW === 0 && state.canvasH === 0) {
        state.origin.x = rect.width / 2;
        state.origin.y = rect.height / 2;
      } else {
        translateScene((rect.width - state.canvasW) / 2, (rect.height - state.canvasH) / 2);
      }
      state.canvasW = rect.width;
      state.canvasH = rect.height;
      drawScene();
    }

    // Moves the origin and every vector position (current, animation start and target)
    // by the same offset, so chained/animating layouts stay intact.
    function translateScene(offX, offY) {
      state.origin.x += offX;
      state.origin.y += offY;
      state.vectors.forEach(v => {
        v.tailX += offX; v.tailY += offY;
        v.animTailX += offX; v.animTailY += offY;
        v.targetTailX += offX; v.targetTailY += offY;
      });
    }

    // FIX: zoom now scales the vectors with the grid. Vectors are stored in pixels, so
    // changing pixelsPerGridUnit alone used to change their reported magnitudes.
    function applyZoom(newPixelsPerUnit) {
      const ratio = newPixelsPerUnit / state.pixelsPerGridUnit;
      if (ratio === 1) return;
      const ox = state.origin.x;
      const oy = state.origin.y;
      const scaleX = x => ox + (x - ox) * ratio;
      const scaleY = y => oy + (y - oy) * ratio;
      state.vectors.forEach(v => {
        v.dx *= ratio; v.dy *= ratio;
        v.tailX = scaleX(v.tailX); v.tailY = scaleY(v.tailY);
        v.animTailX = scaleX(v.animTailX); v.animTailY = scaleY(v.animTailY);
        v.targetTailX = scaleX(v.targetTailX); v.targetTailY = scaleY(v.targetTailY);
      });
      state.pixelsPerGridUnit = newPixelsPerUnit;
      updateUI();
      drawScene();
    }

    // FIX: invalidates any running animation loop (move phase or resultant reveal)
    function cancelAnimation() {
      state.animToken++;
      state.isAnimating = false;
      state.animationStep = -1;
    }

    window.addEventListener('resize', resizeCanvas);

    // Helper to generate vectors guaranteed to fit within visible canvas boundaries and avoid overlapping
    function generateBoundedVectorSet(count, originX, originY, chosenColors) {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width > 0 ? rect.width : window.innerWidth;
      const h = rect.height > 0 ? rect.height : window.innerHeight;
      const margin = 50; // Buffer distance from screen edges

      const minX = margin;
      const maxX = w - margin;
      const minY = margin;
      const maxY = h - margin;

      // Adjust average vector lengths based on vector count
      const minUnits = count <= 2 ? 2.5 : (count === 3 ? 2.0 : 1.6);
      const maxUnits = count <= 2 ? 5.0 : (count === 3 ? 3.8 : 3.0);
      const minResultantUnits = 1.3;

      // Minimum angular separation between vectors radiating from origin (in radians)
      // Ensures vectors never overlap or cluster too closely together
      const minAngleSeparation = (count <= 2)
        ? (38 * Math.PI / 180)
        : ((count === 3)
          ? (30 * Math.PI / 180)
          : (24 * Math.PI / 180));

      const subLabels = ['v1', 'v2', 'v3', 'v4', 'v5'];

      // Search for a configuration that keeps all heads, resultant, and clear separations visible
      for (let attempt = 0; attempt < 300; attempt++) {
        const candidateVectors = [];
        const candidateAngles = [];
        let valid = true;
        let chainX = originX;
        let chainY = originY;
        let sumDx = 0;
        let sumDy = 0;

        for (let i = 0; i < count; i++) {
          let angle;
          let angleFound = false;

          // Attempt to find an angle with sufficient angular separation from existing vectors
          for (let aTry = 0; aTry < 35; aTry++) {
            angle = Math.PI * 2 * Math.random();
            let farEnough = true;
            for (const prevAngle of candidateAngles) {
              if (minAngularDistance(angle, prevAngle) < minAngleSeparation) {
                farEnough = false;
                break;
              }
            }
            if (farEnough) {
              angleFound = true;
              break;
            }
          }

          if (!angleFound) {
            valid = false;
            break;
          }
          candidateAngles.push(angle);

          const lengthUnits = minUnits + Math.random() * (maxUnits - minUnits);
          const lengthPx = lengthUnits * state.pixelsPerGridUnit;
          const dx = Math.cos(angle) * lengthPx;
          const dy = Math.sin(angle) * lengthPx; // Math coordinate (+y upwards)

          // Individual vector head at origin
          const soloHeadX = originX + dx;
          const soloHeadY = originY - dy;

          // Head-to-tail chain accumulation
          chainX += dx;
          chainY -= dy;
          sumDx += dx;
          sumDy += dy;

          // Check if individual vector head at origin is within visible screen
          if (soloHeadX < minX || soloHeadX > maxX || soloHeadY < minY || soloHeadY > maxY) {
            valid = false;
            break;
          }

          // Check if chained head position is within visible screen
          if (chainX < minX || chainX > maxX || chainY < minY || chainY > maxY) {
            valid = false;
            break;
          }

          candidateVectors.push({
            id: i,
            name: String.fromCharCode(65 + i),
            label: subLabels[i] || `v${i + 1}`,
            color: chosenColors[i],
            dx: dx,
            dy: dy,
            tailX: originX,
            tailY: originY,
            animTailX: originX,
            animTailY: originY,
            targetTailX: originX,
            targetTailY: originY
          });
        }

        if (valid) {
          const resultantMagUnits = Math.hypot(sumDx, sumDy) / state.pixelsPerGridUnit;
          const resultantTipX = originX + sumDx;
          const resultantTipY = originY - sumDy;

          // Resultant tip must also lie strictly inside screen boundaries and have clear magnitude
          const resultantInBounds = (resultantTipX >= minX && resultantTipX <= maxX &&
                                     resultantTipY >= minY && resultantTipY <= maxY);

          if (resultantInBounds && resultantMagUnits >= minResultantUnits) {
            return candidateVectors;
          }
        }
      }

      // Fallback: angles fanned across a 120° sector so they stay separated but never cancel.
      // FIX: the old fallback spread equal-length vectors evenly around 360°, which always
      // summed to a zero resultant. Lengths are also no longer forced past the safe fit.
      const fallbackVectors = [];
      const baseAngle = Math.random() * Math.PI * 2;
      const fanSpan = (2 * Math.PI) / 3;
      const angleStep = count > 1 ? fanSpan / (count - 1) : 0;
      const safeLen = Math.min((maxX - minX) / (count * 2.2), (maxY - minY) / (count * 2.2));

      for (let i = 0; i < count; i++) {
        const ang = baseAngle + i * angleStep;
        const len = Math.max(safeLen, 15);
        fallbackVectors.push({
          id: i,
          name: String.fromCharCode(65 + i),
          label: subLabels[i] || `v${i + 1}`,
          color: chosenColors[i],
          dx: Math.cos(ang) * len,
          dy: Math.sin(ang) * len,
          tailX: originX,
          tailY: originY,
          animTailX: originX,
          animTailY: originY,
          targetTailX: originX,
          targetTailY: originY
        });
      }
      return fallbackVectors;
    }

    function regenerateVectors(count) {
      cancelAnimation();
      state.vectorCount = count;
      state.isChained = false;
      state.resultantRevealed = false;

      // Select distinctly separated colors across different color families
      const chosenColors = pickDistinctFamilyColors(count);

      state.vectors = generateBoundedVectorSet(count, state.origin.x, state.origin.y, chosenColors);
      updateUI();
      drawScene();
    }

    function resetTailsToOrigin() {
      cancelAnimation();
      state.isChained = false;
      state.resultantRevealed = false;

      state.vectors.forEach(v => {
        v.tailX = state.origin.x;
        v.tailY = state.origin.y;
        v.animTailX = state.origin.x;
        v.animTailY = state.origin.y;
        v.targetTailX = state.origin.x;
        v.targetTailY = state.origin.y;
      });

      updateUI();
      showToast("Reset all vector tails to center origin.");
      drawScene();
    }

    function calculateResultant() {
      let sumDx = 0;
      let sumDy = 0;
      state.vectors.forEach(v => {
        sumDx += v.dx;
        sumDy += v.dy;
      });
      const magPx = Math.hypot(sumDx, sumDy);
      const magUnits = magPx / state.pixelsPerGridUnit;
      // angle in standard degrees [0, 360) or (-180, 180]
      const angleRad = Math.atan2(sumDy, sumDx);
      const angleDeg = normalizedAngleDeg(sumDx, sumDy, 1);

      return {
        dx: sumDx,
        dy: sumDy,
        magnitudeUnits: magUnits,
        magnitudePx: magPx,
        angleDeg: angleDeg,
        angleRad: angleRad
      };
    }

    function easeInOutCubic(t) {
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function startHeadToTailAnimation() {
      if (state.isAnimating || state.vectors.length === 0) return;

      // FIX: each glide starts from where the vector actually is now. After dragging in
      // chained mode the stored start points were stale, making vectors jump.
      state.vectors.forEach(v => {
        v.animTailX = v.tailX;
        v.animTailY = v.tailY;
      });

      // First ensure initial vector 0 starts at origin
      state.vectors[0].tailX = state.origin.x;
      state.vectors[0].tailY = state.origin.y;
      state.vectors[0].animTailX = state.origin.x;
      state.vectors[0].animTailY = state.origin.y;
      state.vectors[0].targetTailX = state.origin.x;
      state.vectors[0].targetTailY = state.origin.y;

      // Compute targets head-to-tail chain
      for (let i = 1; i < state.vectors.length; i++) {
        const prev = state.vectors[i - 1];
        // Target tail of i is target tail of prev + prev.dx, prev.dy (in canvas y: prev.targetTailY - prev.dy)
        state.vectors[i].targetTailX = state.vectors[i - 1].targetTailX + prev.dx;
        state.vectors[i].targetTailY = state.vectors[i - 1].targetTailY - prev.dy;
      }

      const token = ++state.animToken;
      state.isAnimating = true;
      state.animationStep = 1; // vector 0 stays, vector 1 moves first
      state.animationProgress = 0;
      state.animationStartTime = performance.now();
      state.resultantRevealed = false;
      state.resultantAnimProgress = 0;
      state.isChained = false;
      state.hoveredVectorIndex = -1;
      state.draggedVectorIndex = -1;
      canvas.style.cursor = '';

      showToast("Moving vectors into head-to-tail arrangement...");
      requestAnimationFrame(t => animationLoop(t, token));
    }

    function animationLoop(timestamp, token) {
      // FIX: a loop from a cancelled run exits instead of fighting the new one
      if (token !== state.animToken || !state.isAnimating) return;

      const DURATION = 1400; // ms per vector transition (slower glide for educational clarity)
      // FIX: clamp — rAF timestamps can be slightly earlier than performance.now(),
      // which produced negative progress and a small backwards twitch.
      const elapsed = Math.max(0, timestamp - state.animationStartTime);
      const rawProgress = Math.min(elapsed / DURATION, 1.0);
      const eased = easeInOutCubic(rawProgress);

      const currentVec = state.vectors[state.animationStep];
      if (currentVec) {
        // Interpolate between initial position and target position
        currentVec.tailX = currentVec.animTailX + (currentVec.targetTailX - currentVec.animTailX) * eased;
        currentVec.tailY = currentVec.animTailY + (currentVec.targetTailY - currentVec.animTailY) * eased;
      }

      if (rawProgress >= 1.0) {
        // Finalize this vector
        currentVec.tailX = currentVec.targetTailX;
        currentVec.tailY = currentVec.targetTailY;
        currentVec.animTailX = currentVec.targetTailX;
        currentVec.animTailY = currentVec.targetTailY;

        // Move to next vector
        state.animationStep++;
        state.animationStartTime = performance.now();

        if (state.animationStep >= state.vectors.length) {
          // All vectors chained! Reveal resultant
          state.animationStep = -1;
          state.isChained = true;
          revealResultantAnimation(token);
          return;
        }
      }

      drawScene();
      requestAnimationFrame(t => animationLoop(t, token));
    }

    function revealResultantAnimation(token) {
      const RES_DURATION = 1100;
      const startTime = performance.now();
      state.resultantRevealed = true;
      state.resultantAnimProgress = 0;
      showToast("Vectors joined head-to-tail! Resultant vector R drawn from initial tail to final head.");

      function resAnim(time) {
        // FIX: stop if Reset/Randomize/another run cancelled this reveal. Previously this
        // loop kept going and its final "isAnimating = false" froze the next animation.
        if (token !== state.animToken) return;
        const elapsed = Math.max(0, time - startTime);
        const progress = Math.min(elapsed / RES_DURATION, 1.0);
        state.resultantAnimProgress = easeInOutCubic(progress);
        drawScene();

        if (progress < 1.0) {
          requestAnimationFrame(resAnim);
        } else {
          state.isAnimating = false;
          updateUI();
        }
      }
      requestAnimationFrame(resAnim);
    }

    function drawGrid(w, h) {
      if (!state.showGrid) return;

      const gridSize = state.pixelsPerGridUnit;
      ctx.save();
      ctx.lineWidth = 1;
      ctx.strokeStyle = '#e2e8f0'; // slate-200 subtle grid on white

      // Vertical lines
      const startX = state.origin.x % gridSize;
      for (let x = startX; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }

      // Horizontal lines
      const startY = state.origin.y % gridSize;
      for (let y = startY; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Draw Main Axes
      ctx.lineWidth = 1.75;
      ctx.strokeStyle = '#64748b'; // slate-500
      ctx.beginPath();
      // X Axis
      ctx.moveTo(0, state.origin.y);
      ctx.lineTo(w, state.origin.y);
      // Y Axis
      ctx.moveTo(state.origin.x, 0);
      ctx.lineTo(state.origin.x, h);
      ctx.stroke();

      // Small Axis Labels & Origin tick
      ctx.fillStyle = '#64748b';
      ctx.font = '10px "Fira Code", monospace';
      ctx.fillText('+x', w - 24, state.origin.y - 8);
      ctx.fillText('+y', state.origin.x + 8, 20);
      ctx.fillText('(0,0)', state.origin.x + 6, state.origin.y + 14);

      // Unit tick indicators along axes
      ctx.strokeStyle = '#94a3b8';
      for (let x = state.origin.x + gridSize; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, state.origin.y - 3);
        ctx.lineTo(x, state.origin.y + 3);
        ctx.stroke();
      }
      for (let x = state.origin.x - gridSize; x > 0; x -= gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, state.origin.y - 3);
        ctx.lineTo(x, state.origin.y + 3);
        ctx.stroke();
      }
      for (let y = state.origin.y + gridSize; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(state.origin.x - 3, y);
        ctx.lineTo(state.origin.x + 3, y);
        ctx.stroke();
      }
      for (let y = state.origin.y - gridSize; y > 0; y -= gridSize) {
        ctx.beginPath();
        ctx.moveTo(state.origin.x - 3, y);
        ctx.lineTo(state.origin.x + 3, y);
        ctx.stroke();
      }

      ctx.restore();
    }

    function drawArrow(startX, startY, endX, endY, color, isDashed = false, lineWidth = 3.5, maxHeadLength = 15, dashPattern = [6, 5]) {
      const dx = endX - startX;
      const dy = endY - startY;
      const angle = Math.atan2(dy, dx);
      const length = Math.hypot(dx, dy);
      // FIX: nothing to draw for a zero-length arrow (avoids a stray right-pointing head
      // on the first frame of the resultant reveal)
      if (length < 1) return;
      // FIX: the head shrinks on short arrows so it never sticks out behind the tail
      const headLength = Math.min(maxHeadLength, length * 0.6);

      ctx.save();
      ctx.strokeStyle = color;
      ctx.fillStyle = color;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (isDashed) {
        ctx.setLineDash(dashPattern);
      } else {
        ctx.setLineDash([]);
      }

      // Depth of the inner swept curve notch from the arrowhead tip
      const innerNotchDepth = headLength * 0.58;

      // Draw vector body extending smoothly into the arrowhead notch to eliminate any gap
      ctx.beginPath();
      ctx.moveTo(startX, startY);
      const stemEndX = length > headLength ? endX - (innerNotchDepth - 1.5) * Math.cos(angle) : startX;
      const stemEndY = length > headLength ? endY - (innerNotchDepth - 1.5) * Math.sin(angle) : startY;
      ctx.lineTo(stemEndX, stemEndY);
      ctx.stroke();

      // Draw solid filled curved arrowhead with swept wings
      const barbAngle = Math.PI / 5.8;
      const leftX = endX - headLength * Math.cos(angle - barbAngle);
      const leftY = endY - headLength * Math.sin(angle - barbAngle);
      const rightX = endX - headLength * Math.cos(angle + barbAngle);
      const rightY = endY - headLength * Math.sin(angle + barbAngle);
      const notchX = endX - innerNotchDepth * Math.cos(angle);
      const notchY = endY - innerNotchDepth * Math.sin(angle);

      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.moveTo(endX, endY);
      ctx.lineTo(leftX, leftY);
      // Smooth swept curve through the inner notch to the opposite barb
      ctx.quadraticCurveTo(notchX, notchY, rightX, rightY);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function drawVectorComponents(v) {
      if (!state.showComponents) return;
      const headX = v.tailX + v.dx;
      const headY = v.tailY - v.dy; // inverted y for canvas

      // Components are drawn as dashed arrows (1.5px),
      // placed head-to-tail: x-component from the tail, then y-component up/down to the head.
      const COMPONENT_COLOR = v.color; // components match their vector's colour
      const COMPONENT_WIDTH = 1.5;
      const COMPONENT_HEAD = 10;
      const COMPONENT_DASH = [4, 4];

      // X component: (tailX, tailY) -> (headX, tailY)
      drawArrow(v.tailX, v.tailY, headX, v.tailY, COMPONENT_COLOR, true, COMPONENT_WIDTH, COMPONENT_HEAD, COMPONENT_DASH);

      // Y component: (headX, tailY) -> (headX, headY). The tip stops just short of the
      // vector's drag circle so its arrowhead isn't hidden underneath it.
      const HANDLE_CLEARANCE = 9;
      const yLen = Math.abs(headY - v.tailY);
      const yEndY = yLen > HANDLE_CLEARANCE * 2
        ? headY + Math.sign(v.tailY - headY) * HANDLE_CLEARANCE
        : headY;
      drawArrow(headX, v.tailY, headX, yEndY, COMPONENT_COLOR, true, COMPONENT_WIDTH, COMPONENT_HEAD, COMPONENT_DASH);
    }

    function drawAngleArc(v, idx) {
      if (!state.showAngles) return;
      const lengthPx = Math.hypot(v.dx, v.dy);
      if (lengthPx < 25) return;

      // FIX: each vector gets its own arc radius, so arcs sharing a tail (all vectors at
      // the origin) nest instead of piling on top of each other.
      let nestLevel = 0;
      for (let j = 0; j < idx; j++) {
        const o = state.vectors[j];
        if (Math.abs(o.tailX - v.tailX) < 1 && Math.abs(o.tailY - v.tailY) < 1) nestLevel++;
      }
      const arcRadius = Math.min(18 + nestLevel * 9, lengthPx * 0.6);
      let angleRad = Math.atan2(v.dy, v.dx); // standard cartesian
      if (angleRad < 0) angleRad += 2 * Math.PI;
      const isReflex = angleRad > Math.PI;

      ctx.save();
      ctx.lineWidth = 1.5;
      ctx.strokeStyle = v.color;

      // Arc from 0 to -angleRad on canvas (counter-clockwise from +x, as in the sidebar)
      ctx.beginPath();
      if (!isReflex) {
        // Shaded sector for angles up to 180°
        ctx.moveTo(v.tailX, v.tailY);
        ctx.arc(v.tailX, v.tailY, arcRadius, 0, -angleRad, true);
        ctx.closePath();
        ctx.fillStyle = v.color;
        ctx.globalAlpha = 0.15;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      } else {
        // FIX: angles over 180° get an outline arc only, instead of a near-full shaded
        // disc that hid the origin and the other vectors.
        ctx.arc(v.tailX, v.tailY, arcRadius, 0, -angleRad, true);
      }
      ctx.stroke();

      // Angle text, coloured like its vector so it is clear which arc it belongs to
      const deg = normalizedAngleDeg(v.dx, v.dy, 0);
      const textAngle = -angleRad / 2;
      const textDist = arcRadius + 12;
      const tx = v.tailX + Math.cos(textAngle) * textDist;
      const ty = v.tailY + Math.sin(textAngle) * textDist;

      ctx.font = '600 10px "Fira Code", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      drawLabelWithHalo(`${deg} deg`, tx, ty, v.color);
      ctx.restore();
    }

    // Text with a white outline so labels stay readable over grid lines and arrows
    function drawLabelWithHalo(text, x, y, color) {
      ctx.save();
      ctx.lineWidth = 3;
      ctx.strokeStyle = 'rgba(255,255,255,0.9)';
      ctx.lineJoin = 'round';
      ctx.strokeText(text, x, y);
      ctx.fillStyle = color;
      ctx.fillText(text, x, y);
      ctx.restore();
    }

    // FIX: "Angles & Lengths" now also draws each vector's length (in units) beside it
    function drawLengthLabel(tailX, tailY, dx, dy, color) {
      if (!state.showAngles) return;
      const lengthPx = Math.hypot(dx, dy);
      if (lengthPx < 25) return;
      const units = (lengthPx / state.pixelsPerGridUnit).toFixed(1);
      // Midpoint of the arrow on canvas, nudged out along the left-hand normal
      const midX = tailX + dx / 2;
      const midY = tailY - dy / 2;
      const nx = -dy / lengthPx;
      const ny = -dx / lengthPx;
      ctx.save();
      ctx.font = '600 10px "Fira Code", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      drawLabelWithHalo(`${units}`, midX + nx * 12, midY + ny * 12, color);
      ctx.restore();
    }

    function drawDraggableHead(headX, headY, color, isHovered, isDragging) {
      ctx.save();
      const radius = isDragging ? 9 : (isHovered ? 8 : 6.5);

      // Soft glow
      if (isHovered || isDragging) {
        ctx.beginPath();
        ctx.arc(headX, headY, radius + 6, 0, Math.PI * 2);
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.25;
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }

      // Outer circle (white inside on light mode)
      ctx.beginPath();
      ctx.arc(headX, headY, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = color;
      ctx.stroke();

      // Center dot
      ctx.beginPath();
      ctx.arc(headX, headY, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = color;
      ctx.fill();

      ctx.restore();
    }

    function drawScene() {
      const rect = canvas.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      ctx.clearRect(0, 0, w, h);

      // Background Grid
      drawGrid(w, h);

      // Draw Vector Components if enabled
      state.vectors.forEach(v => drawVectorComponents(v));

      // Draw Individual Vectors
      state.vectors.forEach((v, idx) => {
        const headX = v.tailX + v.dx;
        const headY = v.tailY - v.dy;
        const isHovered = state.hoveredVectorIndex === idx;
        const isDragging = state.draggedVectorIndex === idx;

        // Angle sector arc
        drawAngleArc(v, idx);

        // Vector Stem & Arrow
        drawArrow(v.tailX, v.tailY, headX, headY, v.color, false, isHovered || isDragging ? 4.5 : 3.5);
        drawLengthLabel(v.tailX, v.tailY, v.dx, v.dy, v.color);

        // Draggable Arrowhead Handle (only active if not actively animating)
        if (!state.isAnimating) {
          drawDraggableHead(headX, headY, v.color, isHovered, isDragging);
        }
      });

      // Draw Resultant Vector if revealed or chained
      if (state.resultantRevealed && state.vectors.length > 0) {
        const firstVec = state.vectors[0];
        const res = calculateResultant();
        const startX = firstVec.tailX;
        const startY = firstVec.tailY;

        // During reveal animation, animate length from 0 to full
        const animProgress = state.resultantAnimProgress;
        const currentDx = res.dx * animProgress;
        const currentDy = res.dy * animProgress;
        const endX = startX + currentDx;
        const endY = startY - currentDy;

        // Red Resultant Arrow (drawn with same thickness as other vectors)
        drawArrow(startX, startY, endX, endY, RESULTANT_STYLE.stroke, false, 3.5);
        if (animProgress >= 1) {
          drawLengthLabel(startX, startY, res.dx, res.dy, RESULTANT_STYLE.stroke);
        }
      }
    }

    function getCanvasCoordinates(evt) {
      const rect = canvas.getBoundingClientRect();
      const clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
      const clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
      return {
        x: clientX - rect.left,
        y: clientY - rect.top
      };
    }

    function findHoveredHead(pos) {
      const hitRadius = 18;
      for (let i = state.vectors.length - 1; i >= 0; i--) {
        const v = state.vectors[i];
        const headX = v.tailX + v.dx;
        const headY = v.tailY - v.dy;
        const dist = Math.hypot(pos.x - headX, pos.y - headY);
        if (dist <= hitRadius) {
          return i;
        }
      }
      return -1;
    }

    // Pointer Down
    function handlePointerDown(evt) {
      if (state.isAnimating) return;
      const pos = getCanvasCoordinates(evt);
      const hitIndex = findHoveredHead(pos);

      if (hitIndex !== -1) {
        state.draggedVectorIndex = hitIndex;
        const v = state.vectors[hitIndex];
        const headX = v.tailX + v.dx;
        const headY = v.tailY - v.dy;
        state.dragOffset.x = pos.x - headX;
        state.dragOffset.y = pos.y - headY;

        canvas.style.cursor = 'grabbing';
        drawScene();
      }
    }

    // Pointer Move
    function handlePointerMove(evt) {
      const pos = getCanvasCoordinates(evt);
      state.lastPointer = pos;

      if (state.draggedVectorIndex !== -1 && !state.isAnimating) {
        const v = state.vectors[state.draggedVectorIndex];
        let targetHeadX = pos.x - state.dragOffset.x;
        let targetHeadY = pos.y - state.dragOffset.y;

        // Snap to grid if enabled
        if (state.snapToGrid) {
          const gridSize = state.pixelsPerGridUnit;
          targetHeadX = Math.round((targetHeadX - state.origin.x) / gridSize) * gridSize + state.origin.x;
          targetHeadY = Math.round((targetHeadY - state.origin.y) / gridSize) * gridSize + state.origin.y;
        }

        // Calculate new dx, dy relative to tail
        let newDx = targetHeadX - v.tailX;
        let newDy = -(targetHeadY - v.tailY);

        // Limit minimum length so vector doesn't vanish entirely
        const minPx = 15;
        if (Math.hypot(newDx, newDy) < minPx) {
          const ang = Math.atan2(newDy, newDx);
          newDx = Math.cos(ang) * minPx;
          newDy = Math.sin(ang) * minPx;
        }

        v.dx = newDx;
        v.dy = newDy;

        // If currently in chained mode, ripple update the following tails!
        if (state.isChained) {
          for (let i = 1; i < state.vectors.length; i++) {
            const prev = state.vectors[i - 1];
            state.vectors[i].tailX = prev.tailX + prev.dx;
            state.vectors[i].tailY = prev.tailY - prev.dy;
          }
        }

        updateUI();
        drawScene();
      } else if (!state.isAnimating) {
        const hitIndex = findHoveredHead(pos);
        if (hitIndex !== state.hoveredVectorIndex) {
          state.hoveredVectorIndex = hitIndex;
          if (hitIndex !== -1) {
            canvas.style.cursor = 'grab';
          } else {
            canvas.style.cursor = '';
          }
          drawScene();
        }
      }
    }

    // Pointer Up
    function handlePointerUp(evt) {
      if (state.draggedVectorIndex !== -1) {
        state.draggedVectorIndex = -1;
        // FIX: re-check what is under the pointer now. Hover was frozen during the drag,
        // so the cursor could stay as "grab" over empty canvas. Touch has no hover.
        const isTouch = evt && evt.type && evt.type.startsWith('touch');
        state.hoveredVectorIndex = (!isTouch && state.lastPointer) ? findHoveredHead(state.lastPointer) : -1;
        if (state.hoveredVectorIndex !== -1) {
          canvas.style.cursor = 'grab';
        } else {
          canvas.style.cursor = '';
        }
        updateUI(); // clears the dragged-row highlight in the sidebar
        drawScene();
      }
    }

    canvas.addEventListener('mousedown', handlePointerDown);
    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', (e) => {
      handlePointerDown(e);
      e.preventDefault();
    }, { passive: false });
    window.addEventListener('touchmove', handlePointerMove, { passive: true });
    window.addEventListener('touchend', handlePointerUp);

    function updateUI() {
      // Build vector item elements
      vectorListContainer.innerHTML = '';
      state.vectors.forEach((v, idx) => {
        const magUnits = (Math.hypot(v.dx, v.dy) / state.pixelsPerGridUnit).toFixed(1);
        const angDeg = normalizedAngleDeg(v.dx, v.dy, 0);

        const row = document.createElement('div');
        row.className = `p-2 rounded-lg bg-slate-50 border border-slate-200 flex items-center justify-between transition-all ${state.draggedVectorIndex === idx ? 'border-blue-500 bg-blue-50/50 shadow-sm' : ''}`;
        row.innerHTML = `
          <div class="flex items-center space-x-2">
            <span class="w-3 h-3 rounded-full" style="background-color: ${v.color}"></span>
            <span class="font-bold text-slate-800">${v.label}</span>
          </div>
          <div class="flex items-center space-x-3 text-slate-600">
            <span>mag: <strong class="text-slate-800">${magUnits}</strong></span>
            <span>angle: <strong class="text-slate-800">${angDeg} deg</strong></span>
          </div>
        `;
        vectorListContainer.appendChild(row);
      });

      // Update Resultant Values
      const res = calculateResultant();
      resMagEl.textContent = `${res.magnitudeUnits.toFixed(1)}`;
      resAngleEl.textContent = `${res.angleDeg.toFixed(1)} deg`;
      resXEl.textContent = (res.dx / state.pixelsPerGridUnit).toFixed(1);
      resYEl.textContent = (res.dy / state.pixelsPerGridUnit).toFixed(1);

      if (state.isChained) {
        resultantStatusBadge.className = 'text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-800 border border-red-300 font-medium';
        resultantStatusBadge.textContent = 'Head-to-Tail Chained';
        resultantStatusBadge.style.visibility = 'visible';
      } else {
        // No badge before chaining (hidden, not removed, so the card doesn't change height)
        resultantStatusBadge.style.visibility = 'hidden';
      }

      // Update button active state
      vectorCountBtns.forEach(btn => {
        const count = parseInt(btn.getAttribute('data-count'), 10);
        if (count === state.vectorCount) {
          btn.className = "vector-count-btn py-2 px-3 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm border border-blue-600 active:scale-95";
        } else {
          btn.className = "vector-count-btn py-2 px-3 text-xs font-semibold rounded-lg bg-white text-slate-700 hover:bg-slate-100 border border-slate-200 shadow-sm active:scale-95";
        }
      });
    }

    function showToast(msg) {
      // Workspace toast caption removed to keep workspace clear
    }

    // Vector count button events
    vectorCountBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const count = parseInt(btn.getAttribute('data-count'), 10);
        regenerateVectors(count);
      });
    });

    addVectorsBtn.addEventListener('click', () => {
      startHeadToTailAnimation();
    });

    resetTailsBtn.addEventListener('click', () => {
      resetTailsToOrigin();
    });

    randomizeBtn.addEventListener('click', () => {
      regenerateVectors(state.vectorCount);
    });

    showComponentsCheck.addEventListener('change', (e) => {
      state.showComponents = e.target.checked;
      drawScene();
    });

    showAnglesCheck.addEventListener('change', (e) => {
      state.showAngles = e.target.checked;
      drawScene();
    });

    showGridCheck.addEventListener('change', (e) => {
      state.showGrid = e.target.checked;
      drawScene();
    });

    snapGridCheck.addEventListener('change', (e) => {
      state.snapToGrid = e.target.checked;
    });

    // Zoom and pan controls
    zoomInBtn.addEventListener('click', () => {
      applyZoom(Math.min(80, state.pixelsPerGridUnit + 6));
    });

    zoomOutBtn.addEventListener('click', () => {
      applyZoom(Math.max(25, state.pixelsPerGridUnit - 6));
    });

    centerOriginBtn.addEventListener('click', () => {
      // FIX: move the vectors together with the origin. Previously, in chained mode the
      // grid moved to the center but the vectors stayed behind.
      const rect = canvas.getBoundingClientRect();
      translateScene(rect.width / 2 - state.origin.x, rect.height / 2 - state.origin.y);
      drawScene();
    });

    // FIX: redraw once web fonts arrive so canvas labels don't stay in the fallback font
    if (document.fonts) {
      document.fonts.ready.then(() => drawScene());
      document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => drawScene());
    }

    window.onload = function () {
      resizeCanvas();
      regenerateVectors(2);
    };
  </script>
</body>
</html>
