    ctx.restore();
    text("Work by the spring right now:", x + 14, y + 23, 18, "#475569", "left", 600);
    if (cos === null) { text("Block not moving  →  zero", x + 14, y + 51, 18, "#6b7280", "left", 700); return; }
    if (readout.zeroF) { text("zero  (no spring force at equilibrium)", x + 14, y + 51, 18, "#6b7280", "left", 700); return; }
    const deg = Math.round(Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI);
    const word = cos > 0.17 ? "positive" : cos < -0.17 ? "negative" : "≈ zero";
    text(`${word}   (θ = ${deg}° between F`, x + 14, y + 51, 18, col, "left", 700);
    ctx.save(); ctx.font = `700 18px Inter, system-ui, sans-serif`;
    const w1 = ctx.measureText(`${word}   (θ = ${deg}° between F`).width; ctx.restore();
    text("s", x + 14 + w1 + 1, y + 57, 14, col, "left", 700);
    text("and Δx)", x + 14 + w1 + 15, y + 51, 18, col, "left", 700);
  }

  // center of the space to the right of the work readout
  const STATUS_CX = (ROOM.left + 8 + 392 + ROOM.right - 50) / 2;
  function drawStatus() {
    let msg;
    if (!done && active.path.length > 1) return;   // hide the bubble once the block starts moving
    if (done) msg = null;
    else if (active.idx === 0) msg = "Drag block A to the dashed square \u2014 or pull it and let go.";
    else if (active.idx === 1) msg = "Now get block B to the dashed square a different way.";
    else msg = "One more: get block C to the dashed square yet another way.";
    if (msg) {
      ctx.save();
      ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w = ctx.measureText(msg).width + 36;
      // centered across the workspace, 80% of the way from the floor up to the ceiling
      const cx = (ROOM.left + ROOM.right) / 2;
      const cy = ROOM.floor - 0.8 * (ROOM.floor - ROOM.top);
      ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      roundRect(cx - w / 2, cy - 18, w, 36, 18); ctx.fill(); ctx.stroke();
      ctx.restore();
      text(msg, cx, cy, 16, "#475569", "center", 600);
    } else {
      if (bannerHidden) return;
      const cx = STATUS_CX, w = 630, h = 86, y = ROOM.top + 8;
      bannerRect = { x: cx - w / 2, y, w, h };
      ctx.save();
      ctx.fillStyle = "rgba(220,252,231,.96)"; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 3;
      roundRect(cx - w / 2, y, w, h, 14); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("Three different paths — the same work by the spring!", cx, y + 21, 18, "#14532d", "center", 700);
      text("The spring force is conservative: its work depends only on where the object", cx, y + 46, 16, "#166534", "center", 500);
      text("starts and ends, not on the path it takes between them.", cx, y + 66, 16, "#166534", "center", 500);
    }
  }

  function drawPanel() {
    const P = { x: 1160, y: 20, w: 420, h: 708 };
    ctx.save();
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    roundRect(P.x, P.y, P.w, P.h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();

    text("Total Work Done by the Spring", P.x + P.w / 2, P.y + 30, 18, "#0f172a", "center", 700);
    // W_g (J) subtitle
    subText("W", "s", P.x + P.w / 2 - 30, P.y + 54, 15, "#475569");
    text("(J)", P.x + P.w / 2 + 4, P.y + 54, 15, "#475569", "left", 600);

    // axis
    const gx1 = P.x + 78, gx2 = P.x + P.w - 22;
    const gTop = P.y + 84, gBot = P.y + 420;
    // vertical axis rescales so the most negative bar always fits
    const worst = Math.min(0, ...trials.map(t => t.work));
    const need = Math.max(30, -worst * 1.12);
    const step = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(st => need / st <= 7) || 2000;
    const target = -Math.ceil(need / step) * step;
    axisMin += (target - axisMin) * 0.2;
    if (Math.abs(target - axisMin) < 0.05) axisMin = target;
    const vMax = step, vMin = axisMin;
    const yOf = v => gTop + (vMax - v) / (vMax - vMin) * (gBot - gTop);
    for (let v = vMax; v >= vMin - 1e-6; v -= step) {
      const y = yOf(v);
      ctx.strokeStyle = v === 0 ? "#0f172a" : "#e2e8f0";
      ctx.lineWidth = v === 0 ? 2.5 : 1;
      ctx.beginPath(); ctx.moveTo(gx1, y); ctx.lineTo(gx2, y); ctx.stroke();
      text((v < 0 ? "−" : "") + Math.abs(v), gx1 - 10, y, 14, "#475569", "right", v === 0 ? 700 : 400);
    }
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx1, gTop); ctx.lineTo(gx1, gBot); ctx.stroke();

    // bars
    const slotW = (gx2 - gx1) / 3, barW = 64;
    const y0 = yOf(0);
    for (let i = 0; i < 3; i++) {
      const cx = gx1 + slotW * (i + 0.5);
      const t = trials[i];
      // letter label at bottom
      drawBadge(cx, gBot + 26, i, 15);
      if (!t || t.path.length < 2) continue;
      const vClamped = Math.max(vMin, Math.min(vMax, t.work));
      const yv = yOf(vClamped);
      ctx.save();
      ctx.globalAlpha = t.locked ? 1 : 0.55;
      ctx.fillStyle = COLORS[i];
      ctx.fillRect(cx - barW / 2, Math.min(y0, yv), barW, Math.abs(yv - y0));
      ctx.restore();
      const labelY = t.work <= 0 ? yv + 18 : yv - 18;
      text(fmtJ(t.work), cx, Math.min(gBot - 10, labelY), 16, t.locked ? "#0f172a" : "#64748b", "center", 700);
      if (!t.locked && t.path.length > 1) text("In progress", cx, t.work > 0 ? y0 + 15 : y0 - 15, 14, "#64748b", "center", 600);
    }

    // data table
    const ty = gBot + 68;
    text("Path", P.x + 40, ty, 14, "#475569", "left", 700);
    text("Distance traveled", P.x + 200, ty, 14, "#475569", "center", 700);
    subText("W", "s", P.x + 352, ty, 14, "#475569", "center");
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(P.x + 24, ty + 16); ctx.lineTo(P.x + P.w - 24, ty + 14); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const t = trials[i];
      const ry = ty + 38 + i * 32;
      drawBadge(P.x + 54, ry, i, 15);
      text(t && t.dist > 0 ? t.dist.toFixed(2) + " m" : "—", P.x + 200, ry, 16, "#0f172a", "center", 600);
      text(t && t.path.length > 1 ? fmtJ(t.work) : "—", P.x + 352, ry, 16, "#0f172a", "center", 600);
    }

  }

  function draw() {
    physics();
    traceTick();
    drawRoom();
    drawTraces();
    drawTarget();
    for (const t of trials) drawPath(t);
    // earlier blocks wait at the final position as faded ghosts; the spring is attached to the current block
    ctx.save(); ctx.globalAlpha = 0.4;
    for (const t of trials) if (t.locked && (active || t !== trials[trials.length - 1])) drawBlock(t, false);
    ctx.restore();
    drawSpring(active || trials[trials.length - 1]);
    if (!active) drawBlock(trials[trials.length - 1], false);
    readout = null;
    // start marker
    if (active) {
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      ctx.strokeRect(START.x - HALF, START.y - HALF, S, S); ctx.restore();
      drawBlock(active, true);
      drawVectors();
    }
    for (const s of labelSpots()) drawBadge(s.x, s.y, s.idx, 15);
    drawReadout();
    drawStatus();
    drawPanel();
  }

  reset();
  return { reset, draw, down, move, up, hover, outsideClick };
}


/* =====================================================================
   Information button (top right of the workspace) + definitions pop-up
   ===================================================================== */
const INFO = { x: 1140 - 8 - 17, y: 20 + 8 + 17, r: 17 };
const DEFS = [
  [{ t: "A " }, { t: "conservative force", b: true }, { t: " is one in which the work done by the force in moving an object from point A to point B is independent of the path taken." }],
  [{ t: "A " }, { t: "nonconservative force", b: true }, { t: " is one in which the work done by the force in moving an object from point A to point B is dependent on the path taken." }],
];
let infoOpen = false, infoHover = false;

function onInfo(p) { return Math.hypot(p.x - INFO.x, p.y - INFO.y) <= INFO.r + 4; }

// wrap text made of normal/bold pieces; returns the height used (or just measures when draw = false)
function richParagraph(pieces, x, y, maxW, size, lineH, draw) {
  const words = [];
  for (const pc of pieces) pc.t.split(/(\s+)/).forEach(w => { if (w) words.push({ w, b: !!pc.b }); });
  const font = b => `${b ? 700 : 400} ${size}px Inter, system-ui, sans-serif`;
  let cx = x, cy = y;
  ctx.save();
  ctx.textBaseline = "top"; ctx.fillStyle = "#1f2937";
  for (const wd of words) {
    ctx.font = font(wd.b);
    const ww = ctx.measureText(wd.w).width;
    if (/^\s+$/.test(wd.w)) { if (cx > x) cx += ww; continue; }
    if (cx + ww > x + maxW && cx > x) { cx = x; cy += lineH; }
    if (draw) ctx.fillText(wd.w, cx, cy);
    cx += ww;
  }
  ctx.restore();
  return cy - y + lineH;
}

function drawInfo() {
  // button
  ctx.save();
  ctx.fillStyle = infoOpen || infoHover ? "#f1f5f9" : "#ffffff";
  ctx.strokeStyle = "#475569"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(INFO.x, INFO.y, INFO.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  text("i", INFO.x, INFO.y + 1, 20, "#334155", "center", 700);
  if (!infoOpen) return;

  // pop-up
  const W = 470, pad = 20, size = 16, lineH = 23, gap = 14;
  const x = INFO.x + INFO.r - W, y = INFO.y + INFO.r + 10;
  let h = pad * 2 - gap;
  for (const d of DEFS) h += richParagraph(d, 0, 0, W - pad * 2, size, lineH, false) + gap;
  ctx.save();
  ctx.shadowColor = "rgba(15,23,42,.22)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 8;
  ctx.fillStyle = "#ffffff";
  roundRect(x, y, W, h, 12); ctx.fill();
  ctx.restore();
  ctx.save(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5; roundRect(x, y, W, h, 12); ctx.stroke(); ctx.restore();
  let ty = y + pad;
  for (const d of DEFS) ty += richParagraph(d, x + pad, ty, W - pad * 2, size, lineH, true) + gap;
}

/* =====================================================================
   Tabs — to add a new force later, write a Scene function like
   GravityScene (reset/draw/down/move/up/hover) and add it here.
   ===================================================================== */
const SCENES = [
  { id: "gravity", label: "Gravity", make: GravityScene },
  { id: "friction", label: "Friction", make: FrictionScene },
  { id: "tension", label: "Tension", make: TensionScene },
  { id: "spring", label: "Spring Force", make: SpringScene },
];

const tabsEl = document.getElementById("tabs");
let current = null;
const instances = {};

function selectTab(id) {
  const def = SCENES.find(s => s.id === id);
  if (!instances[id]) instances[id] = def.make();
  current = instances[id];
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.id === id));
}
SCENES.forEach(s => {
  const b = document.createElement("button");
  b.className = "tab"; b.textContent = s.label; b.dataset.id = s.id;
  b.onclick = () => selectTab(s.id);
  tabsEl.appendChild(b);
});
document.getElementById("resetBtn").onclick = () => current && current.reset();

/* ---------- pointer input ---------- */
let pid = null;
document.addEventListener("pointerdown", e => { if (e.target !== cv) { infoOpen = false; if (current) current.outsideClick(null); } });
cv.addEventListener("pointerdown", e => {
  const p = toLogical(e);
  if (current) current.outsideClick(p);
  if (onInfo(p)) { infoOpen = !infoOpen; return; }
  if (infoOpen) { infoOpen = false; return; }   // any other click just closes the pop-up
  if (current && current.down(p)) { pid = e.pointerId; cv.setPointerCapture(pid); cv.style.cursor = "grabbing"; }
});
cv.addEventListener("pointermove", e => {
  const p = toLogical(e);
  if (pid !== null && e.pointerId === pid) current.move(p);
  else {
    infoHover = onInfo(p);
    cv.style.cursor = infoHover ? "pointer" : (!infoOpen && current && current.hover(p)) ? "grab" : "default";
  }
});
function release(e) {
  if (pid !== null && e.pointerId === pid) {
    current.up(); pid = null; cv.style.cursor = "default";
  }
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);

/* ---------- render loop ---------- */
function frame() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = "#e9edf2";
  ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  if (current) current.draw();
  drawInfo();
  requestAnimationFrame(frame);
}

resize();
selectTab(SCENES[0].id);
requestAnimationFrame(frame);
})();
</script>
