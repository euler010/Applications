<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Conservative vs. Non-Conservative Forces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #e9edf2; font-family: Inter, system-ui, sans-serif; color: #1f2937; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 1.2vmin; flex-wrap: wrap;
    padding: 1.1vmin 2vmin; background: #1e293b; color: #fff;
    font-size: 16px;
  }
  header h1 { font-size: 18px; margin: 0 1.5vmin 0 0; font-weight: 600; letter-spacing: .02em; }
  .tabs { display: flex; gap: .8vmin; flex: 1; }
  .tab, .reset {
    font: inherit; font-size: 16px; border: none; cursor: pointer; border-radius: .5em;
    padding: .45em 1.1em; transition: background .15s;
  }
  .tab { background: #334155; color: #cbd5e1; }
  .tab:hover { background: #475569; }
  .tab.active { background: #f8fafc; color: #0f172a; font-weight: 600; }
  .reset { background: #ef4444; color: #fff; font-weight: 600; }
  .reset:hover { background: #dc2626; }
  .stage { position: relative; flex: 1; min-height: 0; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
</style>
</head>
<body>
<header>
  <h1>Conservative and Non-Conservative Forces</h1>
  <nav class="tabs" id="tabs"></nav>
  <button class="reset" id="resetBtn">Reset</button>
</header>
<div class="stage" id="stage"><canvas id="cv"></canvas></div>

<script>
(() => {
"use strict";

/* =====================================================================
   Canvas + resolution-independent scaling
   Everything is drawn in a fixed logical space (1600 x 900) and scaled
   uniformly to fit whatever screen the app is shown on.
   ===================================================================== */
const LW = 1600, LH = 748;
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
let scale = 1, offX = 0, offY = 0, dpr = 1;

function resize() {
  dpr = window.devicePixelRatio || 1;
  const w = stage.clientWidth, h = stage.clientHeight;
  cv.width = Math.round(w * dpr);
  cv.height = Math.round(h * dpr);
  scale = Math.min(w / LW, h / LH);
  offX = (w - LW * scale) / 2;
  offY = (h - LH * scale) / 2;
}
window.addEventListener("resize", resize);

function toLogical(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - offX) / scale, y: (e.clientY - r.top - offY) / scale };
}

/* =====================================================================
   Drawing helpers
   ===================================================================== */
function arrow(x1, y1, x2, y2, color, width = 5, head = 18) {
  const a = Math.atan2(y2 - y1, x2 - x1);
  ctx.save();
  ctx.strokeStyle = color; ctx.fillStyle = color;
  ctx.lineWidth = width; ctx.lineCap = "round";
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2 - Math.cos(a) * head * 0.8, y2 - Math.sin(a) * head * 0.8);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - head * Math.cos(a - 0.42), y2 - head * Math.sin(a - 0.42));
  ctx.lineTo(x2 - head * Math.cos(a + 0.42), y2 - head * Math.sin(a + 0.42));
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

// Text with a subscript, e.g. ("F","g") -> F_g
function subText(main, sub, x, y, size, color, align = "left") {
  ctx.save();
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  ctx.font = `italic 600 ${size}px Inter, system-ui, sans-serif`;
  const mw = ctx.measureText(main).width;
  ctx.font = `italic 600 ${Math.max(12, size * 0.75)}px Inter, system-ui, sans-serif`;
  const sw = ctx.measureText(sub).width;
  let sx = x;
  if (align === "center") sx = x - (mw + sw) / 2;
  if (align === "right") sx = x - (mw + sw);
  ctx.font = `italic 600 ${size}px Inter, system-ui, sans-serif`;
  ctx.fillText(main, sx, y);
  ctx.font = `italic 600 ${Math.max(12, size * 0.75)}px Inter, system-ui, sans-serif`;
  ctx.fillText(sub, sx + mw + 1, y + size * 0.3);
  ctx.restore();
}

// Δx label (plain text)
function vecDeltaR(x, y, size, color) {
  ctx.save();
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  ctx.font = `italic 600 ${size}px Inter, system-ui, sans-serif`;
  ctx.fillText("Δx", x, y);
  ctx.restore();
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function text(str, x, y, size, color, align = "left", weight = 400, base = "middle") {
  ctx.save();
  ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = base;
  ctx.font = `${weight} ${size}px Inter, system-ui, sans-serif`;
  ctx.fillText(str, x, y);
  ctx.restore();
}

function fmtJ(v) {
  const r = Math.round(v * 10) / 10;
  return (r === 0 ? "0.0" : (r < 0 ? "−" : "") + Math.abs(r).toFixed(1)) + " J";
}

/* =====================================================================
   SCENE: Gravity (conservative)
   ===================================================================== */
function GravityScene() {
  // --- Room geometry (logical px) ---
  const ROOM = { left: 20, top: 20, right: 1140, floor: 628, bottom: 728 };
  const PPM = 200;              // pixels per meter
  const MASS = 2.0, G = 9.8;    // kg, m/s^2
  const S = 80, HALF = S / 2;   // block size
  const TABLE_H = 1.5;          // table height (m)
  const TABLE = { x1: 70, x2: 310, top: ROOM.floor - TABLE_H * PPM, slab: 18, legW: 18, legInset: 15 };
  const START = { x: (TABLE.x1 + TABLE.x2) / 2, y: TABLE.top - HALF };   // on the table (left)
  const TARGET = { x: 980, y: ROOM.floor - HALF };                        // on the floor (right)
  const SNAP = 18;

  const OBST = [
    { x1: TABLE.x1, y1: TABLE.top, x2: TABLE.x2, y2: TABLE.top + TABLE.slab },
    { x1: TABLE.x1 + TABLE.legInset, y1: TABLE.top + TABLE.slab, x2: TABLE.x1 + TABLE.legInset + TABLE.legW, y2: ROOM.floor },
    { x1: TABLE.x2 - TABLE.legInset - TABLE.legW, y1: TABLE.top + TABLE.slab, x2: TABLE.x2 - TABLE.legInset, y2: ROOM.floor },
  ];
  const BOUNDS = { x1: ROOM.left + HALF, x2: ROOM.right - HALF, y1: ROOM.top + HALF, y2: ROOM.floor - HALF };

  const LETTERS = ["A", "B", "C"];
  const COLORS = ["#2563eb", "#db2777", "#9333ea"];
  const LIGHT = ["#dbeafe", "#fce7f3", "#f3e8ff"];

  let trials, active, dragging, grab, vel, lastMove, done;

  let bannerHidden = false, bannerRect = null;
  // after the activity ends, a click anywhere outside the green banner closes it
  function outsideClick(p) {
    if (!done || bannerHidden || !bannerRect) return;
    const r = bannerRect;
    if (!p || p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h) bannerHidden = true;
  }
  function reset() {
    bannerHidden = false; bannerRect = null;
    trials = [];
    done = false;
    dragging = false;
    newBlock();
  }

  function newBlock() {
    active = {
      idx: trials.length,
      x: START.x, y: START.y,
      path: [{ x: START.x, y: START.y }],
      work: 0, dist: 0, locked: false,
    };
    trials.push(active);
    vel = { x: 0, y: 0 };
    lastMove = 0;
  }

  function overlaps(cx, cy, o) {
    return cx + HALF > o.x1 && cx - HALF < o.x2 && cy + HALF > o.y1 && cy - HALF < o.y2;
  }

  // move along one axis with collision against table pieces + room
  function stepAxis(axis, d) {
    if (axis === "x") {
      let nx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, active.x + d));
      for (const o of OBST) if (overlaps(nx, active.y, o)) nx = d > 0 ? o.x1 - HALF - 0.001 : o.x2 + HALF + 0.001;
      active.x = nx;
    } else {
      let ny = Math.min(BOUNDS.y2, Math.max(BOUNDS.y1, active.y + d));
      for (const o of OBST) if (overlaps(active.x, ny, o)) ny = d > 0 ? o.y1 - HALF - 0.001 : o.y2 + HALF + 0.001;
      active.y = ny;
    }
  }

  function record(ox, oy) {
    const dx = active.x - ox, dy = active.y - oy;
    // W = F·Δx, F_g = (0, +mg) in screen coords (down is +y)
    active.work += MASS * G * (dy / PPM);
    active.dist += Math.hypot(dx, dy) / PPM;
    const last = active.path[active.path.length - 1];
    if (Math.hypot(active.x - last.x, active.y - last.y) > 2) active.path.push({ x: active.x, y: active.y });
  }

  function moveToward(tx, ty) {
    const sx = active.x, sy = active.y;
    const dist = Math.hypot(tx - active.x, ty - active.y);
    const n = Math.max(1, Math.ceil(dist / 3));
    const ddx = (tx - active.x) / n, ddy = (ty - active.y) / n;
    for (let i = 0; i < n; i++) {
      const ox = active.x, oy = active.y;
      stepAxis("x", ddx);
      stepAxis("y", ddy);
      record(ox, oy);
      if (Math.hypot(active.x - TARGET.x, active.y - TARGET.y) < SNAP) { lock(); return; }
    }
    const mx = active.x - sx, my = active.y - sy;
    if (Math.hypot(mx, my) > 0.3) {
      vel.x = vel.x * 0.6 + mx * 0.4;
      vel.y = vel.y * 0.6 + my * 0.4;
      lastMove = performance.now();
    }
  }

  function lock() {
    const ox = active.x, oy = active.y;
    active.x = TARGET.x; active.y = TARGET.y;
    record(ox, oy);
    active.path.push({ x: TARGET.x, y: TARGET.y });
    active.locked = true;
    dragging = false;
    if (trials.length < 3) newBlock();
    else { done = true; active = null; }
  }

  /* ---------- input ---------- */
  function down(p) {
    if (!active || done) return;
    if (Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12) {
      dragging = true;
      grab = { x: p.x - active.x, y: p.y - active.y };
      return true;
    }
  }
  function move(p) {
    if (!dragging || !active) return;
    moveToward(p.x - grab.x, p.y - grab.y);
  }
  function up() { dragging = false; }
  function hover(p) {
    return active && !done && Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12;
  }

  /* ---------- drawing ---------- */
  function drawRoom() {
    // walls / room
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.floor - ROOM.top);
    // faint grid (1 grid square = 0.5 m)
    ctx.save();
    ctx.strokeStyle = "#f1f4f8"; ctx.lineWidth = 1;
    for (let y = ROOM.floor; y > ROOM.top; y -= PPM / 2) { ctx.beginPath(); ctx.moveTo(ROOM.left, y); ctx.lineTo(ROOM.right, y); ctx.stroke(); }
    for (let x = ROOM.left; x < ROOM.right; x += PPM / 2) { ctx.beginPath(); ctx.moveTo(x, ROOM.top); ctx.lineTo(x, ROOM.floor); ctx.stroke(); }
    ctx.restore();
    // floor
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(ROOM.left, ROOM.floor, ROOM.right - ROOM.left, ROOM.bottom - ROOM.floor);
    ctx.save();
    ctx.beginPath(); ctx.rect(ROOM.left, ROOM.floor, ROOM.right - ROOM.left, ROOM.bottom - ROOM.floor); ctx.clip();
    ctx.strokeStyle = "#b4c0cf"; ctx.lineWidth = 3;
    for (let x = ROOM.left - 100; x < ROOM.right + 100; x += 28) { ctx.beginPath(); ctx.moveTo(x, ROOM.bottom); ctx.lineTo(x + 100, ROOM.floor); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = "#475569"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(ROOM.left, ROOM.floor); ctx.lineTo(ROOM.right, ROOM.floor); ctx.stroke();
    // outline
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    ctx.strokeRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);

    // given values
    {
      const cx = (ROOM.left + ROOM.right) / 2, cy = (ROOM.floor + ROOM.bottom) / 2;
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.92)"; roundRect(cx - 160, cy - 20, 320, 40, 10); ctx.fill(); ctx.restore();
      text(`Each block: m = ${MASS.toFixed(1)} kg     g = ${G} m/s²`, cx, cy, 16, "#334155", "center", 600);
    }

    // table
    ctx.fillStyle = "#a16207";
    for (const o of OBST.slice(1)) ctx.fillRect(o.x1, o.y1, o.x2 - o.x1, o.y2 - o.y1);
    ctx.fillStyle = "#b45309";
    roundRect(TABLE.x1, TABLE.top, TABLE.x2 - TABLE.x1, TABLE.slab, 4); ctx.fill();
    ctx.fillStyle = "#d97706";
    ctx.fillRect(TABLE.x1 + 3, TABLE.top + 2, TABLE.x2 - TABLE.x1 - 6, 4);

    // height marker (left of the table)
    const mx = TABLE.x1 - 22, mid = (TABLE.top + ROOM.floor) / 2;
    ctx.save();
    ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.5; ctx.setLineDash([5, 4]);
    ctx.beginPath(); ctx.moveTo(TABLE.x1 - 4, TABLE.top); ctx.lineTo(mx - 8, TABLE.top); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
    arrow(mx, mid, mx, TABLE.top + 4, "#64748b", 2, 10);
    arrow(mx, mid, mx, ROOM.floor - 4, "#64748b", 2, 10);
    ctx.save();
    ctx.translate(mx, mid);
    ctx.fillStyle = "#fff"; ctx.fillRect(-12, -30, 24, 60);
    ctx.rotate(-Math.PI / 2);
    text(TABLE_H.toFixed(1) + " m", 0, 0, 14, "#475569", "center", 600);
    ctx.restore();
  }

  function drawTarget() {
    if (trials.some(t => t.locked)) return;
    ctx.save();
    ctx.setLineDash([10, 7]); ctx.lineWidth = 3; ctx.strokeStyle = "#64748b";
    ctx.strokeRect(TARGET.x - HALF, TARGET.y - HALF, S, S);
    ctx.restore();
  }

  function drawPath(t) {
    if (t.path.length < 2) return;
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.setLineDash(t.locked ? [] : [2, 0]);
    ctx.globalAlpha = t.locked ? 0.9 : 1;
    ctx.beginPath();
    ctx.moveTo(t.path[0].x, t.path[0].y);
    for (let i = 1; i < t.path.length; i++) ctx.lineTo(t.path[i].x, t.path[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // place letter badge at the middle of each finished path, nudged apart
  function labelSpots() {
    const spots = [];
    for (const t of trials) {
      if (!t.locked) continue;
      // find the point halfway along the path
      let total = 0;
      for (let i = 1; i < t.path.length; i++) total += Math.hypot(t.path[i].x - t.path[i - 1].x, t.path[i].y - t.path[i - 1].y);
      const half = total / 2;
      let acc = 0, px = t.path[0].x, py = t.path[0].y, dirx = 1, diry = 0;
      for (let i = 1; i < t.path.length; i++) {
        const a = t.path[i - 1], b = t.path[i];
        const seg = Math.hypot(b.x - a.x, b.y - a.y);
        if (seg > 0.01) { dirx = (b.x - a.x) / seg; diry = (b.y - a.y) / seg; }
        if (acc + seg >= half) { const f = (half - acc) / (seg || 1); px = a.x + (b.x - a.x) * f; py = a.y + (b.y - a.y) * f; break; }
        acc += seg; px = b.x; py = b.y;
      }
      // perpendicular offset (prefer upward side)
      let nx = -diry, ny = dirx;
      if (ny > 0) { nx = -nx; ny = -ny; }
      let lx = px + nx * 26, ly = py + ny * 26;
      for (let k = 0; k < 12; k++) {
        const clash = spots.some(s => Math.hypot(s.x - lx, s.y - ly) < 42);
        if (!clash) break;
        ly -= 38;
      }
      lx = Math.min(ROOM.right - 22, Math.max(ROOM.left + 22, lx));
      ly = Math.min(ROOM.floor - 22, Math.max(ROOM.top + 22, ly));
      spots.push({ x: lx, y: ly, idx: t.idx });
    }
    return spots;
  }

  function drawBadge(x, y, idx, r = 19) {
    ctx.save();
    ctx.fillStyle = COLORS[idx];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    text(LETTERS[idx], x, y + 1, Math.max(14, Math.min(16, Math.round(r * 0.95))), "#fff", "center", 700);
  }

  function drawBlock(t, isActive) {
    const x = t.x - HALF, y = t.y - HALF;
    ctx.save();
    if (isActive) { ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = dragging ? 18 : 8; ctx.shadowOffsetY = dragging ? 8 : 3; }
    ctx.fillStyle = LIGHT[t.idx];
    roundRect(x, y, S, S, 6); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4;
    roundRect(x, y, S, S, 6); ctx.stroke();
    ctx.restore();
    text(LETTERS[t.idx], t.x, t.y - 20, 16, COLORS[t.idx], "center", 700);
  }

  let readout = null;   // {cos, col} while the block is moving, else null
  function drawVectors() {
    readout = null;
    if (!active) return;
    // Weight vector (always shown on the active block)
    const fgLen = 105;
    ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(active.x, active.y, 5, 0, Math.PI * 2); ctx.fill();
    arrow(active.x, active.y, active.x, active.y + fgLen, "#111827", 6, 20);
    ctx.save();
    ctx.fillStyle = "rgba(255,255,255,.85)";
    roundRect(active.x + 10, active.y + fgLen - 28, 36, 26, 6); ctx.fill();
    ctx.restore();
    subText("F", "g", active.x + 14, active.y + fgLen - 17, 16, "#111827");

    // Displacement vector (direction of motion right now)
    const now = performance.now();
    const sp = Math.hypot(vel.x, vel.y);
    if (dragging && now - lastMove < 140 && sp > 0.4) {
      const ux = vel.x / sp, uy = vel.y / sp;
      const cos = uy; // angle between Δx and F_g (F_g points +y)
      const col = cos > 0.17 ? "#16a34a" : cos < -0.17 ? "#dc2626" : "#6b7280";
      const L = 95;
      const sx = active.x, sy = active.y;   // tail starts at the center dot
      arrow(sx, sy, sx + ux * L, sy + uy * L, col, 6, 20);
      const lx = sx + ux * (L + 28), ly = sy + uy * (L + 22);
      ctx.save();
      ctx.fillStyle = "rgba(255,255,255,.85)";
      roundRect(lx - 20, ly - 16, 40, 30, 6); ctx.fill();
      ctx.restore();
      vecDeltaR(lx - 13, ly + 2, 16, col);
      readout = { cos, col };
    }
  }

  function drawReadout() {
    const cos = readout ? readout.cos : null, col = readout ? readout.col : null;
    const x = ROOM.left + 8, y = ROOM.top + 8, w = 392, h = 74;
    ctx.save();
    ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();
    text("Work by gravity right now:", x + 14, y + 23, 18, "#475569", "left", 600);
    if (cos === null) { text("Block not moving  →  zero", x + 14, y + 51, 18, "#6b7280", "left", 700); return; }
    const deg = Math.round(Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI);
    const word = cos > 0.17 ? "positive" : cos < -0.17 ? "negative" : "≈ zero";
    text(`${word}   (θ = ${deg}° between F`, x + 14, y + 51, 18, col, "left", 700);
    ctx.save(); ctx.font = `700 18px Inter, system-ui, sans-serif`;
    const w1 = ctx.measureText(`${word}   (θ = ${deg}° between F`).width; ctx.restore();
    text("g", x + 14 + w1 + 1, y + 57, 14, col, "left", 700);
    text("and Δx)", x + 14 + w1 + 15, y + 51, 18, col, "left", 700);
  }

  // center of the space to the right of the work readout
  const STATUS_CX = (ROOM.left + 8 + 392 + ROOM.right - 50) / 2;
  function drawStatus() {
    let msg;
    if (!done && active.path.length > 1) return;   // hide the bubble once the block starts moving
    if (done) msg = null;
    else if (active.idx === 0) msg = "Drag block A from the table to the dashed square on the floor.";
    else if (active.idx === 1) msg = "Now drag block B along a different path until it lands on block A.";
    else msg = "One more: drag block C along yet another path onto the stack.";
    if (msg) {
      ctx.save();
      ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w = ctx.measureText(msg).width + 36;
      // centered across the workspace, 80% of the way from the floor up to the ceiling
      const cx = (ROOM.left + ROOM.right) / 2;
      const cy = ROOM.floor - 0.8 * (ROOM.floor - ROOM.top);
      ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      roundRect(cx - w / 2, cy - 18, w, 36, 18); ctx.fill(); ctx.stroke();
      ctx.restore();
      text(msg, cx, cy, 16, "#475569", "center", 600);
    } else {
      if (bannerHidden) return;
      const cx = STATUS_CX, w = 630, h = 86, y = ROOM.top + 8;
      bannerRect = { x: cx - w / 2, y, w, h };
      ctx.save();
      ctx.fillStyle = "rgba(220,252,231,.96)"; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 3;
      roundRect(cx - w / 2, y, w, h, 14); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("Three different paths — the same work by gravity!", cx, y + 21, 18, "#14532d", "center", 700);
      text("Gravity is a conservative force: its work depends only on where the object", cx, y + 46, 16, "#166534", "center", 500);
      text("starts and ends, not on the path it takes between them.", cx, y + 66, 16, "#166534", "center", 500);
    }
  }

  function drawPanel() {
    const P = { x: 1160, y: 20, w: 420, h: 708 };
    ctx.save();
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    roundRect(P.x, P.y, P.w, P.h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();

    text("Total Work Done by Gravity", P.x + P.w / 2, P.y + 30, 18, "#0f172a", "center", 700);
    // W_g (J) subtitle
    subText("W", "g", P.x + P.w / 2 - 30, P.y + 54, 15, "#475569");
    text("(J)", P.x + P.w / 2 + 4, P.y + 54, 15, "#475569", "left", 600);

    // axis
    const gx1 = P.x + 78, gx2 = P.x + P.w - 22;
    const gTop = P.y + 84, gBot = P.y + 420;
    const vMax = 40, vMin = -30;
    const yOf = v => gTop + (vMax - v) / (vMax - vMin) * (gBot - gTop);
    for (let v = vMax; v >= vMin; v -= 10) {
      const y = yOf(v);
      ctx.strokeStyle = v === 0 ? "#0f172a" : "#e2e8f0";
      ctx.lineWidth = v === 0 ? 2.5 : 1;
      ctx.beginPath(); ctx.moveTo(gx1, y); ctx.lineTo(gx2, y); ctx.stroke();
      text((v < 0 ? "−" : "") + Math.abs(v), gx1 - 10, y, 14, "#475569", "right", v === 0 ? 700 : 400);
    }
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx1, gTop); ctx.lineTo(gx1, gBot); ctx.stroke();

    // bars
    const slotW = (gx2 - gx1) / 3, barW = 64;
    const y0 = yOf(0);
    for (let i = 0; i < 3; i++) {
      const cx = gx1 + slotW * (i + 0.5);
      const t = trials[i];
      // letter label at bottom
      drawBadge(cx, gBot + 26, i, 15);
      if (!t || t.path.length < 2) continue;
      const vClamped = Math.max(vMin, Math.min(vMax, t.work));
      const yv = yOf(vClamped);
      ctx.save();
      ctx.globalAlpha = t.locked ? 1 : 0.55;
      ctx.fillStyle = COLORS[i];
      ctx.fillRect(cx - barW / 2, Math.min(y0, yv), barW, Math.abs(yv - y0));
      ctx.restore();
      const labelY = t.work <= 0 ? yv + 18 : yv - 18;
      text(fmtJ(t.work), cx, Math.min(gBot - 10, labelY), 16, t.locked ? "#0f172a" : "#64748b", "center", 700);
      if (!t.locked && t.path.length > 1) text("In progress", cx, t.work > 0 ? y0 + 15 : y0 - 15, 14, "#64748b", "center", 600);
    }

    // data table
    const ty = gBot + 68;
    text("Path", P.x + 40, ty, 14, "#475569", "left", 700);
    text("Distance traveled", P.x + 200, ty, 14, "#475569", "center", 700);
    subText("W", "g", P.x + 352, ty, 14, "#475569", "center");
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(P.x + 24, ty + 16); ctx.lineTo(P.x + P.w - 24, ty + 14); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const t = trials[i];
      const ry = ty + 38 + i * 32;
      drawBadge(P.x + 54, ry, i, 15);
      text(t && t.dist > 0 ? t.dist.toFixed(2) + " m" : "—", P.x + 200, ry, 16, "#0f172a", "center", 600);
      text(t && t.path.length > 1 ? fmtJ(t.work) : "—", P.x + 352, ry, 16, "#0f172a", "center", 600);
    }

  }

  function draw() {
    drawRoom();
    drawTarget();
    for (const t of trials) drawPath(t);
    for (const t of trials) if (t.locked) drawBlock(t, false);
    readout = null;
    // start marker
    if (active) {
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      ctx.strokeRect(START.x - HALF, START.y - HALF, S, S); ctx.restore();
      drawBlock(active, true);
      drawVectors();
    }
    for (const s of labelSpots()) drawBadge(s.x, s.y, s.idx, 15);
    drawReadout();
    drawStatus();
    drawPanel();
  }

  reset();
  return { reset, draw, down, move, up, hover, outsideClick };
}


/* =====================================================================
   SCENE: Friction (nonconservative) — top view
   ===================================================================== */
function FrictionScene() {
  // --- Room geometry (logical px) — top view: the whole workspace is floor ---
  const ROOM = { left: 20, top: 20, right: 1140, floor: 728, bottom: 728 };
  const PPM = 200;                       // pixels per meter
  const MASS = 2.0, G = 9.8, MU = 0.30;  // kg, m/s^2, coefficient of kinetic friction
  const FK = MU * MASS * G;              // kinetic friction force (N)
  const S = 80, HALF = S / 2;            // block size
  const START = { x: 120, y: ROOM.bottom - 100 };   // near the bottom left
  const TARGET = { x: 990, y: 190 };                 // near the upper right
  const SNAP = 18;
  const OBST = [];
  const BOUNDS = { x1: ROOM.left + HALF, x2: ROOM.right - HALF, y1: ROOM.top + HALF, y2: ROOM.bottom - HALF };

  const LETTERS = ["A", "B", "C"];
  const COLORS = ["#2563eb", "#db2777", "#9333ea"];
  const LIGHT = ["#dbeafe", "#fce7f3", "#f3e8ff"];

  let trials, active, dragging, grab, vel, lastMove, done;

  let axisMin = -30;
  let bannerHidden = false, bannerRect = null;
  // after the activity ends, a click anywhere outside the green banner closes it
  function outsideClick(p) {
    if (!done || bannerHidden || !bannerRect) return;
    const r = bannerRect;
    if (!p || p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h) bannerHidden = true;
  }
  function reset() {
    bannerHidden = false; bannerRect = null;
    axisMin = -30;
    trials = [];
    done = false;
    dragging = false;
    newBlock();
  }

  function newBlock() {
    active = {
      idx: trials.length,
      x: START.x, y: START.y,
      path: [{ x: START.x, y: START.y }],
      work: 0, dist: 0, locked: false,
    };
    trials.push(active);
    vel = { x: 0, y: 0 };
    lastMove = 0;
  }

  function overlaps(cx, cy, o) {
    return cx + HALF > o.x1 && cx - HALF < o.x2 && cy + HALF > o.y1 && cy - HALF < o.y2;
  }

  // move along one axis with collision against table pieces + room
  function stepAxis(axis, d) {
    if (axis === "x") {
      let nx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, active.x + d));
      for (const o of OBST) if (overlaps(nx, active.y, o)) nx = d > 0 ? o.x1 - HALF - 0.001 : o.x2 + HALF + 0.001;
      active.x = nx;
    } else {
      let ny = Math.min(BOUNDS.y2, Math.max(BOUNDS.y1, active.y + d));
      for (const o of OBST) if (overlaps(active.x, ny, o)) ny = d > 0 ? o.y1 - HALF - 0.001 : o.y2 + HALF + 0.001;
      active.y = ny;
    }
  }

  function record(ox, oy) {
    const dx = active.x - ox, dy = active.y - oy;
    // W = f_k·Δx = −f_k |Δx|  (friction always opposes the motion)
    active.work += -FK * Math.hypot(dx, dy) / PPM;
    active.dist += Math.hypot(dx, dy) / PPM;
    const last = active.path[active.path.length - 1];
    if (Math.hypot(active.x - last.x, active.y - last.y) > 2) active.path.push({ x: active.x, y: active.y });
  }

  function moveToward(tx, ty) {
    const sx = active.x, sy = active.y;
    const dist = Math.hypot(tx - active.x, ty - active.y);
    const n = Math.max(1, Math.ceil(dist / 3));
    const ddx = (tx - active.x) / n, ddy = (ty - active.y) / n;
    for (let i = 0; i < n; i++) {
      const ox = active.x, oy = active.y;
      stepAxis("x", ddx);
      stepAxis("y", ddy);
      record(ox, oy);
      if (Math.hypot(active.x - TARGET.x, active.y - TARGET.y) < SNAP) { lock(); return; }
    }
    const mx = active.x - sx, my = active.y - sy;
    if (Math.hypot(mx, my) > 0.3) {
      vel.x = vel.x * 0.6 + mx * 0.4;
      vel.y = vel.y * 0.6 + my * 0.4;
      lastMove = performance.now();
    }
  }

  function lock() {
    const ox = active.x, oy = active.y;
    active.x = TARGET.x; active.y = TARGET.y;
    record(ox, oy);
    active.path.push({ x: TARGET.x, y: TARGET.y });
    active.locked = true;
    dragging = false;
    if (trials.length < 3) newBlock();
    else { done = true; active = null; }
  }

  /* ---------- input ---------- */
  function down(p) {
    if (!active || done) return;
    if (Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12) {
      dragging = true;
      grab = { x: p.x - active.x, y: p.y - active.y };
      return true;
    }
  }
  function move(p) {
    if (!dragging || !active) return;
    moveToward(p.x - grab.x, p.y - grab.y);
  }
  function up() { dragging = false; }
  function hover(p) {
    return active && !done && Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12;
  }

  /* ---------- drawing ---------- */
  function drawRoom() {
    // floor seen from above
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);
    // floor tiles (1 tile = 0.5 m)
    ctx.save();
    ctx.strokeStyle = "#eef1f5"; ctx.lineWidth = 1.5;
    for (let y = ROOM.bottom; y > ROOM.top; y -= PPM / 2) { ctx.beginPath(); ctx.moveTo(ROOM.left, y); ctx.lineTo(ROOM.right, y); ctx.stroke(); }
    for (let x = ROOM.left; x < ROOM.right; x += PPM / 2) { ctx.beginPath(); ctx.moveTo(x, ROOM.top); ctx.lineTo(x, ROOM.bottom); ctx.stroke(); }
    ctx.restore();
    // outline
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    ctx.strokeRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);

    // given values (bottom center)
    {
      const cx = (ROOM.left + ROOM.right) / 2, cy = ROOM.bottom - 34;
      const p1 = `Each block: m = ${MASS.toFixed(1)} kg     `, p3 = ` = ${MU.toFixed(2)}     g = ${G} m/s²`;
      ctx.save(); ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w1 = ctx.measureText(p1).width, w3 = ctx.measureText(p3).width;
      ctx.font = `italic 600 16px Inter, system-ui, sans-serif`;
      const wm = ctx.measureText("μ").width + ctx.measureText("k").width * 0.75 + 2;
      ctx.restore();
      const tw = w1 + wm + w3, x0 = cx - tw / 2;
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1.5;
      roundRect(x0 - 16, cy - 20, tw + 32, 40, 10); ctx.fill(); ctx.stroke(); ctx.restore();
      text(p1, x0, cy, 16, "#334155", "left", 600);
      subText("μ", "k", x0 + w1, cy, 16, "#334155");
      text(p3, x0 + w1 + wm, cy, 16, "#334155", "left", 600);
    }
    text("View from above", ROOM.right - 14, ROOM.bottom - 20, 14, "#94a3b8", "right", 600);
  }

  function drawTarget() {
    if (trials.some(t => t.locked)) return;
    ctx.save();
    ctx.setLineDash([10, 7]); ctx.lineWidth = 3; ctx.strokeStyle = "#64748b";
    ctx.strokeRect(TARGET.x - HALF, TARGET.y - HALF, S, S);
    ctx.restore();
  }

  function drawPath(t) {
    if (t.path.length < 2) return;
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.setLineDash(t.locked ? [] : [2, 0]);
    ctx.globalAlpha = t.locked ? 0.9 : 1;
    ctx.beginPath();
    ctx.moveTo(t.path[0].x, t.path[0].y);
    for (let i = 1; i < t.path.length; i++) ctx.lineTo(t.path[i].x, t.path[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // place letter badge at the middle of each finished path, nudged apart
  function labelSpots() {
    const spots = [];
    for (const t of trials) {
      if (!t.locked) continue;
      // find the point halfway along the path
      let total = 0;
      for (let i = 1; i < t.path.length; i++) total += Math.hypot(t.path[i].x - t.path[i - 1].x, t.path[i].y - t.path[i - 1].y);
      const half = total / 2;
      let acc = 0, px = t.path[0].x, py = t.path[0].y, dirx = 1, diry = 0;
      for (let i = 1; i < t.path.length; i++) {
        const a = t.path[i - 1], b = t.path[i];
        const seg = Math.hypot(b.x - a.x, b.y - a.y);
        if (seg > 0.01) { dirx = (b.x - a.x) / seg; diry = (b.y - a.y) / seg; }
        if (acc + seg >= half) { const f = (half - acc) / (seg || 1); px = a.x + (b.x - a.x) * f; py = a.y + (b.y - a.y) * f; break; }
        acc += seg; px = b.x; py = b.y;
      }
      // perpendicular offset (prefer upward side)
      let nx = -diry, ny = dirx;
      if (ny > 0) { nx = -nx; ny = -ny; }
      let lx = px + nx * 26, ly = py + ny * 26;
      for (let k = 0; k < 12; k++) {
        const clash = spots.some(s => Math.hypot(s.x - lx, s.y - ly) < 42);
        if (!clash) break;
        ly -= 38;
      }
      lx = Math.min(ROOM.right - 22, Math.max(ROOM.left + 22, lx));
      ly = Math.min(ROOM.floor - 22, Math.max(ROOM.top + 22, ly));
      spots.push({ x: lx, y: ly, idx: t.idx });
    }
    return spots;
  }

  function drawBadge(x, y, idx, r = 19) {
    ctx.save();
    ctx.fillStyle = COLORS[idx];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    text(LETTERS[idx], x, y + 1, Math.max(14, Math.min(16, Math.round(r * 0.95))), "#fff", "center", 700);
  }

  function drawBlock(t, isActive) {
    const x = t.x - HALF, y = t.y - HALF;
    ctx.save();
    if (isActive) { ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = dragging ? 18 : 8; ctx.shadowOffsetY = dragging ? 8 : 3; }
    ctx.fillStyle = LIGHT[t.idx];
    roundRect(x, y, S, S, 6); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4;
    roundRect(x, y, S, S, 6); ctx.stroke();
    ctx.restore();
    text(LETTERS[t.idx], t.x, t.y - 20, 16, COLORS[t.idx], "center", 700);
  }

  let readout = null;   // {cos, col} while the block is moving, else null
  function drawVectors() {
    readout = null;
    if (!active) return;
    ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(active.x, active.y, 5, 0, Math.PI * 2); ctx.fill();

    // Kinetic friction exists only while the block slides: opposite the displacement
    const now = performance.now();
    const sp = Math.hypot(vel.x, vel.y);
    if (dragging && now - lastMove < 140 && sp > 0.4) {
      const ux = vel.x / sp, uy = vel.y / sp;
      const col = "#dc2626";   // θ = 180° → negative work
      const L = 95;
      const sx = active.x, sy = active.y;   // both tails start at the center dot
      // displacement
      arrow(sx, sy, sx + ux * L, sy + uy * L, col, 6, 20);
      let lx = sx + ux * (L + 28), ly = sy + uy * (L + 22);
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 20, ly - 16, 40, 30, 6); ctx.fill(); ctx.restore();
      vecDeltaR(lx - 13, ly + 2, 16, col);
      // kinetic friction
      arrow(sx, sy, sx - ux * L, sy - uy * L, "#111827", 6, 20);
      lx = sx - ux * (L + 28); ly = sy - uy * (L + 22);
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 18, ly - 16, 36, 30, 6); ctx.fill(); ctx.restore();
      subText("f", "k", lx - 10, ly, 16, "#111827");
      readout = { cos: -1, col };
    }
  }

  function drawReadout() {
    const cos = readout ? readout.cos : null, col = readout ? readout.col : null;
    const x = ROOM.left + 8, y = ROOM.top + 8, w = 392, h = 74;
    ctx.save();
    ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();
    text("Work by friction right now:", x + 14, y + 23, 18, "#475569", "left", 600);
    if (cos === null) { text("Block not moving  →  zero", x + 14, y + 51, 18, "#6b7280", "left", 700); return; }
    const deg = Math.round(Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI);
    const word = cos > 0.17 ? "positive" : cos < -0.17 ? "negative" : "≈ zero";
    text(`${word}   (θ = ${deg}° between f`, x + 14, y + 51, 18, col, "left", 700);
    ctx.save(); ctx.font = `700 18px Inter, system-ui, sans-serif`;
    const w1 = ctx.measureText(`${word}   (θ = ${deg}° between f`).width; ctx.restore();
    text("k", x + 14 + w1 + 1, y + 57, 14, col, "left", 700);
    text("and Δx)", x + 14 + w1 + 15, y + 51, 18, col, "left", 700);
  }

  // center of the space to the right of the work readout
  const STATUS_CX = (ROOM.left + 8 + 392 + ROOM.right - 50) / 2;
  function drawStatus() {
    let msg;
    if (!done && active.path.length > 1) return;   // hide the bubble once the block starts moving
    if (done) msg = null;
    else if (active.idx === 0) msg = "Slide block A across the floor to the dashed square.";
    else if (active.idx === 1) msg = "Now drag block B along a different path until it lands on block A.";
    else msg = "One more: drag block C along yet another path onto the stack.";
    if (msg) {
      ctx.save();
      ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w = ctx.measureText(msg).width + 36;
      // centered across the workspace, 80% of the way from the floor up to the ceiling
      const cx = (ROOM.left + ROOM.right) / 2;
      const cy = ROOM.floor - 0.8 * (ROOM.floor - ROOM.top);
      ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      roundRect(cx - w / 2, cy - 18, w, 36, 18); ctx.fill(); ctx.stroke();
      ctx.restore();
      text(msg, cx, cy, 16, "#475569", "center", 600);
    } else {
      if (bannerHidden) return;
      const cx = STATUS_CX, w = 630, h = 86, y = ROOM.top + 8;
      bannerRect = { x: cx - w / 2, y, w, h };
      ctx.save();
      ctx.fillStyle = "rgba(220,252,231,.96)"; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 3;
      roundRect(cx - w / 2, y, w, h, 14); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("Three different paths — different amounts of work by friction!", cx, y + 21, 18, "#14532d", "center", 700);
      text("Friction is a nonconservative force: its work depends on the path taken,", cx, y + 46, 16, "#166534", "center", 500);
      text("not just on where the object starts and ends.", cx, y + 66, 16, "#166534", "center", 500);
    }
  }

  function drawPanel() {
    const P = { x: 1160, y: 20, w: 420, h: 708 };
    ctx.save();
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    roundRect(P.x, P.y, P.w, P.h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();

    text("Total Work Done by Friction", P.x + P.w / 2, P.y + 30, 18, "#0f172a", "center", 700);
    // W_g (J) subtitle
    subText("W", "f", P.x + P.w / 2 - 30, P.y + 54, 15, "#475569");
    text("(J)", P.x + P.w / 2 + 4, P.y + 54, 15, "#475569", "left", 600);

    // axis
    const gx1 = P.x + 78, gx2 = P.x + P.w - 22;
    const gTop = P.y + 84, gBot = P.y + 420;
    // vertical axis rescales so the most negative bar always fits
    const worst = Math.min(0, ...trials.map(t => t.work));
    const need = Math.max(30, -worst * 1.12);
    const step = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(st => need / st <= 7) || 2000;
    const target = -Math.ceil(need / step) * step;
    axisMin += (target - axisMin) * 0.2;
    if (Math.abs(target - axisMin) < 0.05) axisMin = target;
    const vMax = step, vMin = axisMin;
    const yOf = v => gTop + (vMax - v) / (vMax - vMin) * (gBot - gTop);
    for (let v = vMax; v >= vMin - 1e-6; v -= step) {
      const y = yOf(v);
      ctx.strokeStyle = v === 0 ? "#0f172a" : "#e2e8f0";
      ctx.lineWidth = v === 0 ? 2.5 : 1;
      ctx.beginPath(); ctx.moveTo(gx1, y); ctx.lineTo(gx2, y); ctx.stroke();
      text((v < 0 ? "−" : "") + Math.abs(v), gx1 - 10, y, 14, "#475569", "right", v === 0 ? 700 : 400);
    }
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx1, gTop); ctx.lineTo(gx1, gBot); ctx.stroke();

    // bars
    const slotW = (gx2 - gx1) / 3, barW = 64;
    const y0 = yOf(0);
    for (let i = 0; i < 3; i++) {
      const cx = gx1 + slotW * (i + 0.5);
      const t = trials[i];
      // letter label at bottom
      drawBadge(cx, gBot + 26, i, 15);
      if (!t || t.path.length < 2) continue;
      const vClamped = Math.max(vMin, Math.min(vMax, t.work));
      const yv = yOf(vClamped);
      ctx.save();
      ctx.globalAlpha = t.locked ? 1 : 0.55;
      ctx.fillStyle = COLORS[i];
      ctx.fillRect(cx - barW / 2, Math.min(y0, yv), barW, Math.abs(yv - y0));
      ctx.restore();
      const labelY = t.work <= 0 ? yv + 18 : yv - 18;
      text(fmtJ(t.work), cx, Math.min(gBot - 10, labelY), 16, t.locked ? "#0f172a" : "#64748b", "center", 700);
      if (!t.locked && t.path.length > 1) text("In progress", cx, t.work > 0 ? y0 + 15 : y0 - 15, 14, "#64748b", "center", 600);
    }

    // data table
    const ty = gBot + 68;
    text("Path", P.x + 40, ty, 14, "#475569", "left", 700);
    text("Distance traveled", P.x + 200, ty, 14, "#475569", "center", 700);
    subText("W", "f", P.x + 352, ty, 14, "#475569", "center");
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(P.x + 24, ty + 16); ctx.lineTo(P.x + P.w - 24, ty + 14); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const t = trials[i];
      const ry = ty + 38 + i * 32;
      drawBadge(P.x + 54, ry, i, 15);
      text(t && t.dist > 0 ? t.dist.toFixed(2) + " m" : "—", P.x + 200, ry, 16, "#0f172a", "center", 600);
      text(t && t.path.length > 1 ? fmtJ(t.work) : "—", P.x + 352, ry, 16, "#0f172a", "center", 600);
    }

  }

  function draw() {
    drawRoom();
    drawTarget();
    for (const t of trials) drawPath(t);
    for (const t of trials) if (t.locked) drawBlock(t, false);
    readout = null;
    // start marker
    if (active) {
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      ctx.strokeRect(START.x - HALF, START.y - HALF, S, S); ctx.restore();
      drawBlock(active, true);
      drawVectors();
    }
    for (const s of labelSpots()) drawBadge(s.x, s.y, s.idx, 15);
    drawReadout();
    drawStatus();
    drawPanel();
  }

  reset();
  return { reset, draw, down, move, up, hover, outsideClick };
}


/* =====================================================================
   SCENE: Tension (nonconservative) — top view, block pulled by a handle
   ===================================================================== */
function TensionScene() {
  // --- Room geometry (logical px) — top view: the whole workspace is floor ---
  const ROOM = { left: 20, top: 20, right: 1140, floor: 728, bottom: 728 };
  const PPM = 200;                       // pixels per meter
  const MASS = 2.0, G = 9.8, MU = 0.30;  // kg, m/s^2, coefficient of kinetic friction
  const FK = MU * MASS * G;              // kinetic friction force (N)
  const S = 80, HALF = S / 2;            // block size
  const START = { x: 120, y: ROOM.bottom - 100 };   // near the bottom left
  const TARGET = { x: 990, y: 190 };                 // near the upper right
  const SNAP = 18;
  const OBST = [];
  const ROPE = 110;                      // handle length, block center → loop (px)
  const LOOP_R = 11;                     // loop radius (px)
  const DIR0 = (() => { const dx = TARGET.x - START.x, dy = TARGET.y - START.y, d = Math.hypot(dx, dy); return { x: dx / d, y: dy / d }; })();
  const BOUNDS = { x1: ROOM.left + HALF, x2: ROOM.right - HALF, y1: ROOM.top + HALF, y2: ROOM.bottom - HALF };

  const LETTERS = ["A", "B", "C"];
  const COLORS = ["#2563eb", "#db2777", "#9333ea"];
  const LIGHT = ["#dbeafe", "#fce7f3", "#f3e8ff"];

  let trials, active, dragging, grab, vel, lastMove, done;

  let axisMax = 30;
  let bannerHidden = false, bannerRect = null;
  // after the activity ends, a click anywhere outside the green banner closes it
  function outsideClick(p) {
    if (!done || bannerHidden || !bannerRect) return;
    const r = bannerRect;
    if (!p || p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h) bannerHidden = true;
  }
  function reset() {
    bannerHidden = false; bannerRect = null;
    axisMax = 30;
    trials = [];
    done = false;
    dragging = false;
    newBlock();
  }

  function newBlock() {
    active = {
      idx: trials.length,
      x: START.x, y: START.y,
      path: [{ x: START.x, y: START.y }],
      work: 0, dist: 0, locked: false,
      hx: START.x + DIR0.x * ROPE, hy: START.y + DIR0.y * ROPE,   // loop position
    };
    trials.push(active);
    vel = { x: 0, y: 0 };
    lastMove = 0;
  }

  function overlaps(cx, cy, o) {
    return cx + HALF > o.x1 && cx - HALF < o.x2 && cy + HALF > o.y1 && cy - HALF < o.y2;
  }

  // move along one axis with collision against table pieces + room
  function stepAxis(axis, d) {
    if (axis === "x") {
      let nx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, active.x + d));
      for (const o of OBST) if (overlaps(nx, active.y, o)) nx = d > 0 ? o.x1 - HALF - 0.001 : o.x2 + HALF + 0.001;
      active.x = nx;
    } else {
      let ny = Math.min(BOUNDS.y2, Math.max(BOUNDS.y1, active.y + d));
      for (const o of OBST) if (overlaps(active.x, ny, o)) ny = d > 0 ? o.y1 - HALF - 0.001 : o.y2 + HALF + 0.001;
      active.y = ny;
    }
  }

  function record(ox, oy) {
    const dx = active.x - ox, dy = active.y - oy;
    // W = T·Δx, with T along the handle (toward the loop) and |T| = f_k (pulled at constant speed)
    const rx = active.hx - active.x, ry = active.hy - active.y, rl = Math.hypot(rx, ry) || 1;
    active.work += FK * (rx * dx + ry * dy) / rl / PPM;
    active.dist += Math.hypot(dx, dy) / PPM;
    const last = active.path[active.path.length - 1];
    if (Math.hypot(active.x - last.x, active.y - last.y) > 2) active.path.push({ x: active.x, y: active.y });
  }

  function moveToward(tx, ty) {
    const sx = active.x, sy = active.y;
    const dist = Math.hypot(tx - active.x, ty - active.y);
    const n = Math.max(1, Math.ceil(dist / 3));
    const ddx = (tx - active.x) / n, ddy = (ty - active.y) / n;
    for (let i = 0; i < n; i++) {
      const ox = active.x, oy = active.y;
      stepAxis("x", ddx);
      stepAxis("y", ddy);
      record(ox, oy);
      if (Math.hypot(active.x - TARGET.x, active.y - TARGET.y) < SNAP) { lock(); return; }
    }
    const mx = active.x - sx, my = active.y - sy;
    if (Math.hypot(mx, my) > 0.3) {
      vel.x = vel.x * 0.6 + mx * 0.4;
      vel.y = vel.y * 0.6 + my * 0.4;
      lastMove = performance.now();
    }
  }

  function lock() {
    const ox = active.x, oy = active.y;
    active.hx += TARGET.x - ox; active.hy += TARGET.y - oy;
    active.x = TARGET.x; active.y = TARGET.y;
    record(ox, oy);
    active.path.push({ x: TARGET.x, y: TARGET.y });
    active.locked = true;
    dragging = false;
    if (trials.length < 3) newBlock();
    else { done = true; active = null; }
  }

  /* ---------- input ---------- */
  function onLoop(p) { return active && !done && Math.hypot(p.x - active.hx, p.y - active.hy) <= LOOP_R + 14; }
  function down(p) {
    if (!onLoop(p)) return;
    dragging = true;
    grab = { x: p.x - active.hx, y: p.y - active.hy };
    return true;
  }
  function move(p) {
    if (!dragging || !active) return;
    const blk = active;
    // where the user has pulled the loop (kept inside the room)
    blk.hx = Math.min(ROOM.right - LOOP_R, Math.max(ROOM.left + LOOP_R, p.x - grab.x));
    blk.hy = Math.min(ROOM.bottom - LOOP_R, Math.max(ROOM.top + LOOP_R, p.y - grab.y));
    const d = Math.hypot(blk.hx - blk.x, blk.hy - blk.y);
    if (d > ROPE) {
      // handle is taut: the block is pulled along the handle toward the loop
      const ux = (blk.hx - blk.x) / d, uy = (blk.hy - blk.y) / d;
      moveToward(blk.hx - ux * ROPE, blk.hy - uy * ROPE);
      if (blk.locked) return;
      const d2 = Math.hypot(blk.hx - blk.x, blk.hy - blk.y);
      if (d2 > ROPE) { blk.hx = blk.x + (blk.hx - blk.x) / d2 * ROPE; blk.hy = blk.y + (blk.hy - blk.y) / d2 * ROPE; }
    }
  }
  function up() { dragging = false; }
  function hover(p) { return onLoop(p); }

  /* ---------- drawing ---------- */
  function drawRoom() {
    // floor seen from above
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);
    // floor tiles (1 tile = 0.5 m)
    ctx.save();
    ctx.strokeStyle = "#eef1f5"; ctx.lineWidth = 1.5;
    for (let y = ROOM.bottom; y > ROOM.top; y -= PPM / 2) { ctx.beginPath(); ctx.moveTo(ROOM.left, y); ctx.lineTo(ROOM.right, y); ctx.stroke(); }
    for (let x = ROOM.left; x < ROOM.right; x += PPM / 2) { ctx.beginPath(); ctx.moveTo(x, ROOM.top); ctx.lineTo(x, ROOM.bottom); ctx.stroke(); }
    ctx.restore();
    // outline
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    ctx.strokeRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);

    // given values (bottom center)
    {
      const cx = (ROOM.left + ROOM.right) / 2, cy = ROOM.bottom - 34;
      const p1 = "Each block is pulled at constant speed, so  T = f", p3 = ` = ${FK.toFixed(2)} N`;
      ctx.save(); ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w1 = ctx.measureText(p1).width, w3 = ctx.measureText(p3).width;
      ctx.font = `600 12px Inter, system-ui, sans-serif`;
      const wm = ctx.measureText("k").width + 2;
      ctx.restore();
      const tw = w1 + wm + w3, x0 = cx - tw / 2;
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.92)"; ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1.5;
      roundRect(x0 - 16, cy - 20, tw + 32, 40, 10); ctx.fill(); ctx.stroke(); ctx.restore();
      text(p1, x0, cy, 16, "#334155", "left", 600);
      text("k", x0 + w1 + 1, cy + 5, 12, "#334155", "left", 600);
      text(p3, x0 + w1 + wm, cy, 16, "#334155", "left", 600);
    }
    text("View from above", ROOM.right - 14, ROOM.bottom - 20, 14, "#94a3b8", "right", 600);
  }

  function drawTarget() {
    if (trials.some(t => t.locked)) return;
    ctx.save();
    ctx.setLineDash([10, 7]); ctx.lineWidth = 3; ctx.strokeStyle = "#64748b";
    ctx.strokeRect(TARGET.x - HALF, TARGET.y - HALF, S, S);
    ctx.restore();
  }

  function drawPath(t) {
    if (t.path.length < 2) return;
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.setLineDash(t.locked ? [] : [2, 0]);
    ctx.globalAlpha = t.locked ? 0.9 : 1;
    ctx.beginPath();
    ctx.moveTo(t.path[0].x, t.path[0].y);
    for (let i = 1; i < t.path.length; i++) ctx.lineTo(t.path[i].x, t.path[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // place letter badge at the middle of each finished path, nudged apart
  function labelSpots() {
    const spots = [];
    for (const t of trials) {
      if (!t.locked) continue;
      // find the point halfway along the path
      let total = 0;
      for (let i = 1; i < t.path.length; i++) total += Math.hypot(t.path[i].x - t.path[i - 1].x, t.path[i].y - t.path[i - 1].y);
      const half = total / 2;
      let acc = 0, px = t.path[0].x, py = t.path[0].y, dirx = 1, diry = 0;
      for (let i = 1; i < t.path.length; i++) {
        const a = t.path[i - 1], b = t.path[i];
        const seg = Math.hypot(b.x - a.x, b.y - a.y);
        if (seg > 0.01) { dirx = (b.x - a.x) / seg; diry = (b.y - a.y) / seg; }
        if (acc + seg >= half) { const f = (half - acc) / (seg || 1); px = a.x + (b.x - a.x) * f; py = a.y + (b.y - a.y) * f; break; }
        acc += seg; px = b.x; py = b.y;
      }
      // perpendicular offset (prefer upward side)
      let nx = -diry, ny = dirx;
      if (ny > 0) { nx = -nx; ny = -ny; }
      let lx = px + nx * 26, ly = py + ny * 26;
      for (let k = 0; k < 12; k++) {
        const clash = spots.some(s => Math.hypot(s.x - lx, s.y - ly) < 42);
        if (!clash) break;
        ly -= 38;
      }
      lx = Math.min(ROOM.right - 22, Math.max(ROOM.left + 22, lx));
      ly = Math.min(ROOM.floor - 22, Math.max(ROOM.top + 22, ly));
      spots.push({ x: lx, y: ly, idx: t.idx });
    }
    return spots;
  }

  function drawBadge(x, y, idx, r = 19) {
    ctx.save();
    ctx.fillStyle = COLORS[idx];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    text(LETTERS[idx], x, y + 1, Math.max(14, Math.min(16, Math.round(r * 0.95))), "#fff", "center", 700);
  }

  function drawBlock(t, isActive) {
    const x = t.x - HALF, y = t.y - HALF;
    ctx.save();
    if (isActive) { ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = dragging ? 18 : 8; ctx.shadowOffsetY = dragging ? 8 : 3; }
    ctx.fillStyle = LIGHT[t.idx];
    roundRect(x, y, S, S, 6); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4;
    roundRect(x, y, S, S, 6); ctx.stroke();
    ctx.restore();
    text(LETTERS[t.idx], t.x, t.y - 20, 16, COLORS[t.idx], "center", 700);
    drawHandle(t, isActive);
  }

  function drawHandle(t, isActive) {
    const dx = t.hx - t.x, dy = t.hy - t.y, d = Math.hypot(dx, dy) || 1;
    const ux = dx / d, uy = dy / d;
    const k = HALF / Math.max(Math.abs(ux), Math.abs(uy));      // where the handle leaves the block's edge
    const ax = t.x + ux * k, ay = t.y + uy * k;
    const ex = t.hx - ux * LOOP_R, ey = t.hy - uy * LOOP_R;     // where it meets the loop
    const ropePath = () => {
      ctx.beginPath(); ctx.moveTo(ax, ay);
      if (d < ROPE - 1) {   // slack handle: let it bow a little
        const sag = (ROPE - d) * 0.45, mx = (ax + ex) / 2 - uy * sag, my = (ay + ey) / 2 + ux * sag;
        ctx.quadraticCurveTo(mx, my, ex, ey);
      } else ctx.lineTo(ex, ey);
    };
    const loopPath = () => { ctx.beginPath(); ctx.arc(t.hx, t.hy, LOOP_R, 0, Math.PI * 2); };
    ctx.save();
    ctx.lineCap = "round";
    // faint edge in the block's color, then the light fill color on top
    ctx.strokeStyle = COLORS[t.idx]; ctx.globalAlpha = 0.45; ctx.lineWidth = 6.5;
    ropePath(); ctx.stroke(); loopPath(); ctx.stroke();
    ctx.globalAlpha = 1; ctx.strokeStyle = LIGHT[t.idx]; ctx.lineWidth = 4;
    ropePath(); ctx.stroke(); loopPath(); ctx.stroke();
    if (isActive && !dragging) {   // gentle hint ring on the loop to grab
      ctx.strokeStyle = "rgba(71,85,105,.35)"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(t.hx, t.hy, LOOP_R + 7, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  let readout = null;   // {cos, col} while the block is moving, else null
  function drawVectors() {
    readout = null;
    if (!active) return;
    ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(active.x, active.y, 5, 0, Math.PI * 2); ctx.fill();
    if (!dragging) return;

    const rx = active.hx - active.x, ry = active.hy - active.y, rl = Math.hypot(rx, ry) || 1;
    if (rl < ROPE - 1) return;                       // slack handle: no tension
    const ux = rx / rl, uy = ry / rl;                // along the handle
    const nx = -uy, ny = ux;

    // tension: from the center dot to just short of the loop
    const tl = rl - LOOP_R - 5;
    arrow(active.x, active.y, active.x + ux * tl, active.y + uy * tl, "#111827", 6, 20);
    let lx = active.x + ux * (tl - 14) + nx * 20, ly = active.y + uy * (tl - 14) + ny * 20;
    ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 14, ly - 15, 28, 30, 6); ctx.fill(); ctx.restore();
    text("T", lx, ly, 16, "#111827", "center", 700);

    // displacement: colinear with T, tail at the far edge of the loop
    const now = performance.now();
    const sp = Math.hypot(vel.x, vel.y);
    if (now - lastMove < 140 && sp > 0.4) {
      const cos = (vel.x * ux + vel.y * uy) / sp;
      const col = cos > 0.17 ? "#16a34a" : cos < -0.17 ? "#dc2626" : "#6b7280";
      const L = 80;
      const sx = active.hx + ux * LOOP_R, sy = active.hy + uy * LOOP_R;
      arrow(sx, sy, sx + ux * L, sy + uy * L, col, 6, 20);
      lx = sx + ux * (L - 14) + nx * 22; ly = sy + uy * (L - 14) + ny * 22;
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 20, ly - 16, 40, 30, 6); ctx.fill(); ctx.restore();
      vecDeltaR(lx - 13, ly + 2, 16, col);
      readout = { cos, col };
    }
  }

  function drawReadout() {
    const cos = readout ? readout.cos : null, col = readout ? readout.col : null;
    const x = ROOM.left + 8, y = ROOM.top + 8, w = 392, h = 74;
    ctx.save();
    ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
    ctx.restore();
    text("Work by tension right now:", x + 14, y + 23, 18, "#475569", "left", 600);
    if (cos === null) { text("Block not moving  →  zero", x + 14, y + 51, 18, "#6b7280", "left", 700); return; }
    const deg = Math.round(Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI);
    const word = cos > 0.17 ? "positive" : cos < -0.17 ? "negative" : "≈ zero";
    text(`${word}   (θ = ${deg}° between T and Δx)`, x + 14, y + 51, 18, col, "left", 700);
  }

  // center of the space to the right of the work readout
  const STATUS_CX = (ROOM.left + 8 + 392 + ROOM.right - 50) / 2;
  function drawStatus() {
    let msg;
    if (!done && active.path.length > 1) return;   // hide the bubble once the block starts moving
    if (done) msg = null;
    else if (active.idx === 0) msg = "Grab the loop on block A\u2019s handle and pull the block to the dashed square.";
    else if (active.idx === 1) msg = "Now pull block B along a different path until it lands on block A.";
    else msg = "One more: pull block C along yet another path onto the stack.";
    if (msg) {
      ctx.save();
      ctx.font = `600 16px Inter, system-ui, sans-serif`;
      const w = ctx.measureText(msg).width + 36;
      // centered across the workspace, 80% of the way from the floor up to the ceiling
      const cx = (ROOM.left + ROOM.right) / 2;
      const cy = ROOM.floor - 0.8 * (ROOM.floor - ROOM.top);
      ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      roundRect(cx - w / 2, cy - 18, w, 36, 18); ctx.fill(); ctx.stroke();
      ctx.restore();
      text(msg, cx, cy, 16, "#475569", "center", 600);
    } else {
      if (bannerHidden) return;
      const cx = STATUS_CX, w = 630, h = 86, y = ROOM.top + 8;
      bannerRect = { x: cx - w / 2, y, w, h };
      ctx.save();
      ctx.fillStyle = "rgba(220,252,231,.96)"; ctx.strokeStyle = "#16a34a"; ctx.lineWidth = 3;
      roundRect(cx - w / 2, y, w, h, 14); ctx.fill(); ctx.stroke();
      ctx.restore();
      text("Three different paths — different amounts of work by tension!", cx, y + 21, 18, "#14532d", "center", 700);
      text("Tension is a nonconservative force: its work depends on the path taken,", cx, y + 46, 16, "#166534", "center", 500);
      text("not just on where the object starts and ends.", cx, y + 66, 16, "#166534", "center", 500);
    }
  }

  function drawPanel() {
    const P = { x: 1160, y: 20, w: 420, h: 708 };
    ctx.save();
    ctx.fillStyle = "#ffffff"; ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    roundRect(P.x, P.y, P.w, P.h, 12); ctx.fill(); ctx.stroke();
    ctx.restore();

    text("Total Work Done by Tension", P.x + P.w / 2, P.y + 30, 18, "#0f172a", "center", 700);
    // W_g (J) subtitle
    subText("W", "T", P.x + P.w / 2 - 30, P.y + 54, 15, "#475569");
    text("(J)", P.x + P.w / 2 + 4, P.y + 54, 15, "#475569", "left", 600);

    // axis
    const gx1 = P.x + 78, gx2 = P.x + P.w - 22;
    const gTop = P.y + 84, gBot = P.y + 420;
    // vertical axis rescales so the tallest bar always fits
    const best = Math.max(0, ...trials.map(t => t.work));
    const need = Math.max(30, best * 1.12);
    const step = [5, 10, 20, 25, 50, 100, 200, 250, 500, 1000].find(st => need / st <= 7) || 2000;
    const target = Math.ceil(need / step) * step;
    axisMax += (target - axisMax) * 0.2;
    if (Math.abs(target - axisMax) < 0.05) axisMax = target;
    const vMax = axisMax, vMin = -step;
    const yOf = v => gTop + (vMax - v) / (vMax - vMin) * (gBot - gTop);
    for (let v = Math.floor(vMax / step + 1e-6) * step; v >= vMin - 1e-6; v -= step) {
      const y = yOf(v);
      ctx.strokeStyle = v === 0 ? "#0f172a" : "#e2e8f0";
      ctx.lineWidth = v === 0 ? 2.5 : 1;
      ctx.beginPath(); ctx.moveTo(gx1, y); ctx.lineTo(gx2, y); ctx.stroke();
      text((v < 0 ? "−" : "") + Math.abs(v), gx1 - 10, y, 14, "#475569", "right", v === 0 ? 700 : 400);
    }
    ctx.strokeStyle = "#0f172a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(gx1, gTop); ctx.lineTo(gx1, gBot); ctx.stroke();

    // bars
    const slotW = (gx2 - gx1) / 3, barW = 64;
    const y0 = yOf(0);
    for (let i = 0; i < 3; i++) {
      const cx = gx1 + slotW * (i + 0.5);
      const t = trials[i];
      // letter label at bottom
      drawBadge(cx, gBot + 26, i, 15);
      if (!t || t.path.length < 2) continue;
      const vClamped = Math.max(vMin, Math.min(vMax, t.work));
      const yv = yOf(vClamped);
      ctx.save();
      ctx.globalAlpha = t.locked ? 1 : 0.55;
      ctx.fillStyle = COLORS[i];
      ctx.fillRect(cx - barW / 2, Math.min(y0, yv), barW, Math.abs(yv - y0));
      ctx.restore();
      const labelY = t.work <= 0 ? yv + 18 : yv - 18;
      text(fmtJ(t.work), cx, Math.max(gTop + 10, Math.min(gBot - 10, labelY)), 16, t.locked ? "#0f172a" : "#64748b", "center", 700);
      if (!t.locked && t.path.length > 1) text("In progress", cx, t.work > 0 ? y0 + 15 : y0 - 15, 14, "#64748b", "center", 600);
    }

    // data table
    const ty = gBot + 68;
    text("Path", P.x + 40, ty, 14, "#475569", "left", 700);
    text("Distance traveled", P.x + 200, ty, 14, "#475569", "center", 700);
    subText("W", "T", P.x + 352, ty, 14, "#475569", "center");
    ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(P.x + 24, ty + 16); ctx.lineTo(P.x + P.w - 24, ty + 14); ctx.stroke();
    for (let i = 0; i < 3; i++) {
      const t = trials[i];
      const ry = ty + 38 + i * 32;
      drawBadge(P.x + 54, ry, i, 15);
      text(t && t.dist > 0 ? t.dist.toFixed(2) + " m" : "—", P.x + 200, ry, 16, "#0f172a", "center", 600);
      text(t && t.path.length > 1 ? fmtJ(t.work) : "—", P.x + 352, ry, 16, "#0f172a", "center", 600);
    }

  }

  function draw() {
    drawRoom();
    drawTarget();
    for (const t of trials) drawPath(t);
    for (const t of trials) if (t.locked) drawBlock(t, false);
    readout = null;
    // start marker
    if (active) {
      ctx.save(); ctx.setLineDash([6, 6]); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
      ctx.strokeRect(START.x - HALF, START.y - HALF, S, S); ctx.restore();
      drawBlock(active, true);
      drawVectors();
    }
    for (const s of labelSpots()) drawBadge(s.x, s.y, s.idx, 15);
    drawReadout();
    drawStatus();
    drawPanel();
  }

  reset();
  return { reset, draw, down, move, up, hover, outsideClick };
}


/* =====================================================================
   SCENE: Spring force (conservative) — side view
   ===================================================================== */
function SpringScene() {
  // --- Room geometry (logical px) — side view, spring attached to the left wall ---
  const ROOM = { left: 20, top: 20, right: 1140, floor: 528, bottom: 728 };   // taller floor: spring sits nearer the middle
  const PPM = 200;                       // pixels per meter
  const MASS = 2.0, K = 20;              // kg, N/m
  const S = 80, HALF = S / 2;            // block size
  const WALL = 80;                       // x of the wall's face
  const X0 = 700;                        // block center at the spring's equilibrium
  const START = { x: X0, y: ROOM.floor - HALF };
  const TARGET = { x: (WALL + X0) / 2, y: ROOM.floor - HALF };   // halfway between the wall and equilibrium
  const D = (X0 - TARGET.x) / PPM;       // compression to the final position (m)
  const SNAP = 8;
  const OBST = [];
  const BOUNDS = { x1: WALL + 60 + HALF, x2: ROOM.right - HALF, y1: START.y, y2: START.y };
  const xm = px => (px - X0) / PPM;      // displacement from equilibrium (m)

  const LETTERS = ["A", "B", "C"];
  const COLORS = ["#2563eb", "#db2777", "#9333ea"];
  const LIGHT = ["#dbeafe", "#fce7f3", "#f3e8ff"];

  let trials, active, dragging, grab, vel, lastMove, done;

  let bannerHidden = false, bannerRect = null;
  // after the activity ends, a click anywhere outside the green banner closes it
  function outsideClick(p) {
    if (!done || bannerHidden || !bannerRect) return;
    const r = bannerRect;
    if (!p || p.x < r.x || p.x > r.x + r.w || p.y < r.y || p.y > r.y + r.h) bannerHidden = true;
  }
  let axisMin = -30;
  function reset() {
    axisMin = -30;
    bannerHidden = false; bannerRect = null;
    trials = [];
    done = false;
    dragging = false;
    newBlock();
  }

  function newBlock() {
    active = {
      idx: trials.length,
      x: START.x, y: START.y,
      path: [{ x: START.x, y: START.y }],
      work: 0, dist: 0, locked: false, v: 0,   // v: velocity (m/s) when released
      trace: [{ x: START.x, t: 0 }], tt: 0, lastTx: START.x,   // stretched-out trace (moving time)
    };
    trials.push(active);
    vel = { x: 0, y: 0 };
    lastMove = 0;
  }

  function overlaps(cx, cy, o) {
    return cx + HALF > o.x1 && cx - HALF < o.x2 && cy + HALF > o.y1 && cy - HALF < o.y2;
  }

  // move along one axis with collision against table pieces + room
  function stepAxis(axis, d) {
    if (axis === "x") {
      let nx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, active.x + d));
      for (const o of OBST) if (overlaps(nx, active.y, o)) nx = d > 0 ? o.x1 - HALF - 0.001 : o.x2 + HALF + 0.001;
      active.x = nx;
    } else {
      let ny = Math.min(BOUNDS.y2, Math.max(BOUNDS.y1, active.y + d));
      for (const o of OBST) if (overlaps(active.x, ny, o)) ny = d > 0 ? o.y1 - HALF - 0.001 : o.y2 + HALF + 0.001;
      active.y = ny;
    }
  }

  function record(ox, oy) {
    const dx = active.x - ox, dy = active.y - oy;
    // W_s = −½k(x_f² − x_i²) for each small step (x measured from equilibrium)
    active.work += -0.5 * K * (xm(active.x) ** 2 - xm(ox) ** 2);
    active.dist += Math.hypot(dx, dy) / PPM;
    const last = active.path[active.path.length - 1];
    if (Math.hypot(active.x - last.x, active.y - last.y) > 2) active.path.push({ x: active.x, y: active.y });
  }

  // move the block horizontally to x (px); returns true if it locked
  function moveToX(tx) {
    tx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, tx));
    const n = Math.max(1, Math.ceil(Math.abs(tx - active.x) / 3));
    const dd = (tx - active.x) / n;
    for (let i = 0; i < n; i++) {
      const ox = active.x;
      active.x += dd;
      record(ox, active.y);
      const crossed = (ox - TARGET.x) * (active.x - TARGET.x) <= 0 && ox !== active.x;
      if (crossed || Math.abs(active.x - TARGET.x) < SNAP) { lock(); return true; }
    }
    return false;
  }
  function moveToward(tx) {
    const sx = active.x, blk = active;
    if (moveToX(tx)) return;
    const mx = blk.x - sx;
    if (Math.abs(mx) > 0.3) { vel.x = vel.x * 0.6 + mx * 0.4; vel.y = 0; lastMove = performance.now(); }
  }

  // released block: frictionless spring motion along the floor
  let lastT = performance.now(), dragV = 0, lastDrag = null, frameDt = 0;

  // trace: time only advances while the block is moving
  function traceTick() {
    const a = active;
    if (!a || done) return;
    if (Math.abs(a.x - a.lastTx) > 0.5) { a.tt += frameDt; a.trace.push({ x: a.x, t: a.tt }); a.lastTx = a.x; }
  }

  // tightly stacked lanes above the scene: A at the bottom, then B, then C
  const LANE = { bottom: ROOM.floor - 168, h: 60, gap: 6, x1: BOUNDS.x1 - HALF + 10, x2: BOUNDS.x2 + HALF - 10 };
  const laneBottom = i => LANE.bottom - i * (LANE.h + LANE.gap);
  function drawTraces() {
    // reference lines for equilibrium and the final position run up through the lanes
    const top = laneBottom(2) - LANE.h;
    ctx.save(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 1.5; ctx.setLineDash([4, 5]);
    for (const x of [X0, TARGET.x]) { ctx.beginPath(); ctx.moveTo(x, LANE.bottom); ctx.lineTo(x, top); ctx.stroke(); }
    ctx.restore();
    for (const tr of trials) {
      const yb = laneBottom(tr.idx), yt = yb - LANE.h;
      ctx.save();
      ctx.fillStyle = "rgba(248,250,252,.75)"; ctx.strokeStyle = "#e2e8f0"; ctx.lineWidth = 1.5;
      roundRect(LANE.x1, yt, LANE.x2 - LANE.x1, LANE.h, 8); ctx.fill(); ctx.stroke();
      ctx.restore();
      if (tr.trace.length < 2) continue;
      const T = Math.max(1.5, tr.tt + 0.03);
      const yOf = tt => yb - 6 - (tt / T) * (LANE.h - 12);
      ctx.save();
      ctx.strokeStyle = COLORS[tr.idx]; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.beginPath();
      tr.trace.forEach((p, k) => k ? ctx.lineTo(p.x, yOf(p.t)) : ctx.moveTo(p.x, yOf(p.t)));
      ctx.stroke();
      ctx.restore();
      if (tr.locked) {
        const m = tr.trace[Math.floor(tr.trace.length / 2)];
        const bx = Math.min(LANE.x2 - 18, m.x + 24);
        drawBadge(bx, yOf(m.t), tr.idx, 15);
      }
    }
  }
  function physics() {
    const now = performance.now();
    const dt = Math.min(0.033, (now - lastT) / 1000); lastT = now; frameDt = dt;
    if (!active || dragging || done) return;
    if (Math.abs(active.v) < 1e-4 && Math.abs(xm(active.x)) < 1e-4) return;
    const steps = 8, h = dt / steps;
    for (let i = 0; i < steps; i++) {
      active.v += -(K / MASS) * xm(active.x) * h;
      let nx = active.x + active.v * h * PPM;
      if (nx < BOUNDS.x1 || nx > BOUNDS.x2) { nx = Math.min(BOUNDS.x2, Math.max(BOUNDS.x1, nx)); active.v = 0; }
      const blk = active, sx = blk.x;
      if (moveToX(nx)) return;
      const mx = blk.x - sx;
      if (Math.abs(mx) > 0.01) { vel.x = Math.sign(mx); vel.y = 0; lastMove = now; }
    }
  }

  function lock() {
    active.v = 0;
    active.trace.push({ x: TARGET.x, t: active.tt + 0.03 });
    const ox = active.x, oy = active.y;
    active.x = TARGET.x; active.y = TARGET.y;
    record(ox, oy);
    active.path.push({ x: TARGET.x, y: TARGET.y });
    active.locked = true;
    dragging = false;
    if (trials.length < 3) newBlock();
    else { done = true; active = null; }
  }

  /* ---------- input ---------- */
  function down(p) {
    if (!active || done) return;
    if (Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12) {
      dragging = true; active.v = 0; dragV = 0; lastDrag = null;
      grab = { x: p.x - active.x, y: p.y - active.y };
      return true;
    }
  }
  function move(p) {
    if (!dragging || !active) return;
    const now = performance.now(), blk = active;
    const before = blk.x;
    moveToward(p.x - grab.x);
    if (blk.locked) return;
    if (lastDrag) {
      const dtt = Math.max(0.008, (now - lastDrag.t) / 1000);
      dragV = dragV * 0.5 + ((blk.x - before) / PPM / dtt) * 0.5;
    }
    lastDrag = { t: now };
  }
  function up() {
    if (dragging && active) {
      const stale = !lastDrag || performance.now() - lastDrag.t > 80;
      active.v = stale ? 0 : Math.max(-6, Math.min(6, dragV));
    }
    dragging = false; dragV = 0; lastDrag = null;
  }
  function hover(p) {
    return active && !done && Math.abs(p.x - active.x) <= HALF + 12 && Math.abs(p.y - active.y) <= HALF + 12;
  }

  /* ---------- drawing ---------- */
  function drawRoom() {
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.floor - ROOM.top);
    ctx.save();
    ctx.strokeStyle = "#f1f4f8"; ctx.lineWidth = 1;
    for (let y = ROOM.floor; y > ROOM.top; y -= PPM / 2) { ctx.beginPath(); ctx.moveTo(ROOM.left, y); ctx.lineTo(ROOM.right, y); ctx.stroke(); }
    for (let x = ROOM.left; x < ROOM.right; x += PPM / 2) { ctx.beginPath(); ctx.moveTo(x, ROOM.top); ctx.lineTo(x, ROOM.floor); ctx.stroke(); }
    ctx.restore();
    // floor
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(ROOM.left, ROOM.floor, ROOM.right - ROOM.left, ROOM.bottom - ROOM.floor);
    ctx.save();
    ctx.beginPath(); ctx.rect(ROOM.left, ROOM.floor, ROOM.right - ROOM.left, ROOM.bottom - ROOM.floor); ctx.clip();
    ctx.strokeStyle = "#b4c0cf"; ctx.lineWidth = 3;
    for (let x = ROOM.left - 100; x < ROOM.right + 100; x += 28) { ctx.beginPath(); ctx.moveTo(x, ROOM.bottom); ctx.lineTo(x + 100, ROOM.floor); ctx.stroke(); }
    ctx.restore();
    // wall on the left
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(ROOM.left, ROOM.top, WALL - ROOM.left, ROOM.floor - ROOM.top);
    ctx.save();
    ctx.beginPath(); ctx.rect(ROOM.left, ROOM.top, WALL - ROOM.left, ROOM.floor - ROOM.top); ctx.clip();
    ctx.strokeStyle = "#b4c0cf"; ctx.lineWidth = 3;
    for (let y = ROOM.top - 100; y < ROOM.floor + 100; y += 28) { ctx.beginPath(); ctx.moveTo(ROOM.left, y + 60); ctx.lineTo(WALL, y); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = "#475569"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(WALL, ROOM.top); ctx.lineTo(WALL, ROOM.floor); ctx.lineTo(ROOM.right, ROOM.floor); ctx.stroke();
    // outline
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2;
    ctx.strokeRect(ROOM.left, ROOM.top, ROOM.right - ROOM.left, ROOM.bottom - ROOM.top);

    // equilibrium marker and the 1.0 m compression
    ctx.save();
    ctx.strokeStyle = "#94a3b8"; ctx.lineWidth = 2; ctx.setLineDash([6, 5]);
    ctx.beginPath(); ctx.moveTo(X0, ROOM.floor); ctx.lineTo(X0, ROOM.floor - 138); ctx.stroke();
    ctx.restore();
    text("Equilibrium (x = 0)", X0, ROOM.floor - 150, 14, "#64748b", "center", 600);
    // 1.55 m dimension drawn on the floor below the blocks
    const dy = ROOM.floor + 34;
    ctx.save(); ctx.strokeStyle = "#64748b"; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
    for (const x of [TARGET.x, X0]) { ctx.beginPath(); ctx.moveTo(x, ROOM.floor + 4); ctx.lineTo(x, dy + 12); ctx.stroke(); }
    ctx.restore();
    arrow((X0 + TARGET.x) / 2, dy, TARGET.x + 3, dy, "#475569", 2, 10);
    arrow((X0 + TARGET.x) / 2, dy, X0 - 3, dy, "#475569", 2, 10);
    ctx.save(); ctx.fillStyle = "#fff"; roundRect((X0 + TARGET.x) / 2 - 32, dy - 12, 64, 24, 6); ctx.fill(); ctx.restore();
    text(D.toFixed(2) + " m", (X0 + TARGET.x) / 2, dy, 14, "#475569", "center", 600);

    // given values
    {
      const cx = (ROOM.left + ROOM.right) / 2, cy = ROOM.floor + 120;
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.92)"; roundRect(cx - 160, cy - 20, 320, 40, 10); ctx.fill(); ctx.restore();
      text(`Each block: m = ${MASS.toFixed(1)} kg     k = ${K} N/m`, cx, cy, 16, "#334155", "center", 600);
    }
  }

  function drawSpring(b) {
    const x1 = WALL, x2 = b.x - HALF, y = b.y;
    const lead = 14, coils = 16, amp = 16;
    const L = x2 - x1 - 2 * lead;
    ctx.save();
    ctx.strokeStyle = "#334155"; ctx.lineWidth = 3; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x1 + lead, y);
    for (let i = 0; i < coils * 2; i++) ctx.lineTo(x1 + lead + L * (i + 0.5) / (coils * 2), y + (i % 2 ? amp : -amp));
    ctx.lineTo(x2 - lead, y); ctx.lineTo(x2, y);
    ctx.stroke();
    ctx.restore();
  }

  function drawTarget() {
    if (trials.some(t => t.locked)) return;
    ctx.save();
    ctx.setLineDash([10, 7]); ctx.lineWidth = 3; ctx.strokeStyle = "#64748b";
    ctx.strokeRect(TARGET.x - HALF, TARGET.y - HALF, S, S);
    ctx.restore();
  }

  function drawPath(t) {
    return;   // motion is along one line, so paths are compared in the table instead
    if (t.path.length < 2) return;
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4; ctx.lineJoin = "round"; ctx.lineCap = "round";
    ctx.setLineDash(t.locked ? [] : [2, 0]);
    ctx.globalAlpha = t.locked ? 0.9 : 1;
    ctx.beginPath();
    ctx.moveTo(t.path[0].x, t.path[0].y);
    for (let i = 1; i < t.path.length; i++) ctx.lineTo(t.path[i].x, t.path[i].y);
    ctx.stroke();
    ctx.restore();
  }

  // place letter badge at the middle of each finished path, nudged apart
  function labelSpots() {
    return [];
    const spots = [];
    for (const t of trials) {
      if (!t.locked) continue;
      // find the point halfway along the path
      let total = 0;
      for (let i = 1; i < t.path.length; i++) total += Math.hypot(t.path[i].x - t.path[i - 1].x, t.path[i].y - t.path[i - 1].y);
      const half = total / 2;
      let acc = 0, px = t.path[0].x, py = t.path[0].y, dirx = 1, diry = 0;
      for (let i = 1; i < t.path.length; i++) {
        const a = t.path[i - 1], b = t.path[i];
        const seg = Math.hypot(b.x - a.x, b.y - a.y);
        if (seg > 0.01) { dirx = (b.x - a.x) / seg; diry = (b.y - a.y) / seg; }
        if (acc + seg >= half) { const f = (half - acc) / (seg || 1); px = a.x + (b.x - a.x) * f; py = a.y + (b.y - a.y) * f; break; }
        acc += seg; px = b.x; py = b.y;
      }
      // perpendicular offset (prefer upward side)
      let nx = -diry, ny = dirx;
      if (ny > 0) { nx = -nx; ny = -ny; }
      let lx = px + nx * 26, ly = py + ny * 26;
      for (let k = 0; k < 12; k++) {
        const clash = spots.some(s => Math.hypot(s.x - lx, s.y - ly) < 42);
        if (!clash) break;
        ly -= 38;
      }
      lx = Math.min(ROOM.right - 22, Math.max(ROOM.left + 22, lx));
      ly = Math.min(ROOM.floor - 22, Math.max(ROOM.top + 22, ly));
      spots.push({ x: lx, y: ly, idx: t.idx });
    }
    return spots;
  }

  function drawBadge(x, y, idx, r = 19) {
    ctx.save();
    ctx.fillStyle = COLORS[idx];
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
    text(LETTERS[idx], x, y + 1, Math.max(14, Math.min(16, Math.round(r * 0.95))), "#fff", "center", 700);
  }

  function drawBlock(t, isActive) {
    const x = t.x - HALF, y = t.y - HALF;
    ctx.save();
    if (isActive) { ctx.shadowColor = "rgba(0,0,0,.25)"; ctx.shadowBlur = dragging ? 18 : 8; ctx.shadowOffsetY = dragging ? 8 : 3; }
    ctx.fillStyle = LIGHT[t.idx];
    roundRect(x, y, S, S, 6); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.strokeStyle = COLORS[t.idx]; ctx.lineWidth = 4;
    roundRect(x, y, S, S, 6); ctx.stroke();
    ctx.restore();
    text(LETTERS[t.idx], t.x, t.y - 20, 16, COLORS[t.idx], "center", 700);
  }

  let readout = null;   // {cos, col} while the block is moving, else null
  function drawVectors() {
    readout = null;
    if (!active) return;
    ctx.fillStyle = "#111827"; ctx.beginPath(); ctx.arc(active.x, active.y, 5, 0, Math.PI * 2); ctx.fill();

    // spring force: length grows with the stretch or compression
    const x = xm(active.x), F = -K * x;              // N (+ = to the right)
    const fl = Math.min(220, Math.abs(F) * 4);
    if (fl > 6) {
      const dir = Math.sign(F);
      arrow(active.x, active.y, active.x + dir * fl, active.y, "#111827", 6, Math.min(20, fl * 0.6));
      const lx = active.x + dir * (fl + 30);
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 20, active.y - 16, 40, 30, 6); ctx.fill(); ctx.restore();
      subText("F", "s", lx - 12, active.y, 16, "#111827");
    }

    // displacement: drawn just above the block, tail above the center dot
    const now = performance.now();
    const moving = now - lastMove < 140 && (dragging || Math.abs(active.v) > 0.02);
    if (moving) {
      const ux = Math.sign(vel.x) || 1;
      const cos = Math.abs(F) < 0.1 ? 0 : Math.sign(F) * ux;
      const col = cos > 0.17 ? "#16a34a" : cos < -0.17 ? "#dc2626" : "#6b7280";
      const L = 95, ay = active.y - HALF - 26;
      ctx.save(); ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2; ctx.setLineDash([3, 4]);
      ctx.beginPath(); ctx.moveTo(active.x, active.y - HALF); ctx.lineTo(active.x, ay); ctx.stroke(); ctx.restore();
      arrow(active.x, ay, active.x + ux * L, ay, col, 6, 20);
      const lx = active.x + ux * (L + 28);
      ctx.save(); ctx.fillStyle = "rgba(255,255,255,.85)"; roundRect(lx - 20, ay - 16, 40, 30, 6); ctx.fill(); ctx.restore();
      vecDeltaR(lx - 13, ay + 2, 16, col);
      readout = { cos, col, zeroF: Math.abs(F) < 0.1 };
    }
  }

  function drawReadout() {
    const cos = readout ? readout.cos : null, col = readout ? readout.col : null;
    const x = ROOM.left + 8, y = ROOM.top + 8, w = 392, h = 74;
    ctx.save();
    ctx.fillStyle = "rgba(248,250,252,.94)"; ctx.strokeStyle = "#cbd5e1"; ctx.lineWidth = 2;
    roundRect(x, y, w, h, 10); ctx.fill(); ctx.stroke();
