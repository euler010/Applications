                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(x_{n}\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\vec{}')" title="Vector Arrow (\vec{})" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\vec{A}\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\theta ')" title="Theta (\theta)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\theta\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\pi ')" title="Pi (\pi)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\pi\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\cdot ')" title="Multiplication Dot (\cdot)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\cdot\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\times ')" title="Multiplication Cross (\times)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\times\)</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\div ')" title="Division Symbol (\div)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] font-semibold text-slate-800 leading-none flex items-center justify-center">&divide;</span>
                        </button>
                        <button type="button" onclick="insertSnippet('\\pm ')" title="Plus-Minus (\pm)" class="sym-btn frequent-btn bg-white hover:bg-blue-50 hover:border-blue-400 border border-slate-300 rounded-lg shadow-2xs transition active:scale-95">
                            <span class="text-[12.5px] text-slate-800 flex items-center justify-center">\(\pm\)</span>
                        </button>

                        <!-- Vertical Divider -->
                        <div class="h-6 w-px bg-slate-300 mx-1"></div>

                        <!-- Spacing & Layout Buttons -->
                        <div class="flex items-center gap-1.5 text-[12.5px]">
                            <span class="text-slate-500 text-[12.5px] font-medium">Space:</span>
                            <button onclick="insertSnippet('\\, ')" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded-md text-[12.5px] text-slate-700 shadow-2xs transition" title="Thin space (3mu)">Thin</button>
                            <button onclick="insertSnippet('\\; ')" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded-md text-[12.5px] text-slate-700 shadow-2xs transition" title="Medium / Thick space (~6mu)">Medium</button>
                            <button onclick="handleLineBreakInsert()" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded-md text-[12.5px] font-medium text-slate-900 shadow-2xs transition" title="Start a new line (inserts \\ and line break)">&#8629; Linebreak</button>
                            <button onclick="wrapSelection('\\begin{aligned}\n', '\n\\end{aligned}')" class="px-2 py-0.5 bg-white hover:bg-slate-100 border border-slate-300 rounded-md text-[12.5px] text-slate-700 shadow-2xs transition" title="Wrap into aligned multiline block">Align (=)</button>
                        </div>

                        <!-- Vertical Divider -->
                        <div class="h-5 w-px bg-slate-300 mx-1"></div>

                        <!-- Font & Text Formatting Tools -->
                        <button onclick="wrapSelection('\\mathbf{', '}')" title="Bold Math" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md font-bold text-slate-700 shadow-2xs transition text-[12.5px]">B</button>
                        <button onclick="wrapSelection('\\mathit{', '}')" title="Italic Math" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md italic font-serif text-slate-700 shadow-2xs transition text-[12.5px]">I</button>
                        <button onclick="wrapSelection('\\underline{', '}')" title="Underline" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md underline text-slate-700 shadow-2xs transition text-[12.5px]">U</button>
                        <button onclick="wrapSelection('\\text{', '}')" title="Plain Text inside Formula" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md text-slate-700 shadow-2xs transition text-[12.5px]">Text</button>
                        <button onclick="wrapSelection('\\mathbb{', '}')" title="Blackboard Bold (e.g. R, N, Z)" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md font-serif text-slate-700 shadow-2xs transition text-[12.5px]">&#8477;</button>
                        <button onclick="wrapSelection('\\cancel{', '}')" title="Strikethrough / Cancel term" class="px-2.5 py-1 bg-white hover:bg-blue-50 border border-slate-300 rounded-md line-through text-slate-700 shadow-2xs transition text-[12.5px]">Cancel</button>

                    <!-- Overflow Menu Buttons -->

                </div>
            </div>
        </section>

        <!-- Split Editor & Export Settings Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-3 items-stretch">
            
            <!-- Left Column: LaTeX Code Editor (7 cols) -->
            <div class="lg:col-span-7 bg-white rounded-2xl shadow-sm border border-slate-200 flex flex-col overflow-hidden h-full">

                    ></textarea>
                </div>
            </div>

            <!-- Right Column: Appearance Controls + Compact Actions (5 cols) -->
            <div id="settingsBox" class="lg:col-span-5 bg-white rounded-2xl shadow-sm border border-slate-200 p-2.5 flex flex-col justify-between gap-2 h-full">
                <!-- Top Section: Appearance & Color Settings -->
                <div class="space-y-2 text-xs">
                    <!-- Adjustable Font Size & Font Family -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pb-0.5">

                            <label for="fontFamilySelect" class="font-semibold text-slate-700 block mb-1">Font Family</label>
                            <select id="fontFamilySelect" onchange="renderEquation()" class="w-full bg-slate-50 border border-slate-300 text-slate-800 font-medium rounded-lg px-2 py-1 focus:outline-none focus:ring-2 focus:ring-blue-500">
                                <option value="computer-modern" selected>Computer Modern (Standard LaTeX)</option>
                                <option value="arial">Arial / Sans-Serif (Modern)</option>
                                <option value="mono">JetBrains Mono (Code / Monospace)</option>
                                <option value="euler">Euler / Script (Upright AMS Style)</option>
                                <option value="blackboard">Blackboard Bold (Double-Struck Math)</option>
                            </select>
                        </div>

                        <!-- Font Size Controls -->
                        <div>
                            <div class="flex justify-between items-center mb-1">
                                <label for="fontSizeNumber" class="font-semibold text-slate-700">Font Size</label>
                                <div class="flex items-center gap-1">
                                    <input type="number" id="fontSizeNumber" min="10" max="120" value="30" 
                                        oninput="syncFontSize(this.value)"

                                    <span class="text-slate-400">px</span>
                                </div>
                            </div>
                            <input type="range" id="fontSizeSlider" min="12" max="100" value="30" 
                                oninput="syncFontSize(this.value)"
                                class="w-full accent-blue-600 cursor-pointer">
                        </div>
                    </div>

                    <!-- Background Mode & Padding -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <!-- Background Selection -->
                        <div>
                            <label class="font-semibold text-slate-700 block mb-1">Image Background</label>
                            <div class="grid grid-cols-3 gap-1 bg-slate-100 p-0.5 rounded-lg border border-slate-200">
                                <button type="button" id="bgBtnTransparent" onclick="setBgMode('transparent')" 
                                    class="px-1.5 py-1 rounded-md font-medium text-[11px] transition bg-white text-blue-700 shadow-2xs text-center flex items-center justify-center">
                                    Transparent
                                </button>
                                <button type="button" id="bgBtnWhite" onclick="setBgMode('white')"

                                    White

                                <button type="button" id="bgBtnCustom" onclick="setBgMode('custom')" 
                                    class="px-1.5 py-1 rounded-md font-medium text-[11px] transition text-slate-600 hover:text-slate-900 text-center flex items-center justify-center">
                                    Custom

                            </div>
                        </div>

                        <!-- Colors (Equation Foreground + Custom BG) -->

                            <label class="font-semibold text-slate-700 block mb-1">Colors &amp; Padding</label>

                                <div class="relative" id="inkPickerDropdownWrapper">

                                        <span class="text-[11px] text-slate-500 font-medium">Ink:</span>
                                        <span id="inkColorIndicator" class="w-3.5 h-3.5 rounded-full border border-slate-300 shadow-inner inline-block" style="background-color: #0f172a;"></span>
                                        <i class="fa-solid fa-chevron-down text-[8px] text-slate-400"></i>
                                    </button>

                                    <input type="color" id="fgColorPicker" value="#0f172a" class="hidden" onchange="updateInkColor(this.value)">

                                    <!-- Custom Color Palette Popover -->

                                        <div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">Preset Colors</div>
                                        <div class="grid grid-cols-6 gap-1.5 pb-2.5 border-b border-slate-100">
                                            <button type="button" onclick="setInkPreset('#000000')" title="Black" class="w-6 h-6 rounded-lg bg-black hover:scale-110 active:scale-95 transition shadow-2xs border border-slate-200"></button>
                                            <button type="button" onclick="setInkPreset('#dc2626')" title="Red" class="w-6 h-6 rounded-lg bg-red-600 hover:scale-110 active:scale-95 transition shadow-2xs"></button>
                                            <button type="button" onclick="setInkPreset('#2563eb')" title="Blue" class="w-6 h-6 rounded-lg bg-blue-600 hover:scale-110 active:scale-95 transition shadow-2xs"></button>
                                            <button type="button" onclick="setInkPreset('#0B6623')" title="Green (#0B6623)" class="w-6 h-6 rounded-lg hover:scale-110 active:scale-95 transition shadow-2xs" style="background-color: #0B6623;"></button>
                                            <button type="button" onclick="setInkPreset('#9333ea')" title="Purple" class="w-6 h-6 rounded-lg bg-purple-600 hover:scale-110 active:scale-95 transition shadow-2xs"></button>
                                            <button type="button" onclick="setInkPreset('#ea580c')" title="Orange" class="w-6 h-6 rounded-lg bg-orange-600 hover:scale-110 active:scale-95 transition shadow-2xs"></button>

                                        <div class="pt-2 flex items-center justify-between">

                                        </div>
                                    </div>
                                </div>

                                <div id="customBgPickerWrap" class="hidden flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-2 py-1 rounded-lg" title="Custom Background Color">

                            </div>

                                <i id="displayStyleIcon" class="fa-solid fa-check text-[7px] text-blue-600"></i>
                            </div>
                        </div>
                        <span class="flex items-center gap-1 select-none">
                            <span id="displayStyleLabelText" class="font-semibold text-slate-800 text-[11px]">Display Style</span>
                            <code id="displayStyleCodeBadge" class="text-[9px] text-blue-600 font-mono bg-white px-1 py-0.2 rounded border border-blue-200">\displaystyle</code>
                        </span>

        function setupEditorListeners() {

                    if (!isApplyingHistory) {
                        saveHistorySnapshot(latexInput.value);
                    }
                    renderEquation();
                }, 120);
            });

            latexInput.addEventListener('keydown', (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const val = latexInput.value;
                    const start = latexInput.selectionStart;
                    const nextBrace = val.indexOf('{', start);
                    const nextClose = val.indexOf('}', start);
                    let target = -1;
                    if (nextBrace !== -1 && (nextClose === -1 || nextBrace < nextClose)) {
                        target = nextBrace + 1;
                    } else if (nextClose !== -1) {
                        target = nextClose + 1;
                    }
                    if (target !== -1) {
                        latexInput.setSelectionRange(target, target);
                    }
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    if (e.shiftKey) redoEdit();
                    else undoEdit();
                } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') {
                    e.preventDefault();
                    redoEdit();
                }

            if (latexInput.value.trim() === '') return;

        function insertSnippet(snippet) {
            latexInput.focus();
            const start = latexInput.selectionStart;
            const end = latexInput.selectionEnd;
            const currentVal = latexInput.value;
            const selectedText = currentVal.substring(start, end);

            let newText = snippet;
            let cursorOffset = snippet.length;

            const firstEmptyBraces = snippet.indexOf('{}');
            const firstEmptyParens = snippet.indexOf('()');

            if (selectedText.length > 0 && firstEmptyBraces !== -1) {
                newText = snippet.substring(0, firstEmptyBraces + 1) + selectedText + snippet.substring(firstEmptyBraces + 1);
                cursorOffset = firstEmptyBraces + 1 + selectedText.length + 1;
            } else if (firstEmptyBraces !== -1) {
                cursorOffset = firstEmptyBraces + 1;
            } else if (firstEmptyParens !== -1) {
                cursorOffset = firstEmptyParens + 1;
            }

            latexInput.value = currentVal.substring(0, start) + newText + currentVal.substring(end);
            const newCursorPos = start + cursorOffset;
            latexInput.setSelectionRange(newCursorPos, newCursorPos);

            saveHistorySnapshot(latexInput.value);
            renderEquation();
        }

        function wrapSelection(prefix, suffix) {
            latexInput.focus();
            const start = latexInput.selectionStart;
            const end = latexInput.selectionEnd;
            const val = latexInput.value;
            const selected = val.substring(start, end) || 'x';

            const replacement = prefix + selected + suffix;
            latexInput.value = val.substring(0, start) + replacement + val.substring(end);
            latexInput.setSelectionRange(start + prefix.length, start + prefix.length + selected.length);

            saveHistorySnapshot(latexInput.value);
            renderEquation();
        }

        function saveHistorySnapshot(val) {
            if (historyStack[historyIndex] === val) return;
            historyStack = historyStack.slice(0, historyIndex + 1);
            historyStack.push(val);
            if (historyStack.length > 50) historyStack.shift();
            else historyIndex++;
            updateHistoryButtons();
        }

        function undoEdit() {
            if (historyIndex > 0) {
                isApplyingHistory = true;
                historyIndex--;
                latexInput.value = historyStack[historyIndex];
                updateHistoryButtons();
                renderEquation();
                isApplyingHistory = false;
            }
        }

        function redoEdit() {
            if (historyIndex < historyStack.length - 1) {
                isApplyingHistory = true;
                historyIndex++;
                latexInput.value = historyStack[historyIndex];
                updateHistoryButtons();
                renderEquation();
                isApplyingHistory = false;
            }
        }

        function updateHistoryButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= historyStack.length - 1;
        }

        function removeLineBreaks() {
            latexInput.value = latexInput.value.replace(/\r?\n|\r/g, ' ').replace(/\s+/g, ' ').trim();

            renderEquation();
            showToast('Line breaks flattened');
        }

        function prepareLatexForRendering(latex) {
            const trimmed = latex.trim();
            if (!trimmed) return '';

            const hasLineBreaks = /\\\\/.test(trimmed);
            const hasEnvironment = /\\begin\{(aligned|align\*?|gather\*?|gathered|cases|matrix|pmatrix|bmatrix|vmatrix|Bmatrix|array)\}/.test(trimmed);

            if (hasLineBreaks && !hasEnvironment) {
                if (/&/.test(trimmed)) {
                    return `\\begin{aligned} ${trimmed} \\end{aligned}`;
                } else {
                    return `\\begin{gathered} ${trimmed} \\end{gathered}`;
                }
            }

            return trimmed;
        }

        async function renderEquation() {
            if (!window.MathJax || !window.MathJax.tex2svgPromise) return;

            const rawLatex = latexInput.value.trim();
            const errorBox = document.getElementById('latexErrorBox');
            const rasterImg = document.getElementById('rasterPreviewImage');
            const dimBadge = document.getElementById('imageDimensionsBadge');

            if (!rawLatex) {
                errorBox.classList.add('hidden');
                rasterImg.classList.add('hidden');
                dimBadge.textContent = 'Empty formula';
                return;
            }

            let preparedLatex = prepareLatexForRendering(rawLatex);
            
            const selectedFont = document.getElementById('fontFamilySelect') ? document.getElementById('fontFamilySelect').value : 'computer-modern';
            if (selectedFont === 'arial') {
                preparedLatex = `\\mathsf{${preparedLatex}}`;
            } else if (selectedFont === 'mono') {
                preparedLatex = `\\mathtt{${preparedLatex}}`;
            } else if (selectedFont === 'euler') {
                preparedLatex = `\\mathcal{${preparedLatex}}`;
            } else if (selectedFont === 'blackboard') {
                preparedLatex = `\\mathbb{${preparedLatex}}`;
            }

            const useDisplayStyle = document.getElementById('displayStyleToggle').checked;
            const finalTex = useDisplayStyle ? `\\displaystyle ${preparedLatex}` : preparedLatex;

            try {
                const wrapper = await MathJax.tex2svgPromise(finalTex, { display: useDisplayStyle });
                const svgEl = wrapper.querySelector('svg');

                const merror = svgEl ? svgEl.querySelector('[data-mml-node="merror"]') : null;
                if (merror) {
                    errorBox.textContent = `LaTeX Syntax Notice: ${merror.textContent || 'Check brackets or command spelling'}`;
                    errorBox.classList.remove('hidden');
                } else {
                    errorBox.classList.add('hidden');
                }

                if (!svgEl) return;

                const fontSizePx = parseInt(document.getElementById('fontSizeNumber').value, 10) || 30;
                const fgColor = document.getElementById('fgColorPicker').value || '#0f172a';
                const paddingPx = parseInt(document.getElementById('paddingSelect').value, 10) ?? 4;

                let fontFamilyCss = '"Computer Modern", "Latin Modern Math", serif';
                if (selectedFont === 'arial') {
                    fontFamilyCss = 'Arial, "Open Sans", -apple-system, sans-serif';
                } else if (selectedFont === 'mono') {
                    fontFamilyCss = '"JetBrains Mono", Courier, monospace';
                } else if (selectedFont === 'euler') {
                    fontFamilyCss = '"STIX Two Text", "AMS Euler", Georgia, serif';
                } else if (selectedFont === 'blackboard') {
                    fontFamilyCss = '"STIX Two Text", serif';
                }

                let viewBox = svgEl.getAttribute('viewBox');
                let vbX = 0, vbY = 0, vbW = 0, vbH = 0;
                if (viewBox) {
                    const parts = viewBox.trim().split(/\s+/).map(Number);
                    if (parts.length === 4) {
                        [vbX, vbY, vbW, vbH] = parts;
                    }
                }

                const widthEx = parseFloat(svgEl.getAttribute('width')) || (vbW ? vbW / 60 : 10);
                const heightEx = parseFloat(svgEl.getAttribute('height')) || (vbH ? vbH / 60 : 3);
                const exToPx = fontSizePx * 0.54;

                let mathWidthPx = Math.max(12, Math.ceil(widthEx * exToPx));
                let mathHeightPx = Math.max(12, Math.ceil(heightEx * exToPx));

                if (vbW > 0 && vbH > 0) {
                    const aspect = vbW / vbH;
                    if (mathWidthPx / mathHeightPx < aspect * 0.95 || mathWidthPx / mathHeightPx > aspect * 1.05) {
                        mathWidthPx = Math.ceil(mathHeightPx * aspect);
                    }
                }

                const density = exportDensity || 3;
                const rawPad = Math.round(16 * density);
                const tempW = Math.round(mathWidthPx * density) + rawPad * 2;
                const tempH = Math.round(mathHeightPx * density) + rawPad * 2;

                const renderSvg = svgEl.cloneNode(true);
                renderSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                renderSvg.setAttribute('width', `${Math.round(mathWidthPx * density)}px`);
                renderSvg.setAttribute('height', `${Math.round(mathHeightPx * density)}px`);
                renderSvg.style.color = fgColor;
                renderSvg.style.fontFamily = fontFamilyCss;
                renderSvg.style.overflow = 'visible';

                const vectorSvg = svgEl.cloneNode(true);
                vectorSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                vectorSvg.setAttribute('width', `${mathWidthPx}px`);
                vectorSvg.setAttribute('height', `${mathHeightPx}px`);
                vectorSvg.style.color = fgColor;
                vectorSvg.style.fontFamily = fontFamilyCss;
                currentSvgElement = vectorSvg;

                const svgString = new XMLSerializer().serializeToString(renderSvg);
                const svgDataUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgString);

                const img = new Image();
                img.onload = () => {
                    const tempCanvas = document.createElement('canvas');
                    tempCanvas.width = tempW;
                    tempCanvas.height = tempH;
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCtx.imageSmoothingEnabled = true;
                    tempCtx.imageSmoothingQuality = 'high';
                    tempCtx.drawImage(img, rawPad, rawPad, Math.round(mathWidthPx * density), Math.round(mathHeightPx * density));

                    const imgData = tempCtx.getImageData(0, 0, tempW, tempH).data;
                    let minX = tempW, minY = tempH, maxX = 0, maxY = 0;
                    let hasContent = false;

                    for (let y = 0; y < tempH; y++) {
                        for (let x = 0; x < tempW; x++) {
                            const alpha = imgData[(y * tempW + x) * 4 + 3];
                            if (alpha > 8) {
                                if (x < minX) minX = x;
                                if (x > maxX) maxX = x;
                                if (y < minY) minY = y;
                                if (y > maxY) maxY = y;
                                hasContent = true;
                            }
                        }
                    }

                    if (!hasContent) {
                        minX = 0; minY = 0; maxX = tempW; maxY = tempH;
                    }

                    const contentW = maxX - minX + 1;
                    const contentH = maxY - minY + 1;
                    const targetPad = Math.round(paddingPx * density);
                    const finalW = contentW + targetPad * 2;
                    const finalH = contentH + targetPad * 2;

                    const finalCanvas = document.createElement('canvas');
                    finalCanvas.width = finalW;
                    finalCanvas.height = finalH;
                    const ctx = finalCanvas.getContext('2d');
                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    if (bgMode === 'white') {
                        ctx.fillStyle = '#ffffff';
                        ctx.fillRect(0, 0, finalW, finalH);
                    } else if (bgMode === 'custom') {
                        ctx.fillStyle = document.getElementById('bgColorPicker').value || '#ffffff';
                        ctx.fillRect(0, 0, finalW, finalH);
                    } else {
                        ctx.clearRect(0, 0, finalW, finalH);
                    }

                    ctx.drawImage(tempCanvas, minX, minY, contentW, contentH, targetPad, targetPad, contentW, contentH);
                    currentCanvas = finalCanvas;

                    const nominalW = Math.round(finalW / density);
                    const nominalH = Math.round(finalH / density);
                    rasterImg.src = finalCanvas.toDataURL('image/png');
                    rasterImg.style.width = `${nominalW}px`;
                    rasterImg.style.height = `${nominalH}px`;
                    rasterImg.classList.remove('hidden');

                    dimBadge.textContent = `${finalW} × ${finalH} px (${density}× Crisp HD)`;
                };
                img.src = svgDataUrl;

            } catch (err) {
                errorBox.textContent = `Render Error: ${err.message || err}`;
                errorBox.classList.remove('hidden');
            }
        }

        function downloadEquation(format) {
            if (!currentCanvas || !currentSvgElement) {
                showToast('Please enter an equation first!', true);
                return;
            }

            const timestamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
            const filename = `equation-${timestamp}.${format}`;

            if (format === 'png') {
                const pngUrl = currentCanvas.toDataURL('image/png');
                triggerDownload(pngUrl, filename);
                showToast('Downloaded crisp .PNG equation!');
            } else if (format === 'svg') {
                const svgData = new XMLSerializer().serializeToString(currentSvgElement);
                const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                triggerDownload(url, filename);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('Downloaded vector .SVG equation!');
            } else if (format === 'gif') {
                const gifBlob = encodeCanvasToGifBlob(currentCanvas, bgMode === 'transparent');
                const url = URL.createObjectURL(gifBlob);
                triggerDownload(url, filename);
                setTimeout(() => URL.revokeObjectURL(url), 5000);
                showToast('Downloaded .GIF equation!');
            }
        }

        function triggerDownload(url, filename) {
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function copyImageToClipboard() {
            if (!currentCanvas) return;

            try {
                const fullDataUrl = currentCanvas.toDataURL('image/png');
                const blob = await new Promise(resolve => currentCanvas.toBlob(resolve, 'image/png'));

                if (navigator.clipboard && window.ClipboardItem && blob) {
                    const htmlBlob = new Blob(
                        [`<img src="${fullDataUrl}" width="${currentCanvas.width}" height="${currentCanvas.height}" />`],
                        { type: 'text/html' }
                    );

                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob,
                                'text/html': htmlBlob
                            })
                        ]);
                        showToast('Full-size equation copied! Ready to paste into Google Docs.');
                        return;
                    } catch (clipErr) {
                        await navigator.clipboard.write([
                            new ClipboardItem({
                                'image/png': blob
                            })
                        ]);
                        showToast('Full-size equation copied! Ready to paste into Google Docs.');
                        return;
                    }
                }
            } catch (err) {
                console.warn('Clipboard API fallback triggered:', err);
            }

            try {
                const fullDataUrl = currentCanvas.toDataURL('image/png');
                const tempContainer = document.createElement('div');
                tempContainer.style.position = 'fixed';
                tempContainer.style.left = '-9999px';
                tempContainer.style.top = '-9999px';
                tempContainer.style.opacity = '0';
                
                const tempImg = document.createElement('img');
                tempImg.src = fullDataUrl;
                tempImg.width = currentCanvas.width;
                tempImg.height = currentCanvas.height;
                tempContainer.appendChild(tempImg);
                document.body.appendChild(tempContainer);

                const range = document.createRange();
                range.selectNode(tempImg);
                const sel = window.getSelection();
                sel.removeAllRanges();
                sel.addRange(range);
                
                const success = document.execCommand('copy');
                sel.removeAllRanges();
                document.body.removeChild(tempContainer);

                if (success) {
                    showToast('Full-size equation copied to clipboard!');
                } else {
                    showToast('Right-click the equation above and choose "Copy Image"', false);
                }
            } catch (e) {
                showToast('Right-click the equation above and choose "Copy Image"', false);
            }
        }

        function encodeCanvasToGifBlob(canvas, isTransparent) {
            const width = canvas.width;
            const height = canvas.height;
            const ctx = canvas.getContext('2d');
            const imgData = ctx.getImageData(0, 0, width, height).data;

            const fgHex = document.getElementById('fgColorPicker').value || '#0f172a';
            const fgR = parseInt(fgHex.slice(1, 3), 16);
            const fgG = parseInt(fgHex.slice(3, 5), 16);
            const fgB = parseInt(fgHex.slice(5, 7), 16);

            let bgR = 255, bgG = 255, bgB = 255;
            if (bgMode === 'custom') {
                const bgHex = document.getElementById('bgColorPicker').value || '#ffffff';
                bgR = parseInt(bgHex.slice(1, 3), 16);
                bgG = parseInt(bgHex.slice(3, 5), 16);
                bgB = parseInt(bgHex.slice(5, 7), 16);
            }

            const palette = new Uint8Array(256 * 3);
            for (let i = 0; i < 256; i++) {
                const t = i / 255;
                palette[i * 3]     = Math.round(bgR * (1 - t) + fgR * t);
                palette[i * 3 + 1] = Math.round(bgG * (1 - t) + fgG * t);
                palette[i * 3 + 2] = Math.round(bgB * (1 - t) + fgB * t);
            }

            const indexedPixels = new Uint8Array(width * height);
            for (let i = 0, p = 0; i < imgData.length; i += 4, p++) {
                const r = imgData[i];
                const g = imgData[i + 1];
                const b = imgData[i + 2];
                const a = imgData[i + 3];

                if (isTransparent) {
                    if (a < 64) {
                        indexedPixels[p] = 0;
                    } else {
                        const alphaNorm = Math.max(1, Math.min(255, a));
                        indexedPixels[p] = alphaNorm;
                    }
                } else {
                    const distBg = Math.abs(r - bgR) + Math.abs(g - bgG) + Math.abs(b - bgB);
                    const distFg = Math.abs(r - fgR) + Math.abs(g - fgG) + Math.abs(b - fgB);
                    const total = distBg + distFg || 1;
                    const ratio = Math.min(255, Math.max(0, Math.round((distBg / total) * 255)));
                    indexedPixels[p] = ratio;
                }
            }

            const bytes = [];
            const writeByte = b => bytes.push(b & 0xff);
            const writeShort = s => { writeByte(s & 0xff); writeByte((s >> 8) & 0xff); };
            const writeStr = str => { for (let i = 0; i < str.length; i++) writeByte(str.charCodeAt(i)); };

            writeStr('GIF89a');
            writeShort(width);
            writeShort(height);
            writeByte(0xf7);
            writeByte(0);
            writeByte(0);

            for (let i = 0; i < palette.length; i++) {
                writeByte(palette[i]);
            }

            writeByte(0x21);
            writeByte(0xf9);
            writeByte(4);
            writeByte(isTransparent ? 0x01 : 0x00);
            writeShort(0);
            writeByte(0);
            writeByte(0);

            writeByte(0x2c);
            writeShort(0);
            writeShort(0);
            writeShort(width);
            writeShort(height);
            writeByte(0x00);

            const minCodeSize = 8;
            writeByte(minCodeSize);

            const lzwData = lzwEncodeGif(indexedPixels, minCodeSize);
            let offset = 0;
            while (offset < lzwData.length) {
                const chunkLen = Math.min(255, lzwData.length - offset);
                writeByte(chunkLen);
                for (let i = 0; i < chunkLen; i++) {
                    writeByte(lzwData[offset + i]);
                }
                offset += chunkLen;
            }
            writeByte(0x00);
            writeByte(0x3b);

            return new Blob([new Uint8Array(bytes)], { type: 'image/gif' });
        }

        function lzwEncodeGif(indexStream, minCodeSize) {
            const clearCode = 1 << minCodeSize;
            const endCode = clearCode + 1;
            let codeSize = minCodeSize + 1;
            let nextCode = endCode + 1;

            const outBytes = [];
            let curByte = 0;
            let curBits = 0;

            function emitCode(code) {
                curByte |= (code << curBits);
                curBits += codeSize;
                while (curBits >= 8) {
                    outBytes.push(curByte & 0xff);
                    curByte >>= 8;
                    curBits -= 8;
                }
            }

            let dict = new Map();
            emitCode(clearCode);

            if (indexStream.length === 0) {
                emitCode(endCode);
                if (curBits > 0) outBytes.push(curByte & 0xff);
                return outBytes;
            }

            let prefix = indexStream[0];
            for (let i = 1; i < indexStream.length; i++) {
                const k = indexStream[i];
                const key = (prefix << 8) | k;
                if (dict.has(key)) {
                    prefix = dict.get(key);
                } else {
                    emitCode(prefix);
                    if (nextCode < 4096) {
                        dict.set(key, nextCode++);
                        if (nextCode > (1 << codeSize) && codeSize < 12) {
                            codeSize++;
                        }
                    } else {
                        emitCode(clearCode);
                        dict.clear();
                        codeSize = minCodeSize + 1;
                        nextCode = endCode + 1;
                    }
                    prefix = k;
                }
            }

            emitCode(prefix);
            emitCode(endCode);
            if (curBits > 0) {
                outBytes.push(curByte & 0xff);
            }
            return outBytes;
        }

        function openMatrixModal() {
            document.getElementById('matrixModal').classList.remove('hidden');
            buildMatrixInputs();
        }

        function closeMatrixModal() {
            document.getElementById('matrixModal').classList.add('hidden');
        }

        function buildMatrixInputs() {
            const type = document.getElementById('matrixBracketType').value;
            const rows = Math.max(1, Math.min(8, parseInt(document.getElementById('matrixRows').value, 10) || 3));
            const colsWrap = document.getElementById('matrixColsWrap');
            let cols = Math.max(1, Math.min(8, parseInt(document.getElementById('matrixCols').value, 10) || 3));

            if (type === 'cases') {
                cols = 2;
                colsWrap.classList.add('opacity-40', 'pointer-events-none');
            } else {
                colsWrap.classList.remove('opacity-40', 'pointer-events-none');
            }

            const grid = document.getElementById('matrixCellGrid');
            let html = '';
            for (let r = 0; r < rows; r++) {
                html += `<div class="flex items-center gap-2">`;
                for (let c = 0; c < cols; c++) {
                    const placeholder = type === 'cases' 
                        ? (c === 0 ? `Expression ${r+1}` : `Condition ${r+1} (e.g. x > 0)`)
                        : `a_{${r+1}${c+1}}`;
                    html += `<input type="text" data-row="${r}" data-col="${c}" placeholder="${placeholder}"
                        class="matrix-cell mono-font flex-1 min-w-[70px] px-2.5 py-1.5 bg-white border border-slate-300 rounded-lg text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">`;
                }
                html += `</div>`;
            }
            grid.innerHTML = html;
        }

        function fillSampleMatrix() {
            const type = document.getElementById('matrixBracketType').value;
            const cells = document.querySelectorAll('.matrix-cell');
            cells.forEach(input => {
                const r = parseInt(input.getAttribute('data-row'), 10) + 1;
                const c = parseInt(input.getAttribute('data-col'), 10) + 1;
                if (type === 'cases') {
                    input.value = c === 1 ? `x^${r}` : `\\text{if } x \\ge ${r - 1}`;
                } else {
                    input.value = `a_{${r}${c}}`;
                }
            });
        }

        function insertGeneratedMatrix() {
            const type = document.getElementById('matrixBracketType').value;
            const rows = Math.max(1, Math.min(8, parseInt(document.getElementById('matrixRows').value, 10) || 3));
            const cols = type === 'cases' ? 2 : Math.max(1, Math.min(8, parseInt(document.getElementById('matrixCols').value, 10) || 3));

            const rowStrings = [];
            for (let r = 0; r < rows; r++) {
                const colStrings = [];
                for (let c = 0; c < cols; c++) {
                    const input = document.querySelector(`.matrix-cell[data-row="${r}"][data-col="${c}"]`);
                    const val = input && input.value.trim() !== '' ? input.value.trim() : (type === 'cases' ? '' : '0');
                    colStrings.push(val);
                }
                rowStrings.push('  ' + colStrings.join(' & '));
            }

            const latexBlock = `\\begin{${type}}\n${rowStrings.join(' \\\\\n')}\n\\end{${type}}`;
            closeMatrixModal();
            insertSnippet(latexBlock);
            showToast(`Inserted ${type} into equation!`);
        }

        let toastTimeout;
        function showToast(msg, isError = false) {
            const banner = document.getElementById('toastBanner');
            const icon = document.getElementById('toastIcon');
            const text = document.getElementById('toastMessage');

            text.textContent = msg;
            icon.className = isError 
                ? 'fa-solid fa-triangle-exclamation text-amber-400' 
                : 'fa-solid fa-circle-check text-emerald-400';

            banner.classList.remove('opacity-0', 'translate-y-2');
            banner.classList.add('opacity-100', 'translate-y-0');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                banner.classList.add('opacity-0', 'translate-y-2');
                banner.classList.remove('opacity-100', 'translate-y-0');
            }, 2800);
        }
    </script>
