  <style>
    :root {
      color-scheme: dark;
    }

    body {
      font-family: 'Inter', sans-serif;
      user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Dark custom scrollbar styling across all modern browsers */
    * {
      scrollbar-width: thin;
      scrollbar-color: #334155 #0b0f19;
    }

    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    ::-webkit-scrollbar-track {
      background: #090d16;
      border-radius: 9999px;
    }

    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 9999px;
      border: 1.5px solid #090d16;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #475569;
    }

    ::-webkit-scrollbar-thumb:active {
      background: #64748b;
    }

    /* Dark custom checkbox styling with light border across all browsers */
    input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      background-color: #020617; /* Dark slate-950 interior */
      margin: 0;
      cursor: pointer;
      width: 1.15rem;
      height: 1.15rem;
      border: 1.5px solid #cbd5e1; /* Light slate border */
      border-radius: 0.35rem;
      display: inline-grid;
      place-content: center;
      transition: all 0.15s ease-in-out;
      flex-shrink: 0;
    }

    input[type="checkbox"]:hover {
      border-color: #f8fafc; /* Bright white border on hover */
      background-color: #0b0f19;
    }

    /* Custom checkmark indicator */
    input[type="checkbox"]::before {
      content: "";
      width: 0.65rem;
      height: 0.65rem;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
      transform: scale(0);
      transform-origin: center;
      transition: 120ms transform ease-in-out;
      background-color: #38bdf8; /* Luminous sky-blue checkmark */
    }

    /* Keep background dark and border light when checked */
    input[type="checkbox"]:checked {
      background-color: #020617; /* Remains dark when checked */
      border-color: #f1f5f9; /* Bright light border */
    }

    input[type="checkbox"]:checked::before {
      transform: scale(1);
    }

    input[type="checkbox"]:disabled {
      cursor: default;
    }

    input[type="checkbox"]:focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-full min-h-screen overflow-hidden flex flex-col">

    <!-- Eccentricity Slider at Top -->

    const STAR_TINTS = [
      '248, 250, 252', // Pure silver-white

    ];

    const SHIP_TYPES = ['saucer', 'interceptor', 'bioPod', 'retroRocket', 'crystalMonolith', 'ringCruiser'];

    const alienShip = {
      active: false,
      type: 'saucer',
      x: 0,
      y: 0,
      vx: 0,
      vy: 0,
      angle: 0,
      wobblePhase: 0,
      wobbleOffset: 0,

    function scheduleNextAlienSpawn() {
      alienShip.active = false;
      alienShip.timeSinceLast = 0;
      alienShip.nextSpawnDelay = 20.0 + Math.random() * 20.0;
    }

    function distToSegment(px, py, x1, y1, x2, y2) {
      const l2 = (x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1);
      if (l2 === 0) return Math.hypot(px - x1, py - y1);
      let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
      t = Math.max(0, Math.min(1, t));
      const projX = x1 + t * (x2 - x1);
      const projY = y1 + t * (y2 - y1);
      return Math.hypot(px - projX, py - projY);
    }

    function spawnAlien() {
      alienShip.type = SHIP_TYPES[Math.floor(Math.random() * SHIP_TYPES.length)];
      alienShip.particles = [];
      alienShip.wobblePhase = Math.random() * Math.PI * 2;
      alienShip.animTimer = 0;

      const sunScreen = toScreen(userEccentricity * 1.0, 0);
      const SUN_SAFE_DISTANCE = 95;

      let startX = 0, startY = 0, targetX = 0, targetY = 0;
      let validPath = false;

      for (let attempt = 0; attempt < 30; attempt++) {
        const fromLeft = Math.random() > 0.5;
        startY = height * (0.08 + Math.random() * 0.84);
        targetY = height * (0.08 + Math.random() * 0.84);

        startX = fromLeft ? -60 : width + 60;
        targetX = fromLeft ? width + 60 : -60;

        const distanceToSun = distToSegment(sunScreen.x, sunScreen.y, startX, startY, targetX, targetY);
        if (distanceToSun >= SUN_SAFE_DISTANCE) {
          validPath = true;
          break;
        }
      }

      if (!validPath) {
        const routeAbove = sunScreen.y > height / 2;
        startY = routeAbove ? height * 0.12 : height * 0.88;
        targetY = routeAbove ? height * 0.18 : height * 0.82;
        const fromLeft = Math.random() > 0.5;
        startX = fromLeft ? -60 : width + 60;
        targetX = fromLeft ? width + 60 : -60;
      }

      alienShip.x = startX;
      alienShip.y = startY;

      const dx = targetX - startX;
      const dy = targetY - startY;
      const dist = Math.hypot(dx, dy) || 1;

      const speed = 75 + Math.random() * 45;
      alienShip.vx = (dx / dist) * speed;
      alienShip.vy = (dy / dist) * speed;
      alienShip.angle = Math.atan2(dy, dx);
      alienShip.scale = 0.60 + Math.random() * 0.12;
      alienShip.active = true;
    }

    function updateAlien(dt) {
      if (!alienShip.active) {
        alienShip.timeSinceLast += dt;
        if (alienShip.timeSinceLast >= alienShip.nextSpawnDelay) {
          spawnAlien();
        }
        return;
      }

      alienShip.wobblePhase += dt * 3.5;
      alienShip.wobbleOffset = Math.sin(alienShip.wobblePhase) * 4.0;
      alienShip.animTimer += dt;

      alienShip.x += alienShip.vx * dt;
      alienShip.y += alienShip.vy * dt;

      if (Math.random() < 0.75) {
        let pColor = 'rgba(56, 189, 248,';
        if (alienShip.type === 'saucer') pColor = Math.random() > 0.5 ? 'rgba(74, 222, 128,' : 'rgba(56, 189, 248,';
        else if (alienShip.type === 'bioPod') pColor = 'rgba(236, 72, 153,';
        else if (alienShip.type === 'retroRocket') pColor = Math.random() > 0.5 ? 'rgba(249, 115, 22,' : 'rgba(234, 179, 8,';
        else if (alienShip.type === 'crystalMonolith') pColor = 'rgba(192, 132, 252,';
        else if (alienShip.type === 'ringCruiser') pColor = 'rgba(45, 212, 191,';

        alienShip.particles.push({
          x: alienShip.x - Math.cos(alienShip.angle) * 14,
          y: alienShip.y + alienShip.wobbleOffset - Math.sin(alienShip.angle) * 14,
          vx: -alienShip.vx * 0.18 + (Math.random() - 0.5) * 12,
          vy: -alienShip.vy * 0.18 + (Math.random() - 0.5) * 12,
          alpha: 0.85,
          radius: 1.2 + Math.random() * 1.6,
          color: pColor
        });
      }

      for (let i = alienShip.particles.length - 1; i >= 0; i--) {
        const p = alienShip.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.alpha -= dt * 1.8;
        if (p.alpha <= 0) {
          alienShip.particles.splice(i, 1);
        }
      }

      const margin = 110;
      if (
        (alienShip.vx > 0 && alienShip.x > width + margin) ||
        (alienShip.vx < 0 && alienShip.x < -margin) ||
        alienShip.y < -margin ||
        alienShip.y > height + margin
      ) {
        scheduleNextAlienSpawn();
      }
    }

    function drawAlienShip() {
      for (const p of alienShip.particles) {
        ctx.fillStyle = `${p.color} ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }

      if (!alienShip.active) return;

      const posX = alienShip.x;
      const posY = alienShip.y + alienShip.wobbleOffset;
      const sc = alienShip.scale;
      const t = alienShip.animTimer;

      ctx.save();
      ctx.translate(posX, posY);
      ctx.rotate(alienShip.angle);
      if (alienShip.vx < 0) {
        ctx.scale(1, -1);
      }
      ctx.scale(sc, sc);

      switch (alienShip.type) {
        case 'saucer': {
          const hullGrad = ctx.createLinearGradient(0, -8, 0, 8);
          hullGrad.addColorStop(0, '#94a3b8');
          hullGrad.addColorStop(0.5, '#f1f5f9');
          hullGrad.addColorStop(1, '#334155');
          ctx.fillStyle = hullGrad;
          ctx.beginPath();
          ctx.ellipse(0, 2, 22, 7, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#e2e8f0';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = 'rgba(186, 230, 253, 0.55)';
          ctx.beginPath();
          ctx.ellipse(0, -2, 10, 9, 0, Math.PI, 0);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#4ade80';
          ctx.beginPath();
          ctx.ellipse(0, -4, 4, 5, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#090d16';
          ctx.beginPath();
          ctx.ellipse(-1.6, -4.5, 1.2, 1.6, -0.2, 0, Math.PI * 2);
          ctx.ellipse(1.6, -4.5, 1.2, 1.6, 0.2, 0, Math.PI * 2);
          ctx.fill();

          for (let i = 0; i < 5; i++) {
            const lx = -14 + i * 7;
            const phase = Math.floor((t * 7 + i) % 3);
            ctx.fillStyle = phase === 0 ? '#38bdf8' : (phase === 1 ? '#4ade80' : '#facc15');
            ctx.beginPath();
            ctx.arc(lx, 3, 1.5, 0, Math.PI * 2);
            ctx.fill();
          }
          break;
        }

        case 'interceptor': {
          const bodyGrad = ctx.createLinearGradient(16, 0, -18, 0);
          bodyGrad.addColorStop(0, '#38bdf8');
          bodyGrad.addColorStop(0.4, '#1e293b');
          bodyGrad.addColorStop(1, '#0f172a');
          ctx.fillStyle = bodyGrad;

          ctx.beginPath();
          ctx.moveTo(22, 0);
          ctx.lineTo(-14, -13);
          ctx.lineTo(-8, -4);
          ctx.lineTo(-16, 0);
          ctx.lineTo(-8, 4);
          ctx.lineTo(-14, 13);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#7dd3fc';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = '#0284c7';
          ctx.fillRect(-16, -7, 4, 3);
          ctx.fillRect(-16, 4, 4, 3);

          ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
          ctx.beginPath();
          ctx.ellipse(4, 0, 7, 2.5, 0, 0, Math.PI * 2);
          ctx.fill();
          break;
        }

        case 'bioPod': {
          const bioGrad = ctx.createRadialGradient(2, 0, 2, 0, 0, 16);
          bioGrad.addColorStop(0, '#f472b6');
          bioGrad.addColorStop(0.6, '#a855f7');
          bioGrad.addColorStop(1, 'rgba(79, 70, 229, 0.4)');
          ctx.fillStyle = bioGrad;

          ctx.beginPath();
          ctx.ellipse(2, 0, 15, 9, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fbcfe8';
          ctx.lineWidth = 1;
          ctx.stroke();

          const pulse = 2.5 + Math.sin(t * 8) * 1.0;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(3, 0, pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = 'rgba(236, 72, 153, 0.7)';
          ctx.lineWidth = 1.2;
          for (let k = -2; k <= 2; k++) {
            const wave = Math.sin(t * 10 + k) * 3;
            ctx.beginPath();
            ctx.moveTo(-10, k * 3);
            ctx.quadraticCurveTo(-18, k * 4 + wave, -24, k * 5 - wave);
            ctx.stroke();
          }
          break;
        }

        case 'retroRocket': {
          const rocketGrad = ctx.createLinearGradient(0, -6, 0, 6);
          rocketGrad.addColorStop(0, '#f87171');
          rocketGrad.addColorStop(0.3, '#f1f5f9');
          rocketGrad.addColorStop(0.8, '#cbd5e1');
          rocketGrad.addColorStop(1, '#94a3b8');
          ctx.fillStyle = rocketGrad;

          ctx.beginPath();
          ctx.moveTo(22, 0);
          ctx.quadraticCurveTo(8, -7, -12, -6);
          ctx.lineTo(-12, 6);
          ctx.quadraticCurveTo(8, 7, 22, 0);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#ef4444';
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = '#dc2626';
          ctx.beginPath();
          ctx.moveTo(-6, -6);
          ctx.lineTo(-16, -12);
          ctx.lineTo(-12, -4);
          ctx.closePath();
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(-6, 6);
          ctx.lineTo(-16, 12);
          ctx.lineTo(-12, 4);
          ctx.closePath();
          ctx.fill();

          ctx.fillStyle = '#38bdf8';
          ctx.beginPath();
          ctx.arc(6, 0, 2.4, 0, Math.PI * 2);
          ctx.arc(-1, 0, 2.4, 0, Math.PI * 2);
          ctx.fill();
          break;
        }

        case 'crystalMonolith': {
          const prismGrad = ctx.createLinearGradient(-15, -10, 15, 10);
          prismGrad.addColorStop(0, '#c084fc');
          prismGrad.addColorStop(0.5, '#6366f1');
          prismGrad.addColorStop(1, '#38bdf8');
          ctx.fillStyle = prismGrad;

          ctx.beginPath();
          ctx.moveTo(18, 0);
          ctx.lineTo(0, -11);
          ctx.lineTo(-16, -7);
          ctx.lineTo(-9, 0);
          ctx.lineTo(-16, 7);
          ctx.lineTo(0, 11);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#e9d5ff';
          ctx.lineWidth = 1.2;
          ctx.stroke();

          ctx.save();
          ctx.rotate(t * 4);
          ctx.fillStyle = '#fef08a';
          ctx.fillRect(-2.5, -2.5, 5, 5);
          ctx.restore();
          break;
        }

        case 'ringCruiser': {
          ctx.strokeStyle = '#2dd4bf';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(0, 0, 12, 15, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.fillStyle = '#334155';
          ctx.fillRect(-14, -2.5, 28, 5);
          ctx.strokeStyle = '#94a3b8';
          ctx.lineWidth = 1;
          ctx.strokeRect(-14, -2.5, 28, 5);

          const coreGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, 5);
          coreGrad.addColorStop(0, '#ffffff');
          coreGrad.addColorStop(0.5, '#38bdf8');
          coreGrad.addColorStop(1, 'rgba(59, 130, 246, 0.2)');
          ctx.fillStyle = coreGrad;
          ctx.beginPath();
          ctx.arc(0, 0, 5.5, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#facc15';
          ctx.beginPath();
          ctx.arc(14, 0, 2.5, 0, Math.PI * 2);
          ctx.fill();
          break;
        }
      }

      ctx.restore();
    }

    const chkStringProperty = document.getElementById('chkStringProperty');
    const lblStringProperty = document.getElementById('lblStringProperty');
    const stringPropertyWrapper = document.getElementById('stringPropertyWrapper');
    const chkKeplerSlices = document.getElementById('chkKeplerSlices');
    const chkVelocityVector = document.getElementById('chkVelocityVector');
    const chkGravityVector = document.getElementById('chkGravityVector');
    const sliderEccentricity = document.getElementById('sliderEccentricity');
    const txtEccentricityVal = document.getElementById('txtEccentricityVal');
    const txtPlanetDist = document.getElementById('txtPlanetDist');
    const txtPlanetSpeed = document.getElementById('txtPlanetSpeed');

    const selectBody = document.getElementById('selectBody');
    const btnPrevBody = document.getElementById('btnPrevBody');
    const btnNextBody = document.getElementById('btnNextBody');

    const legendPlanetDot = document.getElementById('legendPlanetDot');
    const legendPlanetName = document.getElementById('legendPlanetName');

    const btnPlayPause = document.getElementById('btnPlayPause');
    const btnPlayPauseText = document.getElementById('btnPlayPauseText');
    const iconPause = document.getElementById('iconPause');
    const iconPlay = document.getElementById('iconPlay');
    const btnReset = document.getElementById('btnReset');

    const btnMobilePlayPause = document.getElementById('btnMobilePlayPause');
    const iconMobilePause = document.getElementById('iconMobilePause');
    const iconMobilePlay = document.getElementById('iconMobilePlay');

    const btnPresetZero = document.getElementById('btnPresetZero');
    const btnPresetLow = document.getElementById('btnPresetLow');
    const btnPresetMid = document.getElementById('btnPresetMid');
    const btnPresetHigh = document.getElementById('btnPresetHigh');
    const btnPresetMax = document.getElementById('btnPresetMax');

    const presetButtons = [btnPresetZero, btnPresetLow, btnPresetMid, btnPresetHigh, btnPresetMax];

    function solveKepler(M, e) {
      let E = M;
      for (let i = 0; i < 25; i++) {
        const f = E - e * Math.sin(E) - M;
        const fPrime = 1 - e * Math.cos(E);
        const dE = -f / fPrime;
        E += dE;
        if (Math.abs(dE) < 1e-7) break;
      }
      return E;
    }

    function calculateOrbitalState(t, period, e, bodyData) {
      const a = 1.0;
      const b = a * Math.sqrt(Math.max(0, 1 - e * e));
      const c = a * e;

      const n = (2 * Math.PI) / period;
      const M = (n * t) % (2 * Math.PI);
      const E = solveKepler(M, e);

      const x = a * Math.cos(E);
      const y = b * Math.sin(E);

      const dx = x - c;
      const dy = y;
      const r_norm = Math.sqrt(dx * dx + dy * dy);

      const a_real = bodyData ? bodyData.a_real : 1.0;
      const r_real = r_norm * a_real;

      const velocity = 29.78 * Math.sqrt(Math.max(0, (2.0 / r_real) - (1.0 / a_real)));

      const dE_dt = n / (1 - e * Math.cos(E));
      const vx_AU = -a * Math.sin(E) * dE_dt;
      const vy_AU = b * Math.cos(E) * dE_dt;
      const vNorm = Math.sqrt(vx_AU * vx_AU + vy_AU * vy_AU) || 1;
      const vx_unit = vx_AU / vNorm;
      const vy_unit = vy_AU / vNorm;

      const monthFraction = ((t % period) + period) % period / period;
      const sliceIndex = Math.min(11, Math.floor(monthFraction * 12));

      return {
        a, b, c,
        E, x, y,
        r: r_real,
        velocity,
        vx_unit, vy_unit,
        sliceIndex
      };
    }

    function initStarfield() {
      stars.length = 0;
      for (let i = 0; i < NUM_STARS; i++) {
        // Exactly 30% of stars exhibit noticeable celestial twinkling
        const doesTwinkle = Math.random() < 0.30;
        stars.push({
          x: Math.random(),
          y: Math.random(),
          baseRadius: Math.random() * 1.2 + 0.4,
          baseAlpha: Math.random() * 0.5 + 0.3,
          twinkles: doesTwinkle,
          speed1: 1.8 + Math.random() * 2.2,
          speed2: 0.9 + Math.random() * 1.4,
          phase: Math.random() * Math.PI * 2,
          color: STAR_TINTS[Math.floor(Math.random() * STAR_TINTS.length)]
        });
      }
    }

    function resizeCanvas() {
      const container = document.getElementById('canvasContainer');
      width = container.clientWidth;
      height = container.clientHeight;
      const dpr = window.devicePixelRatio || 1;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      const minDimension = Math.min(width, height);
      scale = minDimension / 2.38;
    }

    window.addEventListener('resize', resizeCanvas);

    function toScreen(xAU, yAU) {
      const centerX = width / 2;
      const centerY = height / 2;
      return {
        x: centerX + xAU * scale,
        y: centerY - yAU * scale
      };
    }

    function drawStars(timeSec = 0) {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = 'rgba(30, 41, 59, 0.3)';
      ctx.lineWidth = 1;
      const gridSize = 60;
      const startX = (width / 2) % gridSize;
      const startY = (height / 2) % gridSize;

      ctx.beginPath();
      for (let x = startX; x < width; x += gridSize) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
      }
      for (let y = startY; y < height; y += gridSize) {
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
      }
      ctx.stroke();

      for (const star of stars) {
        let currentAlpha = star.baseAlpha;
        let currentRadius = star.baseRadius;

        if (star.twinkles) {
          // Atmospheric scintillation with noticeable brightness variation & subtle pulse
          const shimmer = Math.sin(timeSec * star.speed1 + star.phase) * 0.65
                        + Math.cos(timeSec * star.speed2 + star.phase * 1.5) * 0.35;
          currentAlpha = Math.max(0.12, Math.min(1.0, star.baseAlpha + shimmer * 0.38));
          currentRadius = Math.max(0.3, star.baseRadius * (1.0 + shimmer * 0.22));

          // Soft micro-sparkle when twinkling star peaks in brightness
          if (currentAlpha > 0.85) {
            ctx.fillStyle = `rgba(${star.color}, ${(currentAlpha * 0.25).toFixed(3)})`;
            ctx.beginPath();
            ctx.arc(star.x * width, star.y * height, currentRadius * 2.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        ctx.fillStyle = `rgba(${star.color}, ${currentAlpha.toFixed(3)})`;
        ctx.beginPath();
        ctx.arc(star.x * width, star.y * height, currentRadius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Set to true to make each sector light up while the connecting line is in it
    const HIGHLIGHT_SECTORS = false;

    function drawKeplerSlices(period, e, timeNow) {
      const a = 1.0;
      const b = a * Math.sqrt(Math.max(0, 1 - e * e));
      const c = a * e;
      const sunPos = toScreen(c, 0);

      const numSlices = 12;
      const stepsPerSlice = 24;

      // Continuous orbital progress across the 12 equal-time sectors
      const monthFraction = (((timeNow % period) + period) % period) / period;
      const exactPos = monthFraction * numSlices;

      for (let i = 0; i < numSlices; i++) {
        const M1 = (2 * Math.PI * i) / numSlices;
        const M2 = (2 * Math.PI * (i + 1)) / numSlices;

        ctx.beginPath();
        ctx.moveTo(sunPos.x, sunPos.y);

        for (let s = 0; s <= stepsPerSlice; s++) {
          const frac = s / stepsPerSlice;
          const M_step = M1 + (M2 - M1) * frac;
          const E_step = solveKepler(M_step, e);
          const pt = toScreen(a * Math.cos(E_step), b * Math.sin(E_step));
          ctx.lineTo(pt.x, pt.y);
        }
        ctx.closePath();

        // Calculate smooth fade-in/out glow factor using a continuous cosine cross-fade
        const center = i + 0.5;
        let dist = Math.abs(exactPos - center);
        if (dist > numSlices / 2) {
          dist = numSlices - dist;
        }

        let glowFactor = 0;
        if (dist <= 0.35) {
          // Plateau at peak brightness in the core of the sector
          glowFactor = 1.0;
        } else if (dist < 0.65) {
          // Smooth sinusoidal cross-fade across the boundary
          const t = (dist - 0.35) / 0.30;
          glowFactor = 0.5 * (1 + Math.cos(Math.PI * t));
        } else {
          glowFactor = 0;
        }

        if (!HIGHLIGHT_SECTORS) glowFactor = 0;
        const [r, g, b_col] = SLICE_BASE_RGB[i % SLICE_BASE_RGB.length];

        // Smooth color brightening & opacity scaling based on glowFactor
        // Softer sector highlight so the sweeping glow trail stays the focus
        const fillAlpha = 0.22 + 0.22 * glowFactor;
        const brightR = Math.round(r + (255 - r) * (0.12 * glowFactor));
        const brightG = Math.round(g + (255 - g) * (0.12 * glowFactor));
        const brightB = Math.round(b_col + (255 - b_col) * (0.12 * glowFactor));

        ctx.fillStyle = `rgba(${brightR}, ${brightG}, ${brightB}, ${fillAlpha.toFixed(3)})`;
        ctx.fill();

        if (glowFactor > 0.01) {
          ctx.lineWidth = 1 + 0.6 * glowFactor;
          ctx.strokeStyle = `rgba(${brightR}, ${brightG}, ${brightB}, ${(0.55 + 0.2 * glowFactor).toFixed(3)})`;
        } else {
          ctx.lineWidth = 1;
          ctx.strokeStyle = SLICE_STROKES[i % SLICE_STROKES.length];
        }
        ctx.stroke();
      }

      drawSweepTrail(e, a, b, sunPos, monthFraction);
    }

    // Glowing trail dragged behind the connecting line (Kepler's 2nd law).
    // The trail spans a fixed fraction of the orbital PERIOD, so it always covers
    // the same area: long and thin near aphelion, short and wide near perihelion.
    const TRAIL_TIME_FRACTION = 1 / 8;   // trail length = 1/8 of a period (1.5 sectors)
    const TRAIL_PEAK_ALPHA = 0.6;        // brightness right behind the line

    // Colour of a Kepler sector, lifted toward white by `lift` (0..1), as "r, g, b"
    function sectorRGB(i, lift) {
      const [r, g, bl] = SLICE_BASE_RGB[((i % 12) + 12) % 12];
      return [r + (255 - r) * lift, g + (255 - g) * lift, bl + (255 - bl) * lift]
        .map(Math.round).join(', ');
    }
    const TRAIL_COLOR_LIFT = 0.35; // how much the sector colour is brightened in the wake

    function drawSweepTrail(e, a, b, sunPos, monthFraction) {
      const twoPi = Math.PI * 2;
      const sectorSize = twoPi / 12;
      const Mnow = monthFraction * twoPi;
      const span = TRAIL_TIME_FRACTION * twoPi;
      const samples = 48;

      // Points behind the line, as a fraction t of the trail (0 = at the line, 1 = tail end),
      // plus the exact sector boundaries the trail crosses so colours change sharply there
      const marks = [];
      for (let k = 0; k <= samples; k++) {
        const t = k / samples;
        marks.push({ t, sector: Math.floor((Mnow - span * t) / sectorSize + 1e-9) });
      }
      for (let j = Math.floor(Mnow / sectorSize); j * sectorSize > Mnow - span; j--) {
        const t = (Mnow - j * sectorSize) / span;
        if (t > 0 && t < 1) marks.push({ t, boundary: j });
      }
      marks.sort((p, q) => p.t - q.t);

      for (const m of marks) {
        const M = Mnow - span * m.t;
        const E = solveKepler(((M % twoPi) + twoPi) % twoPi, e);
        m.pt = toScreen(a * Math.cos(E), b * Math.sin(E));
      }

      const currentSector = marks[0].sector;
      const tip = marks[0].pt;

      // Conic gradient centred on the Sun: each part of the wake takes its sector's colour,
      // brightest right behind the line and fading toward the tail
      let fill;
      if (typeof ctx.createConicGradient === 'function') {
        const lineAngle = Math.atan2(tip.y - sunPos.y, tip.x - sunPos.x);
        fill = ctx.createConicGradient(lineAngle, sunPos.x, sunPos.y);
        let lastOffset = 0;
        for (let k = 0; k < marks.length; k++) {
          const m = marks[k];
          let d = Math.atan2(m.pt.y - sunPos.y, m.pt.x - sunPos.x) - lineAngle;
          d = ((d % twoPi) + twoPi) % twoPi;
          if (k === 0) d = 0;
          const off = Math.min(0.998, Math.max(lastOffset, d / twoPi));
          lastOffset = off;
          const fade = 1 - m.t;
          const alpha = (TRAIL_PEAK_ALPHA * fade * fade).toFixed(3);
          if (m.boundary !== undefined) {
            // Sector ahead of the boundary, then the sector behind it, at the same angle
            fill.addColorStop(off, `rgba(${sectorRGB(m.boundary, TRAIL_COLOR_LIFT)}, ${alpha})`);
            fill.addColorStop(off, `rgba(${sectorRGB(m.boundary - 1, TRAIL_COLOR_LIFT)}, ${alpha})`);
          } else {
            fill.addColorStop(off, `rgba(${sectorRGB(m.sector, TRAIL_COLOR_LIFT)}, ${alpha})`);
          }
        }
        const tail = sectorRGB(marks[marks.length - 1].sector, TRAIL_COLOR_LIFT);
        fill.addColorStop(lastOffset + 0.001, `rgba(${tail}, 0)`);
        fill.addColorStop(1, `rgba(${tail}, 0)`);
      } else {
        fill = `rgba(${sectorRGB(currentSector, TRAIL_COLOR_LIFT)}, 0.3)`;
      }

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sunPos.x, sunPos.y);
      for (const m of marks) ctx.lineTo(m.pt.x, m.pt.y);
      ctx.closePath();
      ctx.fillStyle = fill;
      ctx.fill();

      // Strong glow on the line in the current sector's colour,
      // clipped to the wake so none of it shows ahead of the line
      ctx.clip();
      const glowRGB = sectorRGB(currentSector, 0.45);
      ctx.beginPath();
      ctx.moveTo(sunPos.x, sunPos.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.shadowColor = `rgba(${glowRGB}, 1)`;
      ctx.shadowBlur = 22;
      ctx.strokeStyle = `rgba(${glowRGB}, 0.85)`;
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.stroke();
      ctx.restore();

      // Crisp leading edge drawn on top, with no glow
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(sunPos.x, sunPos.y);
      ctx.lineTo(tip.x, tip.y);
      ctx.strokeStyle = 'rgba(255, 250, 220, 0.95)';
      ctx.lineWidth = 1.6;
      ctx.stroke();
      ctx.restore();
    }

    function drawOrbitPath(e, bodyData) {
      const a = 1.0;
      const b = a * Math.sqrt(Math.max(0, 1 - e * e));

      ctx.beginPath();
      const numPoints = 180;
      for (let i = 0; i <= numPoints; i++) {
        const E = (i / numPoints) * 2 * Math.PI;
        const pt = toScreen(a * Math.cos(E), b * Math.sin(E));
        if (i === 0) ctx.moveTo(pt.x, pt.y);
        else ctx.lineTo(pt.x, pt.y);
      }
      ctx.closePath();
      ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.stroke();
      ctx.setLineDash([]);

      const periPt = toScreen(a, 0);
      const aphPt = toScreen(-a, 0);

      const a_real = bodyData ? bodyData.a_real : 1.0;
      const periDist = (a_real * (1 - e)).toFixed(2);
      const aphDist = (a_real * (1 + e)).toFixed(2);

      ctx.fillStyle = 'rgba(244, 63, 94, 0.9)';
      ctx.beginPath();
      ctx.arc(periPt.x, periPt.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fda4af';
      ctx.font = '13px JetBrains Mono, monospace';
      ctx.textAlign = 'left';
      ctx.fillText(` Perihelion (${periDist} AU)`, periPt.x + 4, periPt.y - 6);

      ctx.fillStyle = 'rgba(56, 189, 248, 0.9)';
      ctx.beginPath();
      ctx.arc(aphPt.x, aphPt.y, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#7dd3fc';
      ctx.textAlign = 'right';
      ctx.fillText(`Aphelion (${aphDist} AU) `, aphPt.x - 4, aphPt.y - 6);
    }

    function drawFoci(e) {
      const a = 1.0;
      const c = a * e;

      const f2 = toScreen(-c, 0);
      const center = toScreen(0, 0);

      ctx.beginPath();
      const pRight = toScreen(a, 0);
      const pLeft = toScreen(-a, 0);
      ctx.moveTo(pLeft.x, pLeft.y);
      ctx.lineTo(pRight.x, pRight.y);
      ctx.strokeStyle = 'rgba(167, 139, 250, 0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Dot at the geometric center matching the major axis color
      ctx.fillStyle = '#a78bfa';
      ctx.beginPath();
      ctx.arc(center.x, center.y, 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(f2.x, f2.y, 5.5, 0, Math.PI * 2);
      ctx.strokeStyle = '#c084fc';
      ctx.lineWidth = 2;
      ctx.setLineDash([2, 2]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(192, 132, 252, 0.3)';
      ctx.fill();
    }

    function drawSun(e) {
      const a = 1.0;
      const c = a * e;
      const pos = toScreen(c, 0);

      const glowGrad = ctx.createRadialGradient(pos.x, pos.y, 4.5, pos.x, pos.y, 28.5);
      glowGrad.addColorStop(0, 'rgba(251, 191, 36, 0.7)');
      glowGrad.addColorStop(0.4, 'rgba(245, 158, 11, 0.3)');
      glowGrad.addColorStop(1, 'rgba(245, 158, 11, 0)');

      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 28.5, 0, Math.PI * 2);
      ctx.fill();

      const coreGrad = ctx.createRadialGradient(pos.x - 2, pos.y - 2, 1.5, pos.x, pos.y, 10.5);
      coreGrad.addColorStop(0, '#fffbeb');
      coreGrad.addColorStop(0.3, '#fde047');
      coreGrad.addColorStop(0.8, '#f59e0b');
      coreGrad.addColorStop(1, '#b45309');

      ctx.fillStyle = coreGrad;
      ctx.beginPath();
      ctx.arc(pos.x, pos.y, 10.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#fef08a';
      ctx.font = 'bold 13px JetBrains Mono, monospace';
      ctx.textAlign = 'center';
      ctx.fillText('Sun', pos.x, pos.y - 16);
    }

    function drawVectorArrow(fromX, fromY, toX, toY, color, label = '', labelOffset = { x: 0, y: -6 }, subscript = '') {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const len = Math.hypot(dx, dy);
      if (len < 1) return;

      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.strokeStyle = color;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      const angle = Math.atan2(dy, dx);
      const headLen = Math.min(11, Math.max(6, len * 0.25));
      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headLen * Math.cos(angle - Math.PI / 6), toY - headLen * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headLen * Math.cos(angle + Math.PI / 6), toY - headLen * Math.sin(angle + Math.PI / 6));
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();

      if (label) {
        ctx.save();
        ctx.fillStyle = color;
        ctx.textBaseline = 'middle';

        const lx = toX + labelOffset.x;
        const ly = toY + labelOffset.y;

        if (subscript) {
          // 2pt larger base font (15px) with properly proportioned subscript (11px)
          ctx.font = 'bold 15px JetBrains Mono, monospace';
          const mainWidth = ctx.measureText(label).width;

          ctx.font = 'bold 11px JetBrains Mono, monospace';
          const subWidth = ctx.measureText(subscript).width;

          const totalWidth = mainWidth + subWidth;
          const startX = lx - totalWidth / 2;

          // Draw main symbol
          ctx.font = 'bold 15px JetBrains Mono, monospace';
          ctx.textAlign = 'left';
          ctx.fillText(label, startX, ly);

          // Draw subscript slightly shifted down and clearly legible
          ctx.font = 'bold 11px JetBrains Mono, monospace';
          ctx.fillText(subscript, startX + mainWidth + 1, ly + 4);
        } else {
          ctx.font = 'bold 15px JetBrains Mono, monospace';
          ctx.textAlign = 'center';
          ctx.fillText(label, lx, ly);
        }
        ctx.restore();
      }
    }

    function drawPlanet(state, bodyData) {
      const sunPos = toScreen(state.c, 0);
      const planetPos = toScreen(state.x, state.y);
      const body = bodyData || CELESTIAL_BODIES[0];

      // Radius vector (Sun -> Body)
      if (showConnectingLine || (showFoci && showStringProperty)) {
        ctx.beginPath();
        ctx.moveTo(sunPos.x, sunPos.y);
        ctx.lineTo(planetPos.x, planetPos.y);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // String property
      if (showFoci && showStringProperty) {
        const f2Pos = toScreen(-state.c, 0);
        ctx.beginPath();
        ctx.moveTo(f2Pos.x, f2Pos.y);
        ctx.lineTo(planetPos.x, planetPos.y);
        ctx.strokeStyle = 'rgba(250, 204, 21, 0.6)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      // Halley's Comet tail
      if (body.isComet) {
        const dx = planetPos.x - sunPos.x;
        const dy = planetPos.y - sunPos.y;
        const sunDist = Math.hypot(dx, dy) || 1;
        const tailDirX = dx / sunDist;
        const tailDirY = dy / sunDist;

        const tailLength = Math.max(16, 75 * Math.pow(Math.max(0.05, 1.0 - (state.r / 15.0)), 1.5));
        const tailGrad = ctx.createLinearGradient(
          planetPos.x, planetPos.y,
          planetPos.x + tailDirX * tailLength, planetPos.y + tailDirY * tailLength
        );
        tailGrad.addColorStop(0, 'rgba(165, 243, 252, 0.85)');
        tailGrad.addColorStop(0.3, 'rgba(56, 189, 248, 0.45)');
        tailGrad.addColorStop(1, 'rgba(56, 189, 248, 0.0)');

        ctx.strokeStyle = tailGrad;
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(planetPos.x, planetPos.y);
        ctx.lineTo(planetPos.x + tailDirX * tailLength, planetPos.y + tailDirY * tailLength);
        ctx.stroke();
      }

      // Velocity tangent vector (scaled 25% longer)
      const vUnitScreenX = state.vx_unit;
      const vUnitScreenY = -state.vy_unit; // Invert y for canvas screen space

      if (showVelocityVector) {
        const vLength = Math.min(97.5, Math.max(33.75, (state.velocity / 29.78) * 67.5));
        const vEndX = planetPos.x + vUnitScreenX * vLength;
        const vEndY = planetPos.y + vUnitScreenY * vLength;

        // Calculate outward normal perpendicular to velocity vector (pointing away from ellipse center)
        const centerPos = toScreen(0, 0);
        const rTipX = vEndX - centerPos.x;
        const rTipY = vEndY - centerPos.y;

        // Candidate normal N1 = (-vUnitScreenY, vUnitScreenX)
        const dotN1 = rTipX * (-vUnitScreenY) + rTipY * vUnitScreenX;
        const sign = dotN1 >= 0 ? 1 : -1;
        const nOutX = -vUnitScreenY * sign;
        const nOutY = vUnitScreenX * sign;

        // Position 'v' label along the outward normal, outside the ellipse and clear of the arrowhead
        const vLabelOffset = {
          x: nOutX * 12 - vUnitScreenX * 4,
          y: nOutY * 12 - vUnitScreenY * 4
        };

        drawVectorArrow(planetPos.x, planetPos.y, vEndX, vEndY, '#38bdf8', 'v', vLabelOffset);
      }

      // Gravity vector & parallel / perpendicular decomposition (scaled 25% longer)
      if (showGravityVector) {
        const dxSun = sunPos.x - planetPos.x;
        const dySun = sunPos.y - planetPos.y;
        const distSun = Math.hypot(dxSun, dySun) || 1;
        const gUnitX = dxSun / distSun;
        const gUnitY = dySun / distSun;

        // Gravitational acceleration magnitude scaled smoothly for screen visibility (25% longer)
        const gLength = Math.min(127.5, Math.max(33.75, 75 / Math.pow(Math.max(0.12, state.r), 0.75)));
        const gVecX = gUnitX * gLength;
        const gVecY = gUnitY * gLength;

        // Parallel component along velocity vector: g_par = (g · v_hat) * v_hat
        const gParDot = gVecX * vUnitScreenX + gVecY * vUnitScreenY;
        const gParVecX = gParDot * vUnitScreenX;
        const gParVecY = gParDot * vUnitScreenY;

        // Perpendicular component: g_perp = g - g_par
        const gPerpVecX = gVecX - gParVecX;
        const gPerpVecY = gVecY - gParVecY;

        const tipTotalX = planetPos.x + gVecX;
        const tipTotalY = planetPos.y + gVecY;
        const tipParX = planetPos.x + gParVecX;
        const tipParY = planetPos.y + gParVecY;
        const tipPerpX = planetPos.x + gPerpVecX;
        const tipPerpY = planetPos.y + gPerpVecY;

        // Dashed orthogonal projection lines completing the decomposition rectangle
        ctx.setLineDash([3, 3]);
        ctx.strokeStyle = 'rgba(203, 213, 225, 0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tipParX, tipParY);
        ctx.lineTo(tipTotalX, tipTotalY);
        ctx.lineTo(tipPerpX, tipPerpY);
        ctx.stroke();
        ctx.setLineDash([]);

        // Dynamic outward label offsets to prevent any overlap with vector shafts or heads:

        // 1. Parallel component g_∥: offset perpendicular to velocity/tangent pointing away from total g
        // gUnitX, gUnitY points toward sun; outward normal perpendicular to v pointing opposite to inward gravity:
        const vPerpX = -vUnitScreenY;
        const vPerpY = vUnitScreenX;
        const dotVPerpWithG = vPerpX * gUnitX + vPerpY * gUnitY;
        // Direction away from the interior of the decomposition box:
        const parNormX = dotVPerpWithG > 0 ? -vPerpX : vPerpX;
        const parNormY = dotVPerpWithG > 0 ? -vPerpY : vPerpY;
        const parLabelOffset = {
          x: parNormX * 13 + vUnitScreenX * (gParDot >= 0 ? 5 : -5),
          y: parNormY * 13 + vUnitScreenY * (gParDot >= 0 ? 5 : -5)
        };

        // 2. Perpendicular component g_⊥: offset along outward velocity tangent, clear of arrow tip
        const perpDirX = gPerpVecX / (Math.hypot(gPerpVecX, gPerpVecY) || 1);
        const perpDirY = gPerpVecY / (Math.hypot(gPerpVecX, gPerpVecY) || 1);
        // Tangent pointing away from the decomposition box interior:
        const perpNormX = dotVPerpWithG > 0 ? -vUnitScreenX : vUnitScreenX;
        const perpNormY = dotVPerpWithG > 0 ? -vUnitScreenY : vUnitScreenY;
        const perpLabelOffset = {
          x: perpDirX * 10 + perpNormX * 12,
          y: perpDirY * 10 + perpNormY * 12
        };

        // 3. Total gravity g: offset beyond the arrow head and slightly to the side away from the component box
        const totalNormX = -gUnitY * (dotVPerpWithG > 0 ? 1 : -1);
        const totalNormY = gUnitX * (dotVPerpWithG > 0 ? 1 : -1);
        const totalLabelOffset = {
          x: gUnitX * 14 + totalNormX * 10,
          y: gUnitY * 14 + totalNormY * 10
        };

        // Parallel component (green): changes orbital speed with subscript ∥
        drawVectorArrow(planetPos.x, planetPos.y, tipParX, tipParY, '#34d399', 'g', parLabelOffset, '∥');

        // Perpendicular component (purple): curves trajectory with subscript ⊥
        drawVectorArrow(planetPos.x, planetPos.y, tipPerpX, tipPerpY, '#c084fc', 'g', perpLabelOffset, '⊥');

        // Total gravity vector (rose/red): directed straight to Sun
        drawVectorArrow(planetPos.x, planetPos.y, tipTotalX, tipTotalY, '#fb7185', 'g', totalLabelOffset);
      }

      // Planet Sphere
      const sphereRadius = body.isComet ? 6.0 : (body.name === 'Jupiter' ? 10.5 : (body.name === 'Saturn' ? 9.5 : 7.5));
      const planetGrad = ctx.createRadialGradient(planetPos.x - 2, planetPos.y - 2, 1, planetPos.x, planetPos.y, sphereRadius + 1);
      planetGrad.addColorStop(0, body.colors.primary);
      planetGrad.addColorStop(0.4, body.colors.mid);
      planetGrad.addColorStop(0.8, body.colors.dark);
      planetGrad.addColorStop(1, '#020617');

      ctx.fillStyle = body.colors.glow;
      ctx.beginPath();
      ctx.arc(planetPos.x, planetPos.y, sphereRadius + 3.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = planetGrad;
      ctx.beginPath();
      ctx.arc(planetPos.x, planetPos.y, sphereRadius, 0, Math.PI * 2);
      ctx.fill();

      // Planet Name Label - anchored continuously on the outward radial vector from the Sun
      // Using fixed center/middle alignment with continuous elliptical clearance eliminates all alignment step-jumps
      const dxFromSun = planetPos.x - sunPos.x;
      const dyFromSun = planetPos.y - sunPos.y;
      const outAngle = Math.atan2(dyFromSun, dxFromSun);
      const cosA = Math.cos(outAngle);
      const sinA = Math.sin(outAngle);

      ctx.save();
      ctx.font = 'bold 13px JetBrains Mono, monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#ffffff';

      // Measure text dimensions to calculate a smooth, continuous clearance margin around the planet sphere
      const textWidth = ctx.measureText(body.name).width;
      const halfW = textWidth / 2 + 5;
      const halfH = 9;
      const textRadialClearance = Math.hypot(halfW * cosA, halfH * sinA);
      const labelDist = sphereRadius + textRadialClearance + 3;

      const labelX = planetPos.x + cosA * labelDist;
      const labelY = planetPos.y + sinA * labelDist;

      ctx.fillText(body.name, labelX, labelY);
      ctx.restore();
    }

    chkFoci.addEventListener('change', (e) => {
      showFoci = e.target.checked;
      if (showFoci) {
        chkStringProperty.disabled = false;
        chkStringProperty.classList.remove('cursor-default');
        chkStringProperty.classList.add('cursor-pointer');
        lblStringProperty.classList.remove('cursor-default', 'opacity-40');
        lblStringProperty.classList.add('cursor-pointer');
      } else {
        chkStringProperty.disabled = true;
        chkStringProperty.checked = false;
        showStringProperty = false;
        chkStringProperty.classList.remove('cursor-pointer');
        chkStringProperty.classList.add('cursor-default');
        lblStringProperty.classList.remove('cursor-pointer');
        lblStringProperty.classList.add('cursor-default', 'opacity-40');
      }
    });

    if (chkConnectingLine) {
      chkConnectingLine.addEventListener('change', (e) => {
        showConnectingLine = e.target.checked;
      });
    }

    chkStringProperty.addEventListener('change', (e) => {
      showStringProperty = e.target.checked;
    });

    chkKeplerSlices.addEventListener('change', (e) => {
      showKeplerSlices = e.target.checked;
    });

    chkVelocityVector.addEventListener('change', (e) => {
      showVelocityVector = e.target.checked;
    });

    chkGravityVector.addEventListener('change', (e) => {
      showGravityVector = e.target.checked;
    });

    function updatePresetHighlights(val) {
      const presets = [
        { btn: btnPresetZero, target: 0.00 },
        { btn: btnPresetLow, target: 0.30 },
        { btn: btnPresetMid, target: 0.60 },
        { btn: btnPresetHigh, target: 0.85 },
        { btn: btnPresetMax, target: 0.98 }
      ];
      presets.forEach(({ btn, target }) => {
        if (Math.abs(val - target) < 0.015) {
          btn.className = 'px-2 py-0.5 bg-indigo-950 hover:bg-indigo-900 border border-indigo-700/60 rounded text-indigo-300 hover:text-white transition';
        } else {
          btn.className = 'px-2 py-0.5 bg-slate-900 hover:bg-slate-800 border border-slate-800 rounded text-slate-400 hover:text-white transition';
        }
      });
    }

    function setCelestialBody(index) {
      currentBodyIndex = Math.max(0, Math.min(CELESTIAL_BODIES.length - 1, index));
      const body = CELESTIAL_BODIES[currentBodyIndex];

      selectBody.value = body.id;
      legendPlanetName.textContent = body.name;
      legendPlanetDot.style.backgroundColor = body.colors.dot;

      if (body.isFixed) {
        sliderEccentricity.disabled = true;
        sliderEccentricity.classList.add('cursor-not-allowed', 'opacity-40');
        sliderEccentricity.value = body.e;
        txtEccentricityVal.textContent = body.e.toFixed(3);

        presetButtons.forEach(btn => {
          btn.disabled = true;
          btn.classList.add('cursor-not-allowed', 'opacity-30');
        });
      } else {
        sliderEccentricity.disabled = false;
        sliderEccentricity.classList.remove('cursor-not-allowed', 'opacity-40');
        userEccentricity = savedCustomEccentricity;
        sliderEccentricity.value = userEccentricity;
        txtEccentricityVal.textContent = userEccentricity.toFixed(2);

        presetButtons.forEach(btn => {
          btn.disabled = false;
          btn.classList.remove('cursor-not-allowed', 'opacity-30');
        });
        updatePresetHighlights(userEccentricity);
      }
    }

    selectBody.addEventListener('change', (e) => {
      const idx = CELESTIAL_BODIES.findIndex(b => b.id === e.target.value);
      if (idx !== -1) setCelestialBody(idx);
    });

    btnPrevBody.addEventListener('click', () => {
      const prevIdx = (currentBodyIndex - 1 + CELESTIAL_BODIES.length) % CELESTIAL_BODIES.length;
      setCelestialBody(prevIdx);
    });

    btnNextBody.addEventListener('click', () => {
      const nextIdx = (currentBodyIndex + 1) % CELESTIAL_BODIES.length;
      setCelestialBody(nextIdx);
    });

    sliderEccentricity.addEventListener('input', (e) => {
      userEccentricity = parseFloat(e.target.value);
      savedCustomEccentricity = userEccentricity;
      txtEccentricityVal.textContent = userEccentricity.toFixed(2);
      updatePresetHighlights(userEccentricity);
    });

    function applyPreset(val) {
      if (CELESTIAL_BODIES[currentBodyIndex].isFixed) return;
      userEccentricity = val;
      savedCustomEccentricity = val;
      sliderEccentricity.value = val;
      txtEccentricityVal.textContent = val.toFixed(2);
      updatePresetHighlights(val);
    }

    btnPresetZero.addEventListener('click', () => applyPreset(0.00));
    btnPresetLow.addEventListener('click', () => applyPreset(0.30));
    btnPresetMid.addEventListener('click', () => applyPreset(0.60));
    btnPresetHigh.addEventListener('click', () => applyPreset(0.85));
    btnPresetMax.addEventListener('click', () => applyPreset(0.98));

    function togglePlay() {
      isRunning = !isRunning;
      if (isRunning) {
        btnPlayPauseText.textContent = 'Pause';
        iconPause.classList.remove('hidden');
        iconPlay.classList.add('hidden');
        iconMobilePause.classList.remove('hidden');
        iconMobilePlay.classList.add('hidden');
        lastTimestamp = performance.now();
      } else {
        btnPlayPauseText.textContent = 'Resume';
        iconPause.classList.add('hidden');
        iconPlay.classList.remove('hidden');
        iconMobilePause.classList.add('hidden');
        iconMobilePlay.classList.remove('hidden');
      }
    }

    btnPlayPause.addEventListener('click', togglePlay);
    btnMobilePlayPause.addEventListener('click', togglePlay);

    btnReset.addEventListener('click', () => {
      simTime = 0.0;
      lastTimestamp = performance.now();
    });

    function render(timestamp) {
      const dt = Math.min((timestamp - lastTimestamp) / 1000, 0.1);
      lastTimestamp = timestamp;

      if (isRunning) {
        simTime += dt;
      }

      const realTimeSec = timestamp / 1000;
      drawStars(realTimeSec);

      updateAlien(dt);
      drawAlienShip();

      const currentBody = CELESTIAL_BODIES[currentBodyIndex];
      const e = currentBody.isFixed ? currentBody.e : userEccentricity;

      const state = calculateOrbitalState(simTime, orbitalPeriod, e, currentBody);

      // Real-time telemetry update
      txtPlanetDist.textContent = state.r.toFixed(2);
      txtPlanetSpeed.textContent = state.velocity.toFixed(1);

      if (showKeplerSlices) {
        drawKeplerSlices(orbitalPeriod, e, simTime);
      }

      drawOrbitPath(e, currentBody);

      if (showFoci) {
        drawFoci(e);
      }

      drawSun(e);
      drawPlanet(state, currentBody, dt);

      requestAnimationFrame(render);
    }

    window.onload = function () {
      initStarfield();
      resizeCanvas();
      setCelestialBody(0);
      lastTimestamp = performance.now();
      requestAnimationFrame(render);
    };
  </script>
</body>
</html>
