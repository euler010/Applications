<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<title>Springs and Conservation of Mechanical Energy</title>
<style>
  :root{
    --bg:#f5f7fb; --panel:#ffffff; --ink:#1d2433; --muted:#2b3140; --line:#d7dce6;
    --ke:#e4572e; --ug:#2e86de; --us:#27ae60; --tot:#8e44ad; --accent:#1d4ed8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:clamp(13px,1.15vw + .35vh,26px)}
  header{padding:.45em 1em .3em;display:flex;align-items:baseline;gap:1em;flex-wrap:wrap}
  header h1{margin:0;font-size:18px;font-weight:700}
  main{flex:1;display:flex;gap:.8em;padding:0 1em;min-height:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.05);position:relative;min-height:0}
  #sceneWrap{flex:1.05}
  #barsWrap{flex:1}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #controls{flex:0 0 clamp(212px,17.5vw,400px);display:flex;flex-direction:column;gap:1.1em;padding:1em .9em;overflow-y:auto}
  #controls section{display:flex;flex-direction:column;gap:.5em}
  #controls h2{margin:0;font-size:.9em;font-weight:700;color:var(--ink)}
  .lbl{font-size:.85em;font-weight:600;margin-top:.2em}
  .row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.35em}
  .row3 button{font-size:.82em;padding-inline:.15em}
  .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.45em}
  #kSl{width:100%;accent-color:var(--accent);height:1.2em;margin:0}
  #kOut{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;font-size:.9em}
  button{font:inherit;font-size:.9em;padding:.45em .3em;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;width:100%;min-width:0;white-space:nowrap}
  button:hover{background:#eef2fb}
  button:disabled{background:#f1f3f7;color:#9aa1ae;cursor:default}
  button:disabled:hover{background:#f1f3f7}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover{background:#1e40af}
  button.primary:disabled{background:#e3e6ec;border-color:#d7dce6;color:#9aa1ae;cursor:default}
  select{font:inherit;font-size:.9em;padding:.4em .5em;border-radius:8px;border:1px solid var(--line);background:#fff;width:100%}
  #stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:.6em;padding:.7em 1em .9em}
  .stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:.55em .8em}
  .sl{font-size:.8em;color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sv{font-size:.9em;font-weight:700;margin-top:.15em;font-variant-numeric:tabular-nums;white-space:nowrap}
  @media (max-width:900px){#stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header>
  <h1>Springs and Conservation of Mechanical Energy</h1>
</header>

<main>
  <div class="card" id="barsWrap"><canvas id="bars"></canvas></div>
  <div class="card" id="sceneWrap"><canvas id="scene"></canvas></div>
  <aside class="card" id="controls">
    <section>
      <h2>Motion</h2>
      <div class="row3">
        <button class="primary" id="playBtn" disabled>Pause</button>
        <button id="stepBtn" disabled title="Advance to the next step (1/40 of a period, plus each equilibrium crossing)">Step</button>
        <button id="defaultBtn">Default</button>
      </div>
      <label class="lbl" for="speed">Speed</label>
      <select id="speed">
        <option value="1">1×</option>
        <option value="0.5">½×</option>
        <option value="0.25" selected>¼×</option>
        <option value="0.1">0.1×</option>
      </select>
    </section>
    <section>
      <h2>Spring constant k</h2>
      <output id="kOut">40 N/m</output>
      <input type="range" id="kSl" min="20" max="200" step="1" value="40">
    </section>
    <section>
      <h2>Origin</h2>
      <div class="row2">
        <button id="oDown" title="Move origin down 0.1 m">▼</button>
        <button id="oUp" title="Move origin up 0.1 m">▲</button>
      </div>
      <button id="oFloor">Floor</button>
      <button id="oEq">Equilibrium</button>
      <button id="oSeq">Spring Equilibrium</button>
    </section>
  </aside>
</main>

<div id="stats">
  <div class="stat"><div class="sl">Mass</div><div class="sv" id="mMass" style="color:#0e7490">1.0 kg</div></div>
  <div class="stat"><div class="sl">Spring Constant</div><div class="sv" id="mK" style="color:#d97706">40 N/m</div></div>
  <div class="stat"><div class="sl">Equilibrium Stretch</div><div class="sv" id="mStretch" style="color:#e11d48"></div></div>
  <div class="stat"><div class="sl">Period</div><div class="sv" id="mT" style="color:#2563eb"></div></div>
  <div class="stat"><div class="sl">Amplitude</div><div class="sv" id="mA" style="color:#7c3aed"></div></div>
  <div class="stat"><div class="sl">Position y</div><div class="sv" id="mY" style="color:#e4572e"></div></div>
  <div class="stat"><div class="sl">Velocity</div><div class="sv" id="mV" style="color:#059669"></div></div>
</div>

<script>
(() => {
  // ---------- Physics constants & state (SI units) ----------
  const g = 9.8;
  const H = 3.0;        // ceiling height above floor (m)
  const L0 = 1.10;      // natural (unstretched) length of spring (m)
  const BH = 0.30;      // block height (m)
  const BW = 0.30;      // block width (m)
  const VIEW_TOP = 3.25, VIEW_BOT = -0.25; // visible heights (m)

  const m = 1.0;   // mass fixed at 1 kg
  let k = 40;
  let y0 = 0;           // height of origin above floor (m)
  let A = 0;            // amplitude (signed; + = released above equilibrium)
  let t = 0;
  let running = false;
  let speed = 0.25;

  const PT2 = 8 / 3; // 2 pt expressed in CSS px
  const fmt = (x, d) => (Math.abs(x) < 0.5 * 10 ** -d ? 0 : x).toFixed(d);   // avoids "-0.00"
  const omega = () => Math.sqrt(k / m);
  const yEq = () => H - L0 - m * g / k - BH / 2;          // equilibrium height of block's center
  const yNow = () => yEq() + A * Math.cos(omega() * t);
  const vNow = () => -A * omega() * Math.sin(omega() * t);
  const stretch = y => (H - L0 - BH / 2) - y;              // + stretched, − compressed

  function maxAmp() {
    const down = yEq() - BH / 2 - 0.03;                    // keep block off the floor
    const up = (H - 0.12 - BH / 2) - yEq();                // keep spring from fully collapsing
    return Math.max(0, Math.min(down, up));
  }

  function energies(y, v) {
    const KE = 0.5 * m * v * v;
    const Ug = m * g * (y - y0);
    const s = stretch(y);
    const Us = 0.5 * k * s * s;
    return { KE, Ug, Us, E: KE + Ug + Us };
  }

  // ---------- DOM ----------
  const scene = document.getElementById('scene');
  const bars = document.getElementById('bars');
  const sctx = scene.getContext('2d');
  const bctx = bars.getContext('2d');
  const $ = id => document.getElementById(id);
  const kSl = $('kSl'), playBtn = $('playBtn');

  let SW = 0, SH = 0, BWpx = 0, BHpx = 0;
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    for (const [c, ctx] of [[scene, sctx], [bars, bctx]]) {
      const r = c.getBoundingClientRect();
      c.width = Math.round(r.width * dpr);
      c.height = Math.round(r.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    const rs = scene.getBoundingClientRect(), rb = bars.getBoundingClientRect();
    SW = rs.width; SH = rs.height; BWpx = rb.width; BHpx = rb.height;
  }

  // ---------- Scene geometry ----------
  const pad = () => Math.max(14, SH * 0.03);
  const pxPerM = () => (SH - 2 * pad()) / (VIEW_TOP - VIEW_BOT);
  const hToPx = h => pad() + (VIEW_TOP - h) * pxPerM();
  const pxToH = py => VIEW_TOP - (py - pad()) / pxPerM();
  const axisX = () => Math.max(70, SW * 0.13);
  const blockX = () => axisX() + (SW - axisX()) * 0.52;
  const fs = () => Math.max(12, Math.min(SH, SW * 1.3) / 38);

  function hatchBar(ctx, x1, x2, yLine, dir) {
    // dir = -1 hatch above the line (ceiling), +1 below (floor)
    const depth = Math.max(10, SH * 0.025);
    ctx.save();
    ctx.fillStyle = '#e9ecf2';
    ctx.fillRect(x1, dir < 0 ? yLine - depth : yLine, x2 - x1, depth);
    ctx.beginPath();
    ctx.rect(x1, dir < 0 ? yLine - depth : yLine, x2 - x1, depth);
    ctx.clip();
    ctx.strokeStyle = '#8a93a6'; ctx.lineWidth = 1.2;
    for (let x = x1 - depth; x < x2 + depth; x += 9) {
      ctx.beginPath();
      ctx.moveTo(x, dir < 0 ? yLine : yLine + depth);
      ctx.lineTo(x + depth, dir < 0 ? yLine - depth : yLine);
      ctx.stroke();
    }
    ctx.restore();
    ctx.strokeStyle = '#3b4252'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(x1, yLine); ctx.lineTo(x2, yLine); ctx.stroke();
  }

  function drawSpring(ctx, x, yTopPx, yBotPx, widthPx) {
    const lead = Math.min(12, (yBotPx - yTopPx) * 0.12);
    const coils = 14;
    const y1 = yTopPx + lead, y2 = yBotPx - lead;
    ctx.strokeStyle = '#4a5568'; ctx.lineWidth = Math.max(2, SH / 280); ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(x, yTopPx); ctx.lineTo(x, y1);
    const n = coils * 2;
    for (let i = 1; i < n; i++) {
      const yy = y1 + (y2 - y1) * i / n;
      ctx.lineTo(x + (i % 2 ? widthPx / 2 : -widthPx / 2), yy);
    }
    ctx.lineTo(x, y2); ctx.lineTo(x, yBotPx);
    ctx.stroke();
  }

  function drawScene() {
    const ctx = sctx, F = fs();
    ctx.clearRect(0, 0, SW, SH);
    const ax = axisX(), bx = blockX();
    const yb = yNow();
    const sceneL = ax + 30, sceneR = SW - 14;

    // Origin reference line across the scene
    const oPx = hToPx(y0);
    ctx.save();
    ctx.setLineDash([6, 6]); ctx.strokeStyle = 'rgba(29,78,216,.35)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, oPx); ctx.lineTo(sceneR, oPx); ctx.stroke();
    ctx.restore();

    // Equilibrium position marker
    const eqPx = hToPx(yEq());
    ctx.save();
    ctx.setLineDash([3, 5]); ctx.strokeStyle = '#a0a7b5'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(bx - BW * pxPerM() * 0.9, eqPx); ctx.lineTo(bx + BW * pxPerM() * 0.9, eqPx); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#3b4252'; ctx.font = `${F * 0.75 + PT2}px Inter,sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText('equilibrium', bx + BW * pxPerM() * 0.95, eqPx);

    // Spring equilibrium: where the block's center sits when the spring is unstretched
    const seqPx = hToPx(H - L0 - BH / 2);
    ctx.save();
    ctx.setLineDash([3, 5]); ctx.strokeStyle = '#a0a7b5'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(bx - BW * pxPerM() * 0.9, seqPx); ctx.lineTo(bx + BW * pxPerM() * 0.9, seqPx); ctx.stroke();
    ctx.restore();
    // keep the two labels from overlapping when the lines are close together
    const gap = F * 0.9, labelY = Math.min(seqPx, eqPx - gap);
    ctx.fillStyle = '#3b4252';
    ctx.fillText('spring equilibrium', bx + BW * pxPerM() * 0.95, labelY);

    // Ceiling and floor
    hatchBar(ctx, sceneL, sceneR, hToPx(H), -1);
    hatchBar(ctx, sceneL, sceneR, hToPx(0), +1);

    // Spring
    const blockTopPx = hToPx(yb + BH / 2);
    drawSpring(ctx, bx, hToPx(H), blockTopPx, BW * pxPerM() * 0.45);

    // Block
    const bwPx = BW * pxPerM(), bhPx = BH * pxPerM();
    const grad = ctx.createLinearGradient(0, blockTopPx, 0, blockTopPx + bhPx);
    grad.addColorStop(0, '#ffe45c'); grad.addColorStop(1, '#f2c200');
    ctx.fillStyle = grad; ctx.strokeStyle = '#8a6d00'; ctx.lineWidth = 2;
    roundRect(ctx, bx - bwPx / 2, blockTopPx, bwPx, bhPx, 5); ctx.fill(); ctx.stroke();

    // Position marker: block center to axis
    const ybPx = hToPx(yb);
    ctx.save();
    ctx.setLineDash([4, 4]); ctx.strokeStyle = '#e4572e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(ax, ybPx); ctx.lineTo(bx - bwPx / 2 - 4, ybPx); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = '#e4572e';
    ctx.beginPath(); ctx.arc(bx - bwPx / 2 - 4, ybPx, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.font = `600 ${F * 0.85 + PT2}px Inter,sans-serif`; ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
    ctx.fillText(`y = ${fmt(yb - y0, 2)} m`, ax + 14, ybPx - 3);

    drawAxis();
  }

  function drawAxis() {
    const ctx = sctx, F = fs(), ax = axisX();
    const top = 6, bot = SH - 6, ah = Math.max(10, F * 0.8);
    ctx.strokeStyle = '#1d2433'; ctx.fillStyle = '#1d2433'; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(ax, top + ah); ctx.lineTo(ax, bot - ah); ctx.stroke();
    // arrows
    ctx.beginPath(); ctx.moveTo(ax, top); ctx.lineTo(ax - ah * 0.6, top + ah * 1.1); ctx.lineTo(ax + ah * 0.6, top + ah * 1.1); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(ax, bot); ctx.lineTo(ax - ah * 0.6, bot - ah * 1.1); ctx.lineTo(ax + ah * 0.6, bot - ah * 1.1); ctx.closePath(); ctx.fill();
    // + and −
    ctx.font = `700 ${F * 1.4 + PT2}px Inter,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('+', ax + F * 1.1, top + ah * 0.8);
    ctx.fillText('−', ax + F * 1.1, bot - ah * 0.8);

    // ticks relative to origin
    const step = 0.1;
    const nMin = Math.ceil((VIEW_BOT + 0.06 - y0) / step - 1e-9);
    const nMax = Math.floor((VIEW_TOP - 0.06 - y0) / step + 1e-9);
    ctx.font = `${F * 0.78 + PT2}px Inter,sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 1.4;
    for (let n = nMin; n <= nMax; n++) {
      const h = y0 + n * step, py = hToPx(h);
      if (py < top + ah * 2.2 || py > bot - ah * 2.2) continue;
      const major = n % 5 === 0;
      const len = major ? 10 : 5;
      ctx.beginPath(); ctx.moveTo(ax - len, py); ctx.lineTo(ax + len, py); ctx.stroke();
      if (major && n !== 0) ctx.fillText((n * step).toFixed(1), ax - 14, py);
    }
    ctx.textAlign = 'left'; ctx.font = `italic ${F * 0.85 + PT2}px Inter,sans-serif`;
    ctx.fillText('y (m)', ax + F * 2.1, top + ah * 0.8);

    // origin handle
    const oPx = hToPx(y0);
    ctx.fillStyle = '#1d4ed8'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(ax, oPx, Math.max(7, F * 0.5), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.font = `700 ${F + PT2}px Inter,sans-serif`; ctx.textAlign = 'right';
    ctx.fillText('0', ax - 14, oPx);
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  // ---------- Bar graphs ----------
  function niceStep(range) {
    const raw = range / 6, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    return (f < 1.5 ? 1 : f < 3.5 ? 2 : f < 7.5 ? 5 : 10) * p;
  }

  function energyRange() {
    // Scale for the LARGEST allowed amplitude, so pulling the block never rescales the axis;
    // only the origin (and k, which changes the maximum amplitude) changes the scale
    const a = maxAmp(), ye = yEq();
    const ends = [energies(ye + a, 0), energies(ye - a, 0)];
    const mid = energies(ye, a * omega());
    let lo = 0, hi = 0;
    for (const e of [...ends, mid]) {
      lo = Math.min(lo, e.KE, e.Ug, e.Us, e.E);
      hi = Math.max(hi, e.KE, e.Ug, e.Us, e.E);
    }
    if (hi - lo < 0.5) hi = lo + 0.5;
    const st = niceStep(hi - lo);
    return { lo: lo < -1e-9 ? Math.floor(lo / st - 0.15) * st : 0, hi: Math.ceil(hi / st + 0.15) * st, st };
  }

  let rangeCache = null;
  function drawBars() {
    const ctx = bctx, W = BWpx, Hh = BHpx;
    ctx.clearRect(0, 0, W, Hh);
    const F = Math.max(12, Math.min(Hh, W * 1.2) / 34);
    const e = energies(yNow(), vNow());
    if (!rangeCache) rangeCache = energyRange();
    const { lo, hi, st } = rangeCache;

    const L = F * 4.2, R = W - F * 1.2, T = F * 2.6, B = Hh - F * 3.0;
    const vy = val => B - (val - lo) / (hi - lo) * (B - T);

    // title
    ctx.fillStyle = '#1d2433'; ctx.font = `700 ${F * 1.1}px Inter,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    ctx.fillText('Energy (J)', (L + R) / 2, F * 0.6);

    // gridlines
    ctx.font = `${F * 0.8 + PT2}px Inter,sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    for (let v = lo; v <= hi + 1e-9; v += st) {
      const py = vy(v);
      ctx.strokeStyle = Math.abs(v) < 1e-9 ? '#1d2433' : '#e3e7ee';
      ctx.lineWidth = Math.abs(v) < 1e-9 ? 2 : 1;
      ctx.beginPath(); ctx.moveTo(L, py); ctx.lineTo(R, py); ctx.stroke();
      ctx.fillStyle = '#2b3140';
      ctx.fillText(formatTick(v, st), L - 8, py);
    }

    const items = [
      { key: 'KE', val: e.KE, col: getVar('--ke'), main: 'KE', sub: '' },
      { key: 'Ug', val: e.Ug, col: getVar('--ug'), main: 'U', sub: 'g' },
      { key: 'Us', val: e.Us, col: getVar('--us'), main: 'U', sub: 's' },
    ];
    items.push({ key: 'E', val: e.E, col: getVar('--tot'), main: 'ΣE', sub: '' });

    const n = items.length, slot = (R - L) / n, bw = slot * 0.55;
    const zero = vy(0);
    items.forEach((it, i) => {
      const cx = L + slot * (i + 0.5);
      const py = vy(it.val);
      ctx.fillStyle = it.col;
      const yTop = Math.min(py, zero), h = Math.abs(zero - py);
      ctx.fillRect(cx - bw / 2, yTop, bw, Math.max(h, 0.5));
      // value
      ctx.fillStyle = '#1d2433'; ctx.font = `600 ${F * 0.85 + PT2}px Inter,sans-serif`; ctx.textAlign = 'center';
      ctx.textBaseline = it.val >= 0 ? 'bottom' : 'top';
      ctx.fillText(`${fmt(it.val, 1)} J`, cx, it.val >= 0 ? yTop - 4 : yTop + h + 4);
      // label with subscript
      drawSubLabel(ctx, it.main, it.sub, cx, B + F * 1.0, F * 1.25, it.col);
    });

  }

  function formatTick(v, st) {
    const d = st >= 1 ? 0 : st >= 0.1 ? 1 : 2;
    return (Math.abs(v) < 1e-9 ? 0 : v).toFixed(d);
  }

  function drawSubLabel(ctx, main, sub, cx, y, size, col) {
    ctx.textBaseline = 'top';
    ctx.font = `700 ${size}px Inter,sans-serif`;
    const w1 = ctx.measureText(main).width;
    ctx.font = `700 ${size * 0.62}px Inter,sans-serif`;
    const w2 = sub ? ctx.measureText(sub).width + 2 : 0;
    const x0 = cx - (w1 + w2) / 2;
    ctx.fillStyle = col; ctx.textAlign = 'left';
    ctx.font = `700 ${size}px Inter,sans-serif`; ctx.fillText(main, x0, y);
    if (sub) { ctx.font = `700 ${size * 0.62}px Inter,sans-serif`; ctx.fillText(sub, x0 + w1 + 2, y + size * 0.55); }
  }

  const cssVars = getComputedStyle(document.documentElement);
  const getVar = n => cssVars.getPropertyValue(n).trim();

  // ---------- UI ----------
  function updateReadout() {
    $('mK').textContent = `${k} N/m`;
    $('mStretch').textContent = `${(m * g / k).toFixed(3)} m`;
    $('mT').textContent = `${(2 * Math.PI / omega()).toFixed(2)} s`;
    $('mA').textContent = `${Math.abs(A).toFixed(2)} m`;
  }
  function updateLive() {   // values that change every frame
    $('mY').textContent = `${fmt(yNow() - y0, 2)} m`;
    const v = vNow();
    $('mV').textContent = `${fmt(v, 2)} m/s`;
  }
  function invalidate() { rangeCache = null; updateReadout(); }

  function setRunning(r) {
    running = r;
    // moving → blue "Pause"; paused mid-motion → blue "Play"; at rest or being dragged → grey "Pause"
    const pausedMid = !r && A !== 0 && !drag;
    playBtn.textContent = pausedMid ? 'Play' : 'Pause';
    playBtn.disabled = !(r || pausedMid);
    $('stepBtn').disabled = A === 0 || !!drag;   // stepping needs motion to step through
  }

  function resetMotion() { A = 0; t = 0; setRunning(false); invalidate(); }

  kSl.addEventListener('input', () => {
    k = parseFloat(kSl.value); $('kOut').textContent = `${k} N/m`; resetMotion();
  });
  playBtn.addEventListener('click', () => setRunning(!running));
  // Step: pause (if needed) and advance to the next stop. Stops are every 1/40 of a period,
  // plus the exact moments the block passes equilibrium and spring equilibrium, so a step
  // can land right on either line.
  function stepStops() {
    const TAU = 2 * Math.PI, stops = [];
    for (let i = 0; i < 40; i++) stops.push(i * TAU / 40);      // includes turning points & equilibrium (0, ¼, ½, ¾ cycle)
    const events = [];
    const c = (m * g / k) / A;                                  // cos(phase) where y = spring equilibrium
    if (Math.abs(c) <= 1) { const th = Math.acos(c); events.push(th, TAU - th); }
    // drop grid stops that sit almost on top of an event, then merge
    const merged = stops.filter(p => events.every(e => Math.abs(p - e) > 0.03 && Math.abs(p - e) < TAU - 0.03)).concat(events);
    return merged.sort((a, b) => a - b);
  }
  $('stepBtn').addEventListener('click', () => {
    if (A === 0) return;
    const TAU = 2 * Math.PI, w = omega();
    const phase = w * t, cycle = Math.floor(phase / TAU + 1e-9), within = phase - cycle * TAU;
    const next = stepStops().find(p => p > within + 1e-6);
    t = (next === undefined ? (cycle + 1) * TAU : cycle * TAU + next) / w;
    setRunning(false);
  });
  // Default: restore every setting to how the app first loads
  $('defaultBtn').addEventListener('click', () => {
    k = 40; y0 = 0; speed = 0.25;
    kSl.value = '40';
    $('kOut').textContent = '40 N/m';
    $('speed').value = '0.25';
    resetMotion();
  });
  $('speed').addEventListener('change', e => speed = parseFloat(e.target.value));

  const setOrigin = h => {
    y0 = Math.max(VIEW_BOT + 0.1, Math.min(VIEW_TOP - 0.1, Math.round(h * 20) / 20));
    invalidate();
  };
  $('oUp').addEventListener('click', () => setOrigin(y0 + 0.1));
  $('oDown').addEventListener('click', () => setOrigin(y0 - 0.1));
  $('oFloor').addEventListener('click', () => setOrigin(0));
  $('oEq').addEventListener('click', () => { y0 = yEq(); invalidate(); });
  $('oSeq').addEventListener('click', () => { y0 = H - L0 - BH / 2; invalidate(); });   // block center when spring is unstretched

  // dragging
  let drag = null;
  function pos(ev) { const r = scene.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  scene.addEventListener('pointerdown', ev => {
    const p = pos(ev), ax = axisX(), bx = blockX();
    const bwPx = BW * pxPerM(), yb = yNow();
    const top = hToPx(yb + BH / 2), bottom = hToPx(yb - BH / 2);
    if (Math.abs(p.x - ax) < 28) {
      drag = 'origin'; setOrigin(pxToH(p.y));
    } else if (p.x > bx - bwPx / 2 - 10 && p.x < bx + bwPx / 2 + 10 && p.y > top - 10 && p.y < bottom + 10) {
      drag = { type: 'block', off: pxToH(p.y) - yb };
      A = yb - yEq(); if (Math.abs(A) < 0.005) A = 0;
      t = 0; setRunning(false); invalidate();
    } else return;
    scene.setPointerCapture(ev.pointerId);
  });
  scene.addEventListener('pointermove', ev => {
    const p = pos(ev);
    if (!drag) {
      const ax = axisX(), bx = blockX(), bwPx = BW * pxPerM(), yb = yNow();
      const overBlock = p.x > bx - bwPx / 2 && p.x < bx + bwPx / 2 && p.y > hToPx(yb + BH / 2) && p.y < hToPx(yb - BH / 2);
      scene.style.cursor = (Math.abs(p.x - ax) < 28 || overBlock) ? 'grab' : 'default';
      return;
    }
    scene.style.cursor = 'grabbing';
    if (drag === 'origin') setOrigin(pxToH(p.y));
    else {
      const ma = maxAmp();
      A = Math.max(-ma, Math.min(ma, pxToH(p.y) - drag.off - yEq()));
      if (Math.abs(A) < 0.005) A = 0;
      t = 0; invalidate();
    }
  });
  // Letting go of the block releases it: it oscillates in SHM about equilibrium
  const endDrag = () => {
    const wasBlock = drag && drag.type === 'block';
    drag = null; scene.style.cursor = 'default';
    if (wasBlock) { t = 0; setRunning(A !== 0); }   // moving the origin leaves the motion alone
  };
  scene.addEventListener('pointerup', endDrag);
  scene.addEventListener('pointercancel', endDrag);

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running) t += dt * speed;
    drawScene(); drawBars(); updateLive();
    requestAnimationFrame(frame);
  }

  const panelObserver = new ResizeObserver(() => resize());
  panelObserver.observe($('sceneWrap')); panelObserver.observe($('barsWrap'));
  resize(); updateReadout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
