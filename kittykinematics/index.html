<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kitty Kinematics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lab bench. Controls column beside a wide stage, three motion graphs in a row beneath. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#17202b; --muted:#5a6575; --line:#d8dde5; --grid:#e8ebf0; --axis:#3d4654;
  --x:#2861a6; --v:#cc2b2b; --a:#2b8653; --accent:#17202b; --accent-ink:#ffffff;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Public Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151b; --surface:#1a2029; --ink:#e6ebf1; --muted:#97a2b2; --line:#2c3440; --grid:#232a34; --axis:#bcc5d1;
  --x:#73aaf0; --v:#f26d6d; --a:#5fc78d; --accent:#e6ebf1; --accent-ink:#11151b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151b; --surface:#1a2029; --ink:#e6ebf1; --muted:#97a2b2; --line:#2c3440; --grid:#232a34; --axis:#bcc5d1;
  --x:#73aaf0; --v:#f26d6d; --a:#5fc78d; --accent:#e6ebf1; --accent-ink:#11151b; color-scheme:dark}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:22px}
header{display:grid;gap:6px}
h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(21px,3.5vw,32px);line-height:1.05;letter-spacing:-.01em;text-wrap:balance}
.lab{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:grid;gap:16px;min-width:0}
.ctl{display:grid;gap:6px}
.ctl-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ctl label{font-weight:600;font-size:14px}
.ctl label i{font-family:var(--mono);font-style:normal;font-weight:500}
.ctl output{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:14px}
.ctl .unit{color:var(--muted);font-size:12px}
.srow{display:flex;align-items:center;gap:8px}
.srow input{flex:1;min-width:0}
.step{width:30px;height:30px;padding:0;display:grid;place-items:center;font-family:var(--mono);font-size:16px;line-height:1;flex:none;border-radius:8px}
input[type=range]{width:100%;accent-color:var(--c,var(--ink));height:22px}
.ctl[data-k=x0]{--c:var(--x)} .ctl[data-k=v0]{--c:var(--v)} .ctl[data-k=a]{--c:var(--a)}
.sub{margin:0;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:500}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible{outline:2px solid var(--x);outline-offset:2px}
.stagecol,.leftcol{display:grid;gap:12px;min-width:0}
.stage{background:#ffffff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stage svg{display:block;width:100%;height:auto}
.transport{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.play{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:9px 20px;font-weight:600;min-width:104px}
.play:hover{border-color:var(--accent);opacity:.9}
.transport>button,.transport>.play{box-sizing:border-box;height:30px;padding-top:0;padding-bottom:0;line-height:1}
.transport .seg{box-sizing:border-box;height:30px}
.transport .seg button{height:28px;padding-top:0;padding-bottom:0;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 11px;font-family:var(--mono);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.check{display:inline-flex;gap:9px;align-items:center;font-size:13px;color:var(--muted);margin-left:6px;cursor:pointer;user-select:none}
.check input{appearance:none;-webkit-appearance:none;margin:0;width:38px;height:22px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .18s;flex:none}
.check input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .18s}
.check input:checked{background:var(--ink)}
.check input:checked::after{transform:translateX(16px)}
@media (prefers-reduced-motion:reduce){.check input,.check input::after{transition:none}}
.readouts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;gap:2px;min-width:0}
.ro span{font-size:12px;color:var(--muted)}
.ro strong{font-family:var(--mono);font-weight:500;font-size:clamp(17px,2.2vw,22px);font-variant-numeric:tabular-nums;white-space:nowrap}
.ro em{font-style:normal;font-size:12px;color:var(--muted);margin-left:3px}
.ro.x strong{color:var(--x)} .ro.v strong{color:var(--v)} .ro.a strong{color:var(--a)}
.status{margin:0;min-height:1.55em;color:var(--muted);font-size:14px}
.graphs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
figure{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 8px;display:grid;gap:6px;min-width:0}
figcaption{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:14px}
figcaption small{font-family:var(--mono);font-weight:400;font-size:12px;color:var(--muted)}
figcaption .sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:7px;vertical-align:1px}
canvas{display:block;width:100%;height:190px}
@media (max-width:900px){.lab{grid-template-columns:1fr}.leftcol{order:2}}
@media (max-width:640px){.graphs{grid-template-columns:1fr}}
@media (max-width:520px){.readouts{grid-template-columns:repeat(2,minmax(0,1fr))}.check{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Kitty Kinematics</h1>
  </header>

  <section class="lab">
    <div class="leftcol">
      <div class="panel">
      <div class="ctl" data-k="x0">
        <div class="ctl-top"><label for="x0">Initial position <i>x₀</i></label><span><output id="x0o">−9.0</output> <span class="unit">m</span></span></div>
        <div class="srow"><button type="button" class="step" data-t="x0" data-d="-1" aria-label="Decrease initial position">−</button><input type="range" id="x0" min="-9" max="9" step="0.5" value="-9"><button type="button" class="step" data-t="x0" data-d="1" aria-label="Increase initial position">+</button></div>
      </div>
      <div class="ctl" data-k="v0">

        <div class="srow"><button type="button" class="step" data-t="v0" data-d="-1" aria-label="Decrease initial velocity">−</button><input type="range" id="v0" min="-5" max="5" step="0.1" value="0"><button type="button" class="step" data-t="v0" data-d="1" aria-label="Increase initial velocity">+</button></div>
      </div>

      </div>
      <div class="ctl">
        <p class="sub">Try a scenario</p>
        <div class="presets">
          <button type="button" data-p="-9,0,0.6">Speeding up</button>
          <button type="button" data-p="-2,4,-1">Turnaround</button>
          <button type="button" data-p="-8,1.5,0">Steady walk</button>

    </div>

    <div class="stagecol">

        <div class="seg" role="group" aria-label="Playback speed">
          <button type="button" data-s="0.5" aria-pressed="false">0.5×</button>
          <button type="button" data-s="1" aria-pressed="true">1×</button>
          <button type="button" data-s="2" aria-pressed="false">2×</button>
        </div>
        <label class="check"><input type="checkbox" role="switch" id="pred" checked> Show predicted curves</label>
      </div>
      <div class="stage">
        <svg viewBox="0 0 1000 205" role="img" aria-labelledby="stageT">
          <title id="stageT">Your cat on a number line from −10 to 10 meters</title>
          <g id="axis"></g>

            <path id="vHead" fill="#cc2b2b"/>

          <g id="cat"><g id="pitch">
            <g id="tw"><g id="tail"><path d="M82 96 C44 88 36 30 58 18 C70 12 76 26 66 30" stroke="#121214" stroke-width="9" fill="none" stroke-linecap="round"/></g></g>
            <g id="backL"><g id="w0"><g id="h0"><g id="l0"><g id="k0"><path d="M84 138 L84 182 L94 182 L97 138 Z" fill="#0c0c0e"/></g><path d="M78 112 C78 124 81 136 84 148 L95 148 C99 136 104 126 108 118 Z" fill="#0c0c0e"/><circle cx="94" cy="112" r="16" fill="#0c0c0e"/><circle cx="90" cy="144" r="5.5" fill="#0c0c0e"/></g></g></g><g id="w2"><g id="l2"><g id="k2"><path d="M167.5 146 L168 182 L178 182 L178.5 146 Z" fill="#08080a"/></g><path d="M161 110 C161 126 164 140 167.5 151 L178.5 151 C182 140 186 126 186 110 Z" fill="#08080a"/><circle cx="173" cy="148" r="6" fill="#08080a"/></g></g></g>
            <g id="bw"><ellipse cx="135" cy="112" rx="58" ry="24" fill="#121214"/>
            <path d="M78 110 C78 94 92 84 110 84 C130 84 150 89 162 96 L152 112 L94 116 Z" fill="#121214"/>
            <path d="M146 92 C164 90 176 86 186 82 L206 94 C206 110 202 124 195 133 C187 140 168 140 154 133 Z" fill="#121214"/>
            <path d="M94 92 Q138 82 176 94 Q140 94 98 98 Z" fill="#2a2a31" opacity="0.55"/>
            <path d="M110 92 Q140 86 164 95 Q140 94 114 96 Z" fill="#34343c" opacity="0.5"/></g>
            <g id="frontL"><g id="w1"><g id="h1"><g id="l1"><g id="k1"><path d="M110 140 L114 182 L124 182 L122 140 Z" fill="#121214"/></g><path d="M102 114 C102 126 106 138 110 150 L120 150 C124 138 130 126 132 116 Z" fill="#121214"/><circle cx="117" cy="114" r="15" fill="#121214"/><circle cx="116" cy="146" r="5.5" fill="#121214"/></g></g></g><g id="w3"><g id="l3"><g id="k3"><path d="M187 146 L190 182 L200 182 L197.5 146 Z" fill="#121214"/></g><path d="M180 112 C180 127 183 140 186.5 151 L198.5 151 C202 140 204 126 203 112 Z" fill="#121214"/><circle cx="192.5" cy="148" r="6" fill="#121214"/></g></g></g>
            <g id="hw"><g id="head">
              <polygon points="183,68 188,30 206,56" fill="#121214"/>
              <polygon points="212,56 232,32 230,70" fill="#121214"/>
              <polygon points="189,62 191,40 201,56" fill="#8a5a50"/>
              <polygon points="216,56 228,42 227,64" fill="#8a5a50"/>
              <path d="M182 86 C178 78 178 68 184 62 C190 56 198 53 208 53 C218 53 228 58 231 66 C234 74 230 86 214 100 L198 98 C192 96 186 92 182 86 Z" fill="#121214"/>
              <path d="M198 58 Q207 55 216 58 Q207 59 198 60 Z" fill="#2a2a31" opacity="0.6"/>
              <g id="eyes">
                <ellipse cx="198" cy="74" rx="7" ry="7.5" fill="#cfd43c"/><ellipse cx="219" cy="74" rx="7" ry="7.5" fill="#cfd43c"/>
                <ellipse cx="198" cy="74" rx="7" ry="7.5" fill="none" stroke="#8f9420" stroke-width="1"/><ellipse cx="219" cy="74" rx="7" ry="7.5" fill="none" stroke="#8f9420" stroke-width="1"/>
                <ellipse cx="198" cy="74" rx="2" ry="6" fill="#0a0a0a"/><ellipse cx="219" cy="74" rx="2" ry="6" fill="#0a0a0a"/>
                <circle cx="200" cy="71" r="1.5" fill="#fff"/><circle cx="221" cy="71" r="1.5" fill="#fff"/>
              </g>
              <path d="M205 86 L213 86 L209 90 Z" fill="#45454c"/>
              <g stroke="#9a9aa2" stroke-width="0.7" opacity="0.9" fill="none"><path d="M216 90 Q236 84 258 86"/><path d="M216 92 Q238 92 260 98"/><path d="M216 94 Q234 98 252 108"/><path d="M200 90 Q180 84 160 86"/><path d="M200 92 Q178 94 158 100"/></g>
            </g></g>
            <g id="fhw" opacity="0"><g id="fHead">
              <polygon points="126,66 124,26 147,52" fill="#121214"/><polygon points="174,66 176,26 153,52" fill="#121214"/>
              <polygon points="130,60 129,36 142,52" fill="#8a5a50"/><polygon points="170,60 171,36 158,52" fill="#8a5a50"/>
              <path d="M126 82 C122 70 126 58 136 54 C144 50 156 50 164 54 C174 58 178 70 174 82 C170 94 160 104 150 104 C140 104 130 94 126 82 Z" fill="#121214"/>
              <path d="M140 57 Q150 53 160 57 Q150 59 140 59 Z" fill="#2a2a31" opacity="0.6"/>
              <ellipse cx="139" cy="76" rx="7" ry="7.5" fill="#cfd43c"/><ellipse cx="161" cy="76" rx="7" ry="7.5" fill="#cfd43c"/>
              <ellipse cx="139" cy="76" rx="7" ry="7.5" fill="none" stroke="#8f9420" stroke-width="1"/><ellipse cx="161" cy="76" rx="7" ry="7.5" fill="none" stroke="#8f9420" stroke-width="1"/>
              <ellipse cx="139" cy="76" rx="2" ry="6" fill="#0a0a0a"/><ellipse cx="161" cy="76" rx="2" ry="6" fill="#0a0a0a"/>
              <circle cx="141" cy="73" r="1.5" fill="#fff"/><circle cx="163" cy="73" r="1.5" fill="#fff"/>
              <path d="M146 88 L154 88 L150 92 Z" fill="#45454c"/>
              <g stroke="#9a9aa2" stroke-width="0.7" opacity="0.9" fill="none"><path d="M156 91 Q176 86 196 88"/><path d="M156 93 Q178 94 198 100"/><path d="M144 91 Q124 86 104 88"/><path d="M144 93 Q122 94 102 100"/></g>
            </g></g>
          </g></g>
        <g id="catS" style="display:none">
            <g id="zbody"><ellipse cx="96" cy="140" rx="66" ry="36" fill="#121214"/><circle cx="66" cy="128" r="32" fill="#121214"/><path d="M54 112 Q86 96 128 110" stroke="#2c2c33" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.8"/></g>
            <ellipse cx="146" cy="160" rx="13" ry="6" fill="#121214"/>
            <g id="zhead"><polygon points="124,124 126,94 142,116" fill="#121214"/><polygon points="148,114 166,92 164,124" fill="#121214"/><polygon points="128,118 129,102 138,114" fill="#8a5a50"/><polygon points="151,113 161,100 160,119" fill="#8a5a50"/>
              <path d="M120 140 C118 126 128 114 142 114 C158 114 168 126 166 140 C164 152 154 158 142 158 C130 158 122 152 120 140 Z" fill="#121214"/>
              <path d="M130 138 Q135 142 140 138" stroke="#6b6b74" stroke-width="1.6" fill="none" stroke-linecap="round"/><path d="M147 137 Q152 141 157 137" stroke="#6b6b74" stroke-width="1.6" fill="none" stroke-linecap="round"/>
              <path d="M141 146 L147 146 L144 149 Z" fill="#45454c"/>

          </g>
        </svg>
      </div>

      <div class="graphs">
        <figure><figcaption><span><span class="sw" style="background:var(--x)"></span>Position vs. time</span><small>x (m)</small></figcaption><canvas id="gx" aria-label="Position versus time graph"></canvas></figure>
        <figure><figcaption><span><span class="sw" style="background:var(--v)"></span>Velocity vs. time</span><small>v (m/s)</small></figcaption><canvas id="gv" aria-label="Velocity versus time graph"></canvas></figure>
        <figure><figcaption><span><span class="sw" style="background:var(--a)"></span>Acceleration vs. time</span><small>a (m/s²)</small></figcaption><canvas id="ga" aria-label="Acceleration versus time graph"></canvas></figure>
      </div>

      <div class="readouts">
        <div class="ro"><span>Time</span><strong id="rt">0.00<em>s</em></strong></div>
        <div class="ro x"><span>Position</span><strong id="rx">−6.00<em>m</em></strong></div>
        <div class="ro v"><span>Velocity</span><strong id="rv">4.00<em>m/s</em></strong></div>
        <div class="ro a"><span>Acceleration</span><strong id="ra">−1.20<em>m/s²</em></strong></div>
      </div>
      <p class="status" id="status" aria-live="polite"></p>
    </div>

</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const TMAX=10, TRUN=12, XLIM=10, LX=50, RX=950, PPM=(RX-LX)/20, FLOOR=150, K=0.605;
const P={x0:-9,v0:0,a:0.6};
let t=0, running=false, ended=false, endReason='', simSpeed=1, tEnd=TMAX;
const fmt=(n,d)=>{const s=Math.abs(n)<0.5*Math.pow(10,-d)?0:n;return (s<0?'−':'')+Math.abs(s).toFixed(d)};
const pos=tt=>P.x0+P.v0*tt+0.5*P.a*tt*tt;
const vel=tt=>P.v0+P.a*tt;
function computeEnd(){tEnd=TRUN;endReason='time'}
function turnTime(){if(Math.abs(P.a)<1e-9)return null;const tt=-P.v0/P.a;return tt>1e-6&&tt<tEnd?tt:null}

/* number line */
(function(){let s=`<line x1="${LX-12}" y1="${FLOOR}" x2="${RX+12}" y2="${FLOOR}" stroke="#b9ae9f" stroke-width="3" stroke-linecap="round"/>`;
for(let m=-10;m<=10;m++){const X=LX+(m+10)*PPM,big=m%2===0;s+=`<line x1="${X}" y1="${FLOOR+1}" x2="${X}" y2="${FLOOR+(big?13:7)}" stroke="#a69a89" stroke-width="${m===0?2.5:1.5}"/>`;
if(big)s+=`<text x="${X}" y="${FLOOR+32}" fill="#6f6556" font-size="${m===0?16:14}" font-family="JetBrains Mono, monospace" text-anchor="middle">${m<0?'−'+(-m):m}</text>`}
s+=`<text x="${RX+6}" y="${FLOOR+52}" fill="#8a7f70" font-size="13" font-family="JetBrains Mono, monospace" text-anchor="end">x (m)</text>`;
$('axis').innerHTML=s})();

/* cat rig */
const HIP=[[94,112],[117,114],[175,108],[191,108]],KNEE=[[90,144],[116,146],[173,148],[192.5,148]],FY=182,FOOT=[[89,FY],[119,FY],[173,FY],[195,FY]];
const CEN=[HIP[0][0],HIP[1][0],FOOT[2][0],FOOT[3][0]];
const OFF=[0,0.5,0.25,0.75];const L1=[],L2=[],R1=[],R2=[];const D2R=180/Math.PI;
for(let i=0;i<4;i++){const h=HIP[i],k=KNEE[i],f=FOOT[i];L1[i]=Math.hypot(k[0]-h[0],k[1]-h[1]);L2[i]=Math.hypot(f[0]-k[0],f[1]-k[1]);R1[i]=Math.atan2(k[1]-h[1],k[0]-h[0]);R2[i]=Math.atan2(f[1]-k[1],f[0]-k[0])}
const legEl=[0,1,2,3].map(i=>$('l'+i)),kneeEl=[0,1,2,3].map(i=>$('k'+i));
const GS={f:1,D:0.65,H:0,crouch:0.5,bw:0,br:0,tail:3,pitch:0,W:0,fb:0,hl:1,hcf:0,hb:0},GW={f:1.05,D:0.65,H:7,crouch:8,bw:1.1,br:0,tail:5,pitch:0.3,W:45,fb:6,hl:0.7,hcf:0.2,hb:-4},GR={f:2.6,D:0.38,H:13,crouch:8,bw:0.5,br:3,tail:10,pitch:1.2,W:80,fb:6,hl:1,hcf:0.2,hb:-6};
function lerpG(A,B,s){const o={};for(const k in A)o[k]=A[k]+(B[k]-A[k])*s;return o}
function gait(u){let g=u<=80?lerpG(GS,GW,u/80):lerpG(GW,GR,Math.min(1,(u-80)/200));if(u>280)g.f=GR.f*Math.sqrt(u/280);return g}
function swingX(s,S,D){const p0=-S/2,p1=S/2,m=-0.5*S*(1-D)/D;const s2=s*s,s3=s2*s;return (2*s3-3*s2+1)*p0+(s3-2*s2+s)*m+(-2*s3+3*s2)*p1+(s3-s2)*m}
function ik(i,fx,fy,extra){const h=HIP[i];const dx=fx-h[0],dy=fy-h[1];let d=Math.hypot(dx,dy);const mx=L1[i]+L2[i]-0.01,sf=4;if(d>mx-sf)d=mx-sf*Math.exp(-(d-(mx-sf))/sf);d=Math.max(Math.abs(L1[i]-L2[i])+1,d);const a0=Math.atan2(dy,dx);const c=(L1[i]*L1[i]+d*d-L2[i]*L2[i])/(2*L1[i]*d);const al=Math.acos(Math.max(-1,Math.min(1,c)));const t1=a0+al;const kx=h[0]+L1[i]*Math.cos(t1),ky=h[1]+L1[i]*Math.sin(t1);const ex=h[0]+d*Math.cos(a0),ey=h[1]+d*Math.sin(a0);const t2=Math.atan2(ey-ky,ex-kx);const r1=(t1-R1[i])*D2R;const r2=(t2-R2[i])*D2R-r1+extra;legEl[i].setAttribute('transform',`rotate(${r1.toFixed(2)} ${h[0]} ${h[1]})`);kneeEl[i].setAttribute('transform',`rotate(${r2.toFixed(2)} ${KNEE[i][0]} ${KNEE[i][1]})`)}
let sleeping=false,ph=0,us=0,sy=0.5,sp=0,dir=1,bt=0,cur=gait(0),headY=0,turn=null;
const ease=p=>0.5-0.5*Math.cos(Math.PI*Math.min(1,Math.max(0,p)));
const PARTS=[['tw',82,0,0.5],['bw',140,0,0.48],['w0',94,-12,0.45],['w1',117,12,0.45],['w2',175,-12,0.45],['w3',191,12,0.45],['hw',207,0,0.5]].map(([id,ax,z,m])=>({el:$(id),ax,z,m}));
let nearBack=false;
function turnState(){const base=d=>d>0?0:Math.PI;if(!turn)return {th:base(dir),cs:1,dy:0};const p=turn.p,e=ease(p);return {th:base(turn.from)+(base(turn.to)-base(turn.from))*e,cs:1+0.07*Math.sin(Math.PI*p),dy:4*Math.sin(Math.PI*p)}}
function rig(th){const c=Math.cos(th),s=Math.sin(th);
  for(const q of PARTS){const dxp=(q.ax-150)*c+q.z*s,sx=(c>=0?1:-1)*Math.max(q.m,Math.abs(c));q.el.setAttribute('transform',`translate(${(150+dxp).toFixed(2)},0) scale(${sx.toFixed(4)},1) translate(${-q.ax},0)`)}
  const nb=th>Math.PI/2;if(nb!==nearBack){nearBack=nb;const B=$('backL'),F=$('frontL');if(nb){B.appendChild($('w1'));B.appendChild($('w3'));F.appendChild($('w0'));F.appendChild($('w2'))}else{B.appendChild($('w0'));B.appendChild($('w2'));F.appendChild($('w1'));F.appendChild($('w3'))}}
  const so=Math.min(1,Math.max(0,(Math.abs(c)-0.22)/0.2));$('hw').setAttribute('opacity',so.toFixed(3));$('fhw').setAttribute('opacity',(1-so).toFixed(3));
  $('fhw').setAttribute('transform',`translate(${((207-150)*c).toFixed(2)},0)`)}
function poseCat(dt,uTarget){
  us+=(uTarget-us)*Math.min(1,dt*10);if(us<0.05&&uTarget===0)us=0;
  const g=gait(us);for(const k in cur)cur[k]+=(g[k]-cur[k])*Math.min(1,dt*8);
  ph+=2*Math.PI*cur.f*dt;
  const ty=cur.crouch+cur.bw*Math.cos(ph*2)+cur.br*Math.cos(ph);sy+=(ty-sy)*Math.min(1,dt*12);
  sp+=(cur.pitch*Math.sin(ph)-sp)*Math.min(1,dt*10);
  const S=us*cur.D/cur.f,ground=FY-sy,hc=cur.hcf*cur.crouch;
  $('h0').setAttribute('transform',`translate(0,${(-hc).toFixed(2)})`);$('h1').setAttribute('transform',`translate(0,${(-hc).toFixed(2)})`);
  for(let i=0;i<4;i++){const front=i>=2,cx=CEN[i]+(front?cur.fb:cur.hb),gy=front?ground:ground+hc;let u=(ph/(2*Math.PI)+OFF[i])%1;if(u<0)u+=1;let fx,fy,extra=0;
    if(u<cur.D){const s=u/cur.D;fx=cx+S/2-S*s;fy=gy}
    else{const s=(u-cur.D)/(1-cur.D);fx=cx+swingX(s,S,cur.D);
      if(front){fy=gy-cur.H*0.35*Math.sin(Math.PI*s);extra=cur.W*Math.max(0,Math.sin(Math.PI*Math.min(1,s*1.35)))}else fy=gy-cur.H*cur.hl*Math.sin(Math.PI*s)}
    ik(i,fx,fy,extra)}
  $('pitch').setAttribute('transform',`rotate(${sp.toFixed(3)} 140 112)`);
  $('tail').setAttribute('transform',`rotate(${(cur.tail*Math.sin(ph*0.5)).toFixed(2)} 82 100)`);
  headY=-0.4*(sy-cur.crouch);
}
function placeCat(xm){const X=LX+(xm+10)*PPM;
  $('cat').style.display=sleeping?'none':'';$('catS').style.display=sleeping?'':'none';$('arrows').style.display=sleeping?'none':'';
  if(sleeping)$('catS').setAttribute('transform',`translate(${X.toFixed(2)},${FLOOR}) scale(${(K*0.92).toFixed(4)}) translate(-100,-176)`);const T=turnState(),k=K*T.cs,Y=FLOOR+T.dy;
  $('cat').setAttribute('transform',`translate(${X.toFixed(2)},${Y.toFixed(2)}) scale(${k.toFixed(4)}) translate(-150,${(-FY+sy).toFixed(2)})`);
  rig(T.th);
  $('head').setAttribute('transform',`translate(0,${headY.toFixed(2)})`);$('fHead').setAttribute('transform',`translate(0,${headY.toFixed(2)})`);
  $('marker').setAttribute('d',`M${X} ${FLOOR+2} l-7 11 h14 z`);
  arrow('v',X,44,vel(t)*18);arrow('a',X,22,P.a*30);offInd(X,xm)}
function offInd(X,xm){const g=$('off');if(X>1078||X<-78){const right=X>0,ex=right?986:14;g.setAttribute('opacity','1');$('offArrow').setAttribute('d',right?`M${ex} 96 l-14 -10 v20 z`:`M${ex} 96 l14 -10 v20 z`);const tx=$('offText');tx.setAttribute('x',right?ex-22:ex+22);tx.setAttribute('text-anchor',right?'end':'start');tx.textContent=`off screen · x = ${fmt(xm,1)} m`}else g.setAttribute('opacity','0')}
function arrow(k,X,y,len){const line=$(k+'Line'),head=$(k+'Head'),lab=$(k+'Lab');if(Math.abs(len)<3){line.setAttribute('d','');head.setAttribute('d','');lab.setAttribute('x',X);lab.setAttribute('y',y+5);lab.setAttribute('opacity','0.55');return}
  const s=Math.sign(len),x1=X+len,xb=x1-s*9;line.setAttribute('d',`M${X} ${y} H${xb}`);head.setAttribute('d',`M${x1} ${y} L${xb} ${y-6} L${xb} ${y+6} Z`);lab.setAttribute('x',X-s*12);lab.setAttribute('y',y+5);lab.setAttribute('opacity','1')}

/* graphs */
const graphs=[{id:'gx',key:'x',fn:pos},{id:'gv',key:'v',fn:vel},{id:'ga',key:'a',fn:()=>P.a}].map(g=>({...g,cv:$(g.id),ctx:$(g.id).getContext('2d')}));
function nice(r){const raw=r/4,p=Math.pow(10,Math.floor(Math.log10(raw))),m=raw/p;return (m<1.5?1:m<3?2:m<7?5:10)*p}
function ranges(){const tg=Math.min(tEnd,TMAX),v1=Math.abs(P.v0),v2=Math.abs(vel(tg));const vm=Math.max(1,Math.ceil(Math.max(v1,v2)+0.5));const am=Math.max(1,Math.ceil(Math.abs(P.a)+0.5));const xs=[pos(0),pos(tg)];const tt=turnTime();if(tt!==null&&tt<=TMAX)xs.push(pos(tt));const lo=Math.floor(Math.min(-10,...xs)/5)*5,hi=Math.ceil(Math.max(10,...xs)/5)*5;return {x:[lo,hi],v:[-vm,vm],a:[-am,am]}}
let R=ranges();
function sizeCanvas(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;if(c.width!==Math.round(w*dpr)||c.height!==Math.round(h*dpr)){c.width=Math.round(w*dpr);c.height=Math.round(h*dpr)}return {w,h,dpr}}
function drawGraphs(){const cs=getComputedStyle(document.documentElement);const col={grid:cs.getPropertyValue('--grid').trim(),line:cs.getPropertyValue('--line').trim(),muted:cs.getPropertyValue('--muted').trim(),ink:cs.getPropertyValue('--ink').trim(),axis:cs.getPropertyValue('--axis').trim()};
  const showPred=$('pred').checked,tt=turnTime();
  for(const g of graphs){const {w,h,dpr}=sizeCanvas(g.cv),c=g.ctx;c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,w,h);
    const color=cs.getPropertyValue('--'+g.key).trim();const [y0,y1]=R[g.key];const L=40,Rr=w-10,T=10,B=h-26;
    const px=tv=>L+tv/TMAX*(Rr-L),py=v=>B-(v-y0)/(y1-y0)*(B-T);
    c.font='11px "JetBrains Mono", ui-monospace, monospace';c.textBaseline='middle';
    c.lineWidth=1;c.strokeStyle=col.grid;
    for(let s=0;s<=TMAX;s++){c.beginPath();c.moveTo(px(s)+.5,T);c.lineTo(px(s)+.5,B);c.stroke()}
    const st=nice(y1-y0);c.fillStyle=col.axis;c.textAlign='right';
    for(let v=Math.ceil(y0/st)*st;v<=y1+1e-9;v+=st){const Y=Math.round(py(v))+.5;c.strokeStyle=Math.abs(v)<1e-9?col.muted:col.grid;c.lineWidth=Math.abs(v)<1e-9?1.2:1;c.beginPath();c.moveTo(L,Y);c.lineTo(Rr,Y);c.stroke();c.fillText(fmt(v,st<1?1:0),L-6,Y)}
    c.textAlign='center';c.textBaseline='top';for(let s=0;s<=TMAX;s+=2)c.fillText(String(s),px(s),B+6);
    c.textAlign='right';c.fillText('t (s)',Rr,B+6);
    c.strokeStyle=col.line;c.lineWidth=1;c.strokeRect(L+.5,T+.5,Rr-L,B-T);
    c.save();c.beginPath();c.rect(L,T-2,Rr-L,B-T+4);c.clip();
    if(showPred){c.setLineDash([5,5]);c.globalAlpha=.4;c.strokeStyle=color;c.lineWidth=2;c.beginPath();for(let i=0;i<=200;i++){const tv=tEnd*i/200;i?c.lineTo(px(tv),py(g.fn(tv))):c.moveTo(px(tv),py(g.fn(tv)))}c.stroke();c.setLineDash([]);c.globalAlpha=1}
    if(tt!==null&&(t>=tt||showPred)){c.setLineDash([3,4]);c.strokeStyle=col.muted;c.lineWidth=1;c.beginPath();c.moveTo(px(tt),T);c.lineTo(px(tt),B);c.stroke();c.setLineDash([]);c.fillStyle=col.muted;c.textAlign=px(tt)>Rr-80?'right':'left';c.textBaseline='top';c.fillText('turns around',px(tt)+(c.textAlign==='left'?5:-5),T+4)}
    if(t>0){c.strokeStyle=color;c.lineWidth=2.5;c.lineJoin='round';c.beginPath();const n=Math.max(2,Math.ceil(240*t/TMAX));for(let i=0;i<=n;i++){const tv=t*i/n;i?c.lineTo(px(tv),py(g.fn(tv))):c.moveTo(px(tv),py(g.fn(tv)))}c.stroke()}
    c.fillStyle=color;c.beginPath();c.arc(px(t),py(g.fn(t)),4.5,0,Math.PI*2);c.fill();
    c.restore()}}

/* UI */
function readouts(){$('rt').innerHTML=fmt(t,2)+'<em>s</em>';$('rx').innerHTML=fmt(pos(t),2)+'<em>m</em>';$('rv').innerHTML=fmt(vel(t),2)+'<em>m/s</em>';$('ra').innerHTML=fmt(P.a,2)+'<em>m/s²</em>'}
function status(){const tt=turnTime();let s;
  if(sleeping){$('status').textContent=`She's fast asleep at x = ${fmt(pos(t),1)} m. With v = 0 and a = 0, she isn't going anywhere.`;return}
  const xn=pos(t),off=Math.abs(xn)>12.3,back=off&&Math.sign(vel(t))===-Math.sign(xn)&&Math.abs(vel(t))>0.02;
  if(ended)s=`Time's up at t = ${TRUN} s. She finished at x = ${fmt(xn,2)} m${off?', off screen':''}.`;
  else if(running&&off)s=back?`She's off screen at x = ${fmt(xn,1)} m and heading back.`:`She's off screen at x = ${fmt(xn,1)} m and still moving away.`;
  else if(!running&&t===0)s=tt!==null?`Ready. With these settings she'll turn around at t = ${fmt(tt,2)} s.`:'Ready. Press play.';
  else if(!running)s='Paused.';
  else if(tt!==null&&t>=tt)s=`She turned around at t = ${fmt(tt,2)} s, at x = ${fmt(pos(tt),2)} m, where her velocity hit zero.`;
  else if(Math.abs(vel(t))<0.05)s='Standing still for an instant.';
  else{const speeding=P.a!==0&&Math.sign(P.a)===Math.sign(vel(t));s=P.a===0?'Moving at constant velocity.':speeding?'Speeding up: velocity and acceleration point the same way.':'Slowing down: acceleration points against her velocity.'}
  $('status').textContent=s}
function setPlay(){$('play').textContent=running?'Pause':ended?'Replay':t>0?'Resume':'Play'}
function syncInputs(){$('x0').value=P.x0;$('v0').value=P.v0;$('a').value=P.a;$('x0o').textContent=fmt(P.x0,1);$('v0o').textContent=fmt(P.v0,1);$('ao').textContent=fmt(P.a,2)}
function reset(){t=0;running=false;ended=false;turn=null;computeEnd();R=ranges();dir=P.v0!==0?Math.sign(P.v0):(P.a!==0?Math.sign(P.a):1);us=0;syncInputs();readouts();status();setPlay();placeCat(pos(0));drawGraphs()}
['x0','v0','a'].forEach(k=>$(k).addEventListener('input',e=>{P[k]=parseFloat(e.target.value);sleeping=false;reset()}));
document.querySelectorAll('.step').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.t,el=$(k),st=parseFloat(el.step),v=Math.round((parseFloat(el.value)+st*parseFloat(b.dataset.d))/st)*st;P[k]=Math.min(parseFloat(el.max),Math.max(parseFloat(el.min),parseFloat(v.toFixed(4))));sleeping=false;reset()}));
document.querySelectorAll('[data-p]').forEach(b=>b.addEventListener('click',()=>{const [x,v,a]=b.dataset.p.split(',').map(Number);P.x0=x;P.v0=v;P.a=a;sleeping=!!b.dataset.sleep;reset()}));
$('play').addEventListener('click',()=>{if(ended)reset();running=!running;setPlay();status()});
$('reset').addEventListener('click',reset);
document.querySelectorAll('[data-s]').forEach(b=>b.addEventListener('click',()=>{simSpeed=parseFloat(b.dataset.s);document.querySelectorAll('[data-s]').forEach(o=>o.setAttribute('aria-pressed',o===b?'true':'false'))}));
$('pred').addEventListener('change',drawGraphs);
window.addEventListener('resize',drawGraphs);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawGraphs)}catch(e){}
new MutationObserver(drawGraphs).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

let last=null,statusTick=0;
function frame(now){if(last===null)last=now;const rdt=Math.min((now-last)/1000,0.05);last=now;
  const sdt=rdt*simSpeed;
  if(running){t+=sdt;if(t>=tEnd){t=tEnd;running=false;ended=true;setPlay();status()}
    const v=vel(t);if(Math.abs(v)>0.02){const nd=Math.sign(v);if(nd!==dir){turn={from:dir,to:nd,p:0};dir=nd}}
    poseCat(sdt,running?Math.abs(v)*PPM/K:0);placeCat(pos(t));readouts();drawGraphs();
    if(++statusTick%10===0)status()}
  else if(ended&&us>0){poseCat(rdt,0);placeCat(pos(t))}
  else if(t===0&&!running){poseCat(rdt,0);placeCat(pos(0))}
  else if(turn){placeCat(pos(t))}
  if(turn){turn.p+=rdt/0.9;if(turn.p>=1){turn=null;placeCat(pos(t))}}
  bt+=rdt;const s=bt>3.4?0.12:1;if(bt>3.54)bt=0;$('eyes').setAttribute('transform',`translate(0,74) scale(1,${s}) translate(0,-74)`);
  if(sleeping)animSleep(now/1000);
  requestAnimationFrame(frame)}
function animSleep(t){const b=0.5-0.5*Math.cos(2*Math.PI*t/3.6);
  $('zbody').setAttribute('transform',`translate(96,176) scale(${(1+0.012*b).toFixed(4)},${(1+0.05*b).toFixed(4)}) translate(-96,-176)`);
  $('zhead').setAttribute('transform',`translate(0,${(-2.2*b).toFixed(2)})`);$('ztail').setAttribute('transform',`translate(0,${(-0.8*b).toFixed(2)})`);
  for(let i=0;i<3;i++){const z=$('z'+i),p=((t/3.6)+i/3)%1,x=166+p*34+Math.sin(p*6)*3,y=104-p*70,sc=0.8+p,o=p<0.15?p/0.15:1-(p-0.15)/0.85;z.setAttribute('transform',`translate(${x.toFixed(1)},${y.toFixed(1)}) scale(${sc.toFixed(2)})`);z.setAttribute('opacity',Math.max(0,o).toFixed(2))}}
reset();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawGraphs);
requestAnimationFrame(frame);
})();
</script>
</body>
